/* ==========================================================================
 * MODULE: Storage — autosave to localStorage with graceful degradation.
 * ========================================================================== */
const Storage = {
  available: true,
  lastSavedAt: null,

  init() {
    try {
      const probe = "__atlas_probe__";
      localStorage.setItem(probe, "1");
      localStorage.removeItem(probe);
    } catch (_) {
      this.available = false;
      store.ui.saveState = "error";
    }
    this.queue = debounce(() => this.saveNow({ quiet: true }), TIMING.AUTOSAVE_DEBOUNCE);
    bus.on(EVENTS.DOC, () => this.onMutation());
    bus.on(EVENTS.SETTINGS, () => { this.saveSettings(); this.onMutation(); });
    on(window, "beforeunload", () => { if (store.ui.dirty) this.saveNow({ quiet: true }); });
    on(document, "visibilitychange", () => { if (document.hidden && store.ui.dirty) this.saveNow({ quiet: true }); });
  },

  onMutation() {
    if (!store.settings.autosave || !this.available) return;
    store.ui.saveState = "dirty";
    Renderer.invalidate("chrome");
    this.queue();
  },

  setState(state) {
    store.ui.saveState = state;
    Renderer.invalidate("chrome");
  },

  saveNow({ quiet = false } = {}) {
    if (!this.available) {
      if (!quiet) Toast.error("This browser blocks local storage, so autosave is off. Export to keep your work.");
      return false;
    }
    this.queue.cancel();
    this.setState("saving");
    try {
      localStorage.setItem(APP.STORAGE_KEY, JSON.stringify(store.toJSON()));
      this.saveSettings();
      store.ui.dirty = false;
      this.lastSavedAt = new Date();
      this.setState("saved");
      return true;
    } catch (error) {
      this.setState("error");
      if (!quiet) Toast.error("Could not save — storage is full. Export your map to keep it safe.");
      return false;
    }
  },

  saveSettings() {
    if (!this.available) return;
    try { localStorage.setItem(APP.SETTINGS_KEY, JSON.stringify(store.settings)); } catch (_) { /* non-fatal */ }
  },

  loadSettings() {
    if (!this.available) return;
    try {
      const raw = localStorage.getItem(APP.SETTINGS_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (!isPlainObject(parsed)) return;
      const next = {};
      for (const key in DEFAULT_SETTINGS) {
        if (key in parsed && typeof parsed[key] === typeof DEFAULT_SETTINGS[key]) next[key] = parsed[key];
      }
      store.updateSettings(next, { silent: true });
    } catch (_) { /* fall back to defaults */ }
  },

  loadDocument() {
    if (!this.available) return null;
    try {
      const raw = localStorage.getItem(APP.STORAGE_KEY);
      if (!raw) return null;
      return Importer.normalizeDocument(JSON.parse(raw));
    } catch (_) {
      return null;
    }
  },

  clear() {
    if (!this.available) return;
    try {
      localStorage.removeItem(APP.STORAGE_KEY);
      localStorage.removeItem(APP.SETTINGS_KEY);
    } catch (_) { /* non-fatal */ }
  },
};

/* ==========================================================================
 * MODULE: Importer — validation, repair and document loading.
 * ========================================================================== */
const Importer = {
  /** Never throws: returns a consistent document or null when unusable. */
  normalizeDocument(data) {
    if (!isPlainObject(data) || !Array.isArray(data.nodes)) return null;
    const nodes = this.normalizeNodes(data.nodes);
    if (!nodes.length) return null;
    const edges = this.normalizeEdges(Array.isArray(data.edges) ? data.edges : [], nodes);
    const viewport = isPlainObject(data.viewport) ? {
      x: Number.isFinite(data.viewport.x) ? data.viewport.x : 0,
      y: Number.isFinite(data.viewport.y) ? data.viewport.y : 0,
      zoom: clamp(Number.isFinite(data.viewport.zoom) ? data.viewport.zoom : 1, VIEW.MIN_ZOOM, VIEW.MAX_ZOOM),
    } : null;
    const settings = isPlainObject(data.settings) ? data.settings : null;
    return {
      title: typeof data.title === "string" ? sanitizeText(data.title, 120) : "Imported map",
      nodes, edges, viewport, settings,
    };
  },

  normalizeNodes(list) {
    const seen = new Set();
    const nodes = [];
    for (const raw of list) {
      if (!isPlainObject(raw)) continue;
      const node = makeNode(raw);
      if (seen.has(node.id)) node.id = uid("n");
      seen.add(node.id);
      nodes.push(node);
    }
    const byId = new Map(nodes.map((n) => [n.id, n]));
    for (const node of nodes) {
      if (node.parentId && !byId.has(node.parentId)) node.parentId = null;
      if (node.parentId === node.id) node.parentId = null;
    }
    this.breakCycles(nodes, byId);
    for (const node of nodes) {
      if (node.width < NODE.MIN_W || node.height < NODE.MIN_H) {
        const m = NodeStyle.measure(node, !node.parentId);
        node.width = Math.max(node.width, m.width);
        node.height = Math.max(node.height, m.height);
      }
    }
    return nodes;
  },

  breakCycles(nodes, byId) {
    for (const node of nodes) {
      const seen = new Set([node.id]);
      let current = node;
      while (current.parentId) {
        if (seen.has(current.parentId)) { current.parentId = null; break; }
        seen.add(current.parentId);
        const parent = byId.get(current.parentId);
        if (!parent) { current.parentId = null; break; }
        current = parent;
      }
    }
  },

  normalizeEdges(list, nodes) {
    const ids = new Set(nodes.map((n) => n.id));
    const edges = [];
    const seenPairs = new Set();
    const seenIds = new Set();
    for (const raw of list) {
      if (!isPlainObject(raw)) continue;
      const source = typeof raw.source === "string" ? raw.source : null;
      const target = typeof raw.target === "string" ? raw.target : null;
      if (!source || !target || source === target) continue;
      if (!ids.has(source) || !ids.has(target)) continue;
      const pair = `${source}>${target}`;
      if (seenPairs.has(pair)) continue;
      seenPairs.add(pair);
      let id = typeof raw.id === "string" && raw.id ? raw.id : uid("e");
      if (seenIds.has(id)) id = uid("e");
      seenIds.add(id);
      edges.push(makeEdge(source, target, { id }));
    }
    // Guarantee an edge for every parent link so the tree always renders.
    for (const node of nodes) {
      if (!node.parentId) continue;
      const pair = `${node.parentId}>${node.id}`;
      if (seenPairs.has(pair)) continue;
      seenPairs.add(pair);
      edges.push(makeEdge(node.parentId, node.id));
    }
    return edges;
  },

  normalizeFragment(data) {
    if (!isPlainObject(data) || !Array.isArray(data.nodes)) return null;
    const nodes = this.normalizeNodes(data.nodes);
    if (!nodes.length) return null;
    const edges = this.normalizeEdges(Array.isArray(data.edges) ? data.edges : [], nodes);
    return { format: APP.FORMAT, kind: "fragment", nodes, edges };
  },

  load(doc, { label = "Import map" } = {}) {
    if (!doc) { Toast.error("That file is not a valid mind map"); return false; }
    history.transact(label, () => {
      store.replaceDocument({
        title: doc.title,
        nodes: doc.nodes,
        edges: doc.edges,
        viewport: doc.viewport || store.viewport,
      });
      if (doc.settings) {
        const next = {};
        for (const key in DEFAULT_SETTINGS) {
          if (key in doc.settings && typeof doc.settings[key] === typeof DEFAULT_SETTINGS[key]) next[key] = doc.settings[key];
        }
        delete next.theme;
        store.updateSettings(next);
      }
    });
    Renderer.invalidateAll();
    if (!doc.viewport) Viewport.fit(null, { animate: false });
    return true;
  },

  async pickAndLoad() {
    const file = await pickFile(".json,application/json");
    if (!file) return;
    await this.loadFile(file);
  },

  async loadFile(file) {
    if (file.size > LIMITS.MAX_IMPORT_BYTES) { Toast.error("That file is too large to import"); return; }
    try {
      const text = await file.text();
      const doc = this.normalizeDocument(JSON.parse(text));
      if (!doc) { Toast.error("That file is not a valid mind map"); return; }
      const nodeCount = doc.nodes.length;
      const run = () => {
        if (this.load(doc, { label: "Import map" })) {
          Toast.success(`Imported ${pluralize(nodeCount, "node", "nodes")} from ${truncate(file.name, 28)}`);
        }
      };
      if (store.nodes.size > 1) {
        Dialog.confirm(
          "Replace the current map?",
          `“${truncate(file.name, 40)}” contains ${pluralize(nodeCount, "node", "nodes")}. Your current map stays available through Undo.`,
          run,
          { confirmLabel: "Import" }
        );
      } else run();
    } catch (error) {
      Toast.error("Could not read that file — it may be corrupted");
    }
  },

  initDropTarget() {
    const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
    on(dom.app, "dragover", (e) => { stop(e); e.dataTransfer.dropEffect = "copy"; });
    on(dom.app, "drop", (e) => {
      stop(e);
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) { this.loadFile(file); return; }
      const text = e.dataTransfer ? e.dataTransfer.getData("text/plain") : "";
      if (!text) return;
      const world = Viewport.clientToWorld(e.clientX, e.clientY);
      const fragment = Clipboard.parse(text);
      if (fragment) Commands.run("edit.paste", { fragment, world });
      else Commands.run("edit.pasteText", { text, world });
    });
  },

  /* ---------------- starter document ---------------- */
  STARTER: {
    text: "Product roadmap", icon: "🎯", color: "blue",
    children: [
      {
        text: "Discovery", color: "purple", icon: "🔍",
        children: [
          { text: "Customer interviews", tags: ["research"] },
          { text: "Competitive scan" },
          { text: "Opportunity sizing", note: "Model the addressable market before committing engineering time." },
        ],
      },
      {
        text: "Design", color: "pink", icon: "🎨",
        children: [
          { text: "Information architecture" },
          { text: "Prototype", tags: ["figma"] },
          { text: "Usability testing" },
        ],
      },
      {
        text: "Build", color: "green", icon: "🚀",
        children: [
          { text: "Data model" },
          { text: "Editor experience", children: [{ text: "Keyboard flow" }, { text: "Undo & redo" }] },
          { text: "Performance budget", note: "Target 60 fps with 5,000 nodes on the canvas." },
        ],
      },
      {
        text: "Launch", color: "orange", icon: "🏁",
        children: [
          { text: "Docs & onboarding" },
          { text: "Pricing page" },
          { text: "Announcement", tags: ["marketing"] },
        ],
      },
    ],
  },

  buildTree(spec) {
    const nodes = [];
    const edges = [];
    let cursorY = 0;
    const walk = (node, parentId, depth) => {
      const created = makeNode({
        text: node.text,
        parentId,
        icon: node.icon || "",
        color: node.color || (parentId ? "default" : "blue"),
        tags: node.tags || [],
        note: node.note || "",
        x: depth * (LAYOUT.H_GAP + 180),
        y: cursorY,
      });
      const m = NodeStyle.measure(created, !parentId);
      created.width = m.width;
      created.height = m.height;
      cursorY += created.height + LAYOUT.V_GAP;
      nodes.push(created);
      if (parentId) edges.push(makeEdge(parentId, created.id));
      for (const child of node.children || []) walk(child, created.id, depth + 1);
      return created;
    };
    walk(spec, null, 0);
    return { nodes, edges };
  },

  loadStarter() {
    const { nodes, edges } = this.buildTree(this.STARTER);
    store.replaceDocument({ title: "Product roadmap", nodes, edges, viewport: store.viewport });
    Layout.all();
    const bounds = store.contentBounds();
    if (bounds) store.setViewport(Viewport.target(bounds));
    Renderer.invalidateAll();
  },
};

/* ==========================================================================
 * MODULE: SceneDraw — one geometry pass reused by PNG and SVG export.
 * ========================================================================== */
const SceneDraw = {
  /** Text, icon and meta-column layout, mirroring the DOM renderer exactly. */
  layout(node) {
    const isRoot = Graph.isRoot(node);
    const style = NodeStyle.of(isRoot);
    const iconW = node.icon ? NODE.ICON_W + NODE.GAP : 0;
    const rightW = Math.max(0, NodeStyle.reservedWidth(node) - iconW);
    const textWidth = Math.max(24, node.width - style.padX * 2 - iconW - rightW);
    const lines = TextMetrics.wrap(node.text, textWidth, style.fontSize, style.fontWeight);
    const textHeight = lines.length * style.lineH;
    // The meta column is laid out left-to-right: tags, then note, then link.
    const meta = [];
    if (node.tags.length) meta.push({ kind: "tags", width: NodeStyle.tagsWidth(node.tags) });
    if (node.note) meta.push({ kind: "note", width: NODE.BADGE_W });
    if (node.link) meta.push({ kind: "link", width: NODE.BADGE_W });
    const metaWidth = meta.reduce((sum, item) => sum + item.width, 0) + NODE.META_GAP * Math.max(0, meta.length - 1);
    return {
      style, isRoot, lines, iconW, rightW, textWidth, meta,
      textX: node.x + style.padX + iconW,
      firstBaselineY: node.y + (node.height - textHeight) / 2 + style.lineH / 2,
      iconX: node.x + style.padX,
      metaX: node.x + node.width - style.padX - NODE.BORDER - metaWidth,
      centerY: node.y + node.height / 2,
    };
  },

  /** Walks the meta column, handing each item its x position. */
  eachMetaItem(info, visit) {
    let x = info.metaX;
    for (const item of info.meta) {
      visit(item, x);
      x += item.width + NODE.META_GAP;
    }
  },

  visibleEdges() {
    const hidden = store.hiddenSet();
    const out = [];
    for (const edge of store.edges.values()) {
      if (hidden.has(edge.source) || hidden.has(edge.target)) continue;
      const g = EdgeGeometry.of(edge);
      if (g) out.push({ edge, g });
    }
    return out;
  },

  visibleNodes() {
    const hidden = store.hiddenSet();
    const out = [];
    for (const node of store.nodes.values()) if (!hidden.has(node.id)) out.push(node);
    return out;
  },

  toCanvas(ctx) {
    const edgeColor = Palette.raw("--edge");
    for (const { edge, g } of this.visibleEdges()) {
      ctx.save();
      ctx.strokeStyle = edgeColor;
      ctx.lineWidth = g.isRootEdge ? VIEW.EDGE_WIDTH_ROOT : VIEW.EDGE_WIDTH;
      ctx.lineCap = "round";
      if (!g.isTree) ctx.setLineDash([VIEW.EDGE_WIDTH * 3, VIEW.EDGE_WIDTH * 3]);
      ctx.stroke(new Path2D(EdgeGeometry.path(g)));
      ctx.restore();
    }
    for (const node of this.visibleNodes()) this.nodeToCanvas(ctx, node);
  },

  nodeToCanvas(ctx, node) {
    const info = this.layout(node);
    const colors = Palette.node(node.color);
    const radius = info.style.radius;
    ctx.save();
    roundedRectPath(ctx, node.x, node.y, node.width, node.height, radius);
    ctx.fillStyle = colors.bg;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = colors.border;
    ctx.stroke();
    if (colors.accent) {
      const inset = node.height * 0.08;
      roundedRectPath(ctx, node.x, node.y + inset, 3, node.height - inset * 2, 1.5);
      ctx.fillStyle = colors.accent;
      ctx.fill();
    }
    ctx.fillStyle = colors.text;
    ctx.textBaseline = "middle";
    if (node.icon) {
      ctx.font = TextMetrics.fontString(info.style.fontSize + 1, 400);
      ctx.fillText(node.icon, info.iconX, info.centerY);
    }
    ctx.font = TextMetrics.fontString(info.style.fontSize, info.style.fontWeight);
    info.lines.forEach((line, i) => {
      ctx.fillText(line, info.textX, info.firstBaselineY + i * info.style.lineH);
    });
    this.metaToCanvas(ctx, node, info);
    ctx.restore();
  },

  metaToCanvas(ctx, node, info) {
    this.eachMetaItem(info, (item, x) => {
      if (item.kind === "tags") this.tagsToCanvas(ctx, node, info, x);
      else this.badgeToCanvas(ctx, item.kind, x, info.centerY);
    });
  },

  tagsToCanvas(ctx, node, info, startX) {
    let x = startX;
    ctx.font = TextMetrics.fontString(10, 500);
    ctx.textBaseline = "middle";
    for (const tag of node.tags) {
      const w = NodeStyle.tagWidth(tag);
      roundedRectPath(ctx, x, info.centerY - 7, w, 14, 7);
      ctx.fillStyle = Palette.raw("--surface-sunken");
      ctx.fill();
      ctx.fillStyle = Palette.raw("--text-2");
      ctx.fillText(truncate(tag, 12), x + NODE.PAD_TAG, info.centerY);
      x += w + NODE.TAG_GAP;
    }
  },

  /** Draws a note/link badge from the shared 24px icon path set. */
  badgeToCanvas(ctx, name, x, centerY) {
    const scale = NODE.BADGE_W / 24;
    ctx.save();
    ctx.translate(x, centerY - NODE.BADGE_W / 2);
    ctx.scale(scale, scale);
    ctx.strokeStyle = Palette.raw("--text-3");
    ctx.lineWidth = 1.7;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke(new Path2D(ICON_PATHS[name]));
    ctx.restore();
  },

  svgMarkup({ padding = 48 } = {}) {
    const bounds = store.contentBounds();
    if (!bounds) return null;
    const width = Math.ceil(bounds.w + padding * 2);
    const height = Math.ceil(bounds.h + padding * 2);
    const ox = round(padding - bounds.x, 2);
    const oy = round(padding - bounds.y, 2);
    const parts = [];
    parts.push(
      `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" font-family="${escapeHtml(FONT_STACK)}">`
    );
    parts.push(`<rect width="${width}" height="${height}" fill="${escapeHtml(Palette.raw("--bg"))}"/>`);
    parts.push(`<g transform="translate(${ox} ${oy})">`);

    const edgeColor = escapeHtml(Palette.raw("--edge"));
    parts.push(`<g fill="none" stroke="${edgeColor}" stroke-linecap="round">`);
    for (const { g } of this.visibleEdges()) {
      const dash = g.isTree ? "" : ` stroke-dasharray="${VIEW.EDGE_WIDTH * 3} ${VIEW.EDGE_WIDTH * 3}"`;
      const w = g.isRootEdge ? VIEW.EDGE_WIDTH_ROOT : VIEW.EDGE_WIDTH;
      parts.push(`<path d="${EdgeGeometry.path(g)}" stroke-width="${w}"${dash}/>`);
    }
    parts.push("</g>");

    for (const node of this.visibleNodes()) parts.push(this.nodeToSvg(node));
    parts.push("</g></svg>");
    return { markup: parts.join(""), width, height };
  },

  nodeToSvg(node) {
    const info = this.layout(node);
    const colors = Palette.node(node.color);
    const parts = [`<g>`];
    parts.push(
      `<rect x="${round(node.x, 1)}" y="${round(node.y, 1)}" width="${round(node.width, 1)}" height="${round(node.height, 1)}" rx="${info.style.radius}" ` +
      `fill="${escapeHtml(colors.bg)}" stroke="${escapeHtml(colors.border)}" stroke-width="1"/>`
    );
    if (colors.accent) {
      const inset = node.height * 0.08;
      parts.push(
        `<rect x="${round(node.x, 1)}" y="${round(node.y + inset, 1)}" width="3" height="${round(node.height - inset * 2, 1)}" rx="1.5" fill="${escapeHtml(colors.accent)}"/>`
      );
    }
    if (node.icon) {
      parts.push(
        `<text x="${round(info.iconX, 1)}" y="${round(info.centerY, 1)}" font-size="${info.style.fontSize + 1}" dominant-baseline="central">${escapeHtml(node.icon)}</text>`
      );
    }
    parts.push(
      `<text x="${round(info.textX, 1)}" y="${round(info.firstBaselineY, 1)}" font-size="${info.style.fontSize}" ` +
      `font-weight="${info.style.fontWeight}" fill="${escapeHtml(colors.text)}" dominant-baseline="central">`
    );
    info.lines.forEach((line, i) => {
      parts.push(
        `<tspan x="${round(info.textX, 1)}" dy="${i === 0 ? 0 : info.style.lineH}">${escapeHtml(line) || " "}</tspan>`
      );
    });
    parts.push("</text>");
    parts.push(this.metaToSvg(node, info));
    parts.push("</g>");
    return parts.join("");
  },

  metaToSvg(node, info) {
    const parts = [];
    this.eachMetaItem(info, (item, x) => {
      parts.push(item.kind === "tags" ? this.tagsToSvg(node, info, x) : this.badgeToSvg(item.kind, x, info.centerY));
    });
    return parts.join("");
  },

  tagsToSvg(node, info, startX) {
    const parts = [];
    let x = startX;
    for (const tag of node.tags) {
      const w = NodeStyle.tagWidth(tag);
      parts.push(
        `<rect x="${round(x, 1)}" y="${round(info.centerY - 7, 1)}" width="${round(w, 1)}" height="14" rx="7" fill="${escapeHtml(Palette.raw("--surface-sunken"))}"/>` +
        `<text x="${round(x + NODE.PAD_TAG, 1)}" y="${round(info.centerY, 1)}" font-size="10" font-weight="500" fill="${escapeHtml(Palette.raw("--text-2"))}" dominant-baseline="central">${escapeHtml(truncate(tag, 12))}</text>`
      );
      x += w + NODE.TAG_GAP;
    }
    return parts.join("");
  },

  badgeToSvg(name, x, centerY) {
    const scale = round(NODE.BADGE_W / 24, 4);
    return (
      `<g transform="translate(${round(x, 1)} ${round(centerY - NODE.BADGE_W / 2, 1)}) scale(${scale})" ` +
      `fill="none" stroke="${escapeHtml(Palette.raw("--text-3"))}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">` +
      `<path d="${ICON_PATHS[name]}"/></g>`
    );
  },
};

/* ==========================================================================
 * MODULE: Exporter — JSON, PNG, SVG and a standalone HTML snapshot.
 * ========================================================================== */
const Exporter = {
  baseName() { return `${safeFilename(store.title)}-${timestampSlug(new Date())}`; },

  json() {
    const payload = JSON.stringify(store.toJSON(), null, 2);
    downloadText(payload, `${this.baseName()}.json`, "application/json");
    Toast.success("Exported JSON");
  },

  png() {
    const bounds = store.contentBounds();
    if (!bounds) { Toast.error("Nothing to export yet"); return; }
    const padding = 56;
    const cssWidth = bounds.w + padding * 2;
    const cssHeight = bounds.h + padding * 2;
    let scale = Math.min(2, window.devicePixelRatio || 1) * 1.5;
    const maxScale = Math.sqrt(LIMITS.PNG_MAX_PIXELS / (cssWidth * cssHeight));
    scale = clamp(Math.min(scale, maxScale), 0.25, 4);
    const canvas = el("canvas", { width: Math.round(cssWidth * scale), height: Math.round(cssHeight * scale) });
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.fillStyle = Palette.raw("--bg");
    ctx.fillRect(0, 0, cssWidth, cssHeight);
    ctx.translate(padding - bounds.x, padding - bounds.y);
    SceneDraw.toCanvas(ctx);
    canvas.toBlob((blob) => {
      if (!blob) { Toast.error("PNG export failed"); return; }
      downloadBlob(blob, `${this.baseName()}.png`);
      Toast.success(`Exported PNG (${canvas.width}×${canvas.height})`);
    }, "image/png");
  },

  svg() {
    const result = SceneDraw.svgMarkup();
    if (!result) { Toast.error("Nothing to export yet"); return; }
    downloadText(result.markup, `${this.baseName()}.svg`, "image/svg+xml");
    Toast.success("Exported SVG");
  },

  html() {
    const result = SceneDraw.svgMarkup();
    if (!result) { Toast.error("Nothing to export yet"); return; }
    const doc = store.toJSON();
    const json = JSON.stringify(doc).replace(/</g, "\\u003c");
    const page = [
      "<!DOCTYPE html>",
      `<html lang="en"><head><meta charset="utf-8"/>`,
      `<meta name="viewport" content="width=device-width, initial-scale=1"/>`,
      `<title>${escapeHtml(store.title)} — ${escapeHtml(APP.NAME)} snapshot</title>`,
      `<style>`,
      `:root{color-scheme:${Theme.resolved()}}`,
      `body{margin:0;background:${Palette.raw("--bg")};color:${Palette.raw("--text")};`,
      `font-family:${FONT_STACK};display:flex;flex-direction:column;min-height:100vh}`,
      `header{padding:20px 24px 8px}`,
      `h1{margin:0;font-size:19px;font-weight:680;letter-spacing:-.02em}`,
      `p{margin:6px 0 0;font-size:12px;color:${Palette.raw("--text-3")}}`,
      `main{flex:1;overflow:auto;padding:12px 24px 24px}`,
      `svg{max-width:100%;height:auto;border-radius:14px;border:1px solid ${Palette.raw("--border")}}`,
      `</style></head><body>`,
      `<header><h1>${escapeHtml(store.title)}</h1>`,
      `<p>${formatCount(doc.nodes.length)} nodes · ${formatCount(doc.edges.length)} connections · exported ${escapeHtml(new Date().toLocaleString())}</p></header>`,
      `<main>${result.markup}</main>`,
      `<script type="application/json" id="mindmap-data">${json}<\/script>`,
      `</body></html>`,
    ].join("");
    downloadText(page, `${this.baseName()}.html`, "text/html");
    Toast.success("Exported HTML snapshot");
  },
};

/**
 * Builds a wide, deep tree plus cross links, then loads it. Used to verify the
 * render pipeline under load (exposed through Atlas.debug.stress).
 */
function buildStressDocument(nodeCount, extraLinks) {
  const nodes = [];
  const edges = [];
  const root = makeNode({ text: "Stress root", color: "blue", x: 0, y: 0 });
  nodes.push(root);
  const frontier = [root];
  let index = 0;
  while (nodes.length < nodeCount) {
    const parent = frontier[index % frontier.length];
    index += 1;
    for (let i = 0; i < 6 && nodes.length < nodeCount; i += 1) {
      const node = makeNode({
        text: `Node ${nodes.length}`,
        parentId: parent.id,
        color: COLOR_KEYS[nodes.length % COLOR_KEYS.length],
      });
      const m = NodeStyle.measure(node, false);
      node.width = m.width;
      node.height = m.height;
      nodes.push(node);
      edges.push(makeEdge(parent.id, node.id));
      frontier.push(node);
    }
  }
  for (let i = 0; i < extraLinks && nodes.length > 2; i += 1) {
    const a = nodes[(i * 7 + 1) % nodes.length];
    const b = nodes[(i * 13 + 5) % nodes.length];
    if (a.id !== b.id) edges.push(makeEdge(a.id, b.id));
  }
  return { nodes, edges };
}

function loadStressDocument(nodeCount, extraLinks) {
  const { nodes, edges } = buildStressDocument(nodeCount, extraLinks);
  store.replaceDocument({ title: `Stress ${nodeCount}`, nodes, edges, viewport: store.viewport });
  Layout.all("right");
  Viewport.fit(null, { animate: false });
  history.clear();
  Renderer.invalidateAll();
  Renderer.flush(performance.now());
  return { nodes: store.nodeCount(), edges: store.edgeCount() };
}

/* ==========================================================================
 * MODULE: App — bootstrap and wiring. Nothing here knows about internals of
 * the modules it connects; it only routes state events to the renderer.
 * ========================================================================== */
const App = {
  init() {
    Storage.init();
    Storage.loadSettings();
    Minimap.init();
    EdgeRenderer.init();
    Chrome.build();
    Theme.init();
    Interaction.init();
    Keyboard.init();
    Clipboard.init();
    Importer.initDropTarget();
    DebugHud.init();
    this.wireState();
    this.wireWindow();
    Viewport.measure();
    this.loadInitialDocument();
    Renderer.invalidateAll();
    Renderer.flush(performance.now());
    dom.canvas.focus({ preventScroll: true });
    this.publishApi();
  },

  wireState() {
    bus.on(EVENTS.NODES, () => Renderer.invalidate("nodes", "edges", "minimap", "chrome"));
    bus.on(EVENTS.STRUCTURE, () => Renderer.invalidate("nodes", "edges", "minimap"));
    bus.on(EVENTS.EDGES, () => Renderer.invalidate("edges", "minimap", "chrome"));
    bus.on(EVENTS.VIEWPORT, () => Renderer.invalidate("transform", "chrome"));
    bus.on(EVENTS.HISTORY, () => Renderer.invalidate("chrome"));
    bus.on(EVENTS.DOC, () => Renderer.invalidate("chrome"));
    bus.on(EVENTS.SETTINGS, (keys) => {
      if (keys && keys.includes("theme")) Theme.apply();
      Renderer.invalidateAll();
    });
    bus.on(EVENTS.SELECTION, () => {
      if (Editor.active && Editor.id !== store.selection.primary) Editor.commit();
    });
  },

  wireWindow() {
    const onResize = rafThrottle(() => {
      Viewport.measure();
      Minimap.resize();
      EdgeRenderer.resize();
      Renderer.invalidateAll();
    });
    on(window, "resize", onResize);
    if (window.ResizeObserver) new ResizeObserver(onResize).observe(dom.canvas);
    on(window, "hashchange", () => DebugHud.init());
    on(dom.canvas, "keydown", (e) => {
      // Keep Tab inside the canvas: it creates child nodes, it must not tab away.
      if (e.key === "Tab" && !Keyboard.inTextField(e.target)) e.preventDefault();
    });
    on(document, "click", (e) => {
      const link = e.target.closest(".node-badge[title^='http']");
      if (!link) return;
      const nodeEl = link.closest(".node");
      const node = nodeEl ? store.node(nodeEl.dataset.id) : null;
      if (node && node.link) { e.preventDefault(); window.open(node.link, "_blank", "noopener"); }
    });
  },

  loadInitialDocument() {
    const saved = Storage.loadDocument();
    if (saved) {
      store.replaceDocument({
        title: saved.title,
        nodes: saved.nodes,
        edges: saved.edges,
        viewport: saved.viewport || store.viewport,
      });
      if (saved.settings) {
        const next = {};
        for (const key in DEFAULT_SETTINGS) {
          if (key in saved.settings && typeof saved.settings[key] === typeof DEFAULT_SETTINGS[key]) next[key] = saved.settings[key];
        }
        store.updateSettings(next, { silent: true });
      }
      if (!saved.viewport) Viewport.fit(null, { animate: false });
      Toast.info("Restored your saved map", { ms: 2200 });
    } else {
      Importer.loadStarter();
    }
    history.clear();
    store.ui.dirty = false;
    Storage.setState("saved");
    Chrome.syncMinimap();
    Panel.sync();
    const rootId = store.roots()[0];
    if (rootId) Selection.only(rootId);
  },

  /** Small public surface so the file can be embedded or driven externally. */
  publishApi() {
    window.Atlas = {
      version: APP.VERSION,
      store,
      history,
      commands: Commands,
      viewport: Viewport,
      graph: Graph,
      layout: Layout,
      selection: Selection,
      importer: Importer,
      exporter: Exporter,
      renderer: Renderer,
      run: (id, args) => Commands.run(id, args),
      toJSON: () => store.toJSON(),
      load: (data) => Importer.load(Importer.normalizeDocument(data)),
      debug: {
        hud: DebugHud,
        stats: () => ({ ...Renderer.stats, nodes: store.nodeCount(), edges: store.edgeCount() }),
        stress: (nodeCount = 5000, extraLinks = 5000) => loadStressDocument(nodeCount, extraLinks),
      },
    };
  },
};
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", () => App.init(), { once: true });
} else {
  App.init();
}
})();
</script>
</body>
</html>
