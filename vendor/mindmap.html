/* ==========================================================================
 * MODULE: Announce — screen-reader status channel.
 * ========================================================================== */
const Announce = (() => {
  let last = "";
  return (message) => {
    if (!message || message === last) return;
    last = message;
    dom.live.textContent = message;
  };
})();

/* ==========================================================================
 * MODULE: Toast — transient feedback with an optional action.
 * ========================================================================== */
const Toast = (() => {
  const active = new Set();

  function dismiss(node) {
    if (!active.has(node)) return;
    active.delete(node);
    node.classList.add("is-out");
    setTimeout(() => node.remove(), 260);
  }

  function show(message, { kind = "info", ms = TIMING.TOAST_MS, action = null } = {}) {
    const icon = kind === "error" ? "alert" : kind === "success" ? "check" : "info";
    const node = el("div", { class: "toast", dataset: { kind }, html: iconMarkup(icon) });
    node.appendChild(el("span", { text: message }));
    if (action) {
      node.appendChild(el("button", {
        class: "btn btn--sm",
        text: action.label,
        onclick: () => { dismiss(node); action.run(); },
      }));
    }
    dom.toasts.appendChild(node);
    active.add(node);
    Announce(message);
    if (ms > 0) setTimeout(() => dismiss(node), ms);
    return node;
  }

  return {
    info: (m, o) => show(m, { ...o, kind: "info" }),
    success: (m, o) => show(m, { ...o, kind: "success" }),
    error: (m, o) => show(m, { ...o, kind: "error", ms: 5200 }),
  };
})();

/* ==========================================================================
 * MODULE: Palette — resolves theme CSS variables for canvas/SVG output.
 * ========================================================================== */
const Palette = {
  cache: new Map(),
  invalidate() { this.cache.clear(); },
  raw(name) {
    if (this.cache.has(name)) return this.cache.get(name);
    const value = getComputedStyle(dom.root).getPropertyValue(name).trim();
    this.cache.set(name, value);
    return value;
  },
  node(colorKey) {
    if (!colorKey || colorKey === "default") {
      return { bg: this.raw("--node-bg"), border: this.raw("--border"), accent: null, text: this.raw("--node-text") };
    }
    return {
      bg: this.raw(`--c-${colorKey}-bg`),
      border: this.raw(`--c-${colorKey}`),
      accent: this.raw(`--c-${colorKey}`),
      text: this.raw("--text"),
    };
  },
};

/* ==========================================================================
 * MODULE: RenderState — transient, non-persisted inputs to the renderer.
 * ========================================================================== */
const RenderState = {
  query: "",
  matches: null,        // Set<id> | null
  dimOthers: false,
  connect: null,        // { fromId, x, y, targetId }
  dropTargetId: null,   // node highlighted as a re-parent drop target
  marquee: null,        // world rect
  guides: [],           // [{ orient, world }]
  appearing: new Set(),
};

/* ==========================================================================
 * MODULE: EdgeGeometry — anchor + path maths shared by renderer and exporters.
 * ========================================================================== */
const EdgeGeometry = {
  /** Writes anchors into `out` (allocation-free hot path); false if unusable. */
  into(edge, out) {
    const a = store.node(edge.source);
    const b = store.node(edge.target);
    if (!a || !b) return false;
    const acx = a.x + a.width / 2;
    const acy = a.y + a.height / 2;
    const bcx = b.x + b.width / 2;
    const bcy = b.y + b.height / 2;
    const isTree = store.isTreeEdge(edge);
    const horizontal = isTree || Math.abs(bcx - acx) >= Math.abs(bcy - acy);
    if (horizontal) {
      const toRight = bcx >= acx;
      out.x1 = toRight ? a.x + a.width : a.x;
      out.x2 = toRight ? b.x : b.x + b.width;
      out.y1 = acy;
      out.y2 = bcy;
      out.orient = "h";
    } else {
      const below = bcy >= acy;
      out.y1 = below ? a.y + a.height : a.y;
      out.y2 = below ? b.y : b.y + b.height;
      out.x1 = acx;
      out.x2 = bcx;
      out.orient = "v";
    }
    out.isTree = isTree;
    out.isRootEdge = isTree && Graph.isRoot(a);
    return true;
  },

  of(edge) {
    const out = { x1: 0, y1: 0, x2: 0, y2: 0, orient: "h", isTree: false, isRootEdge: false };
    return EdgeGeometry.into(edge, out) ? out : null;
  },

  path(g, style = store.settings.edgeStyle) {
    if (style === "line") return straightBetween(g.x1, g.y1, g.x2, g.y2);
    if (style === "elbow") {
      return g.orient === "h"
        ? elbowBetween(g.x1, g.y1, g.x2, g.y2)
        : `M${round(g.x1, 1)},${round(g.y1, 1)}L${round(g.x1, 1)},${round((g.y1 + g.y2) / 2, 1)}L${round(g.x2, 1)},${round((g.y1 + g.y2) / 2, 1)}L${round(g.x2, 1)},${round(g.y2, 1)}`;
    }
    return EdgeGeometry.curve(g);
  },

  curve(g) {
    const { x1, y1, x2, y2, orient } = g;
    if (orient === "h") {
      const c = clamp(Math.abs(x2 - x1) * 0.5, 22, 190);
      const dir = x2 >= x1 ? 1 : -1;
      return `M${round(x1, 1)},${round(y1, 1)}C${round(x1 + c * dir, 1)},${round(y1, 1)} ${round(x2 - c * dir, 1)},${round(y2, 1)} ${round(x2, 1)},${round(y2, 1)}`;
    }
    const c = clamp(Math.abs(y2 - y1) * 0.5, 22, 190);
    const dir = y2 >= y1 ? 1 : -1;
    return `M${round(x1, 1)},${round(y1, 1)}C${round(x1, 1)},${round(y1 + c * dir, 1)} ${round(x2, 1)},${round(y2 - c * dir, 1)} ${round(x2, 1)},${round(y2, 1)}`;
  },

  /** Control points of the curve used for flattening. */
  controls(g) {
    if (g.orient === "h") {
      const c = clamp(Math.abs(g.x2 - g.x1) * 0.5, 22, 190) * (g.x2 >= g.x1 ? 1 : -1);
      return [g.x1, g.y1, g.x1 + c, g.y1, g.x2 - c, g.y2, g.x2, g.y2];
    }
    const c = clamp(Math.abs(g.y2 - g.y1) * 0.5, 22, 190) * (g.y2 >= g.y1 ? 1 : -1);
    return [g.x1, g.y1, g.x1, g.y1 + c, g.x2, g.y2 - c, g.x2, g.y2];
  },

  /** Polyline approximation, resolution scaled to on-screen length. */
  polyline(g, style, zoom) {
    if (style === "line") return [g.x1, g.y1, g.x2, g.y2];
    if (style === "elbow") {
      return g.orient === "h"
        ? [g.x1, g.y1, (g.x1 + g.x2) / 2, g.y1, (g.x1 + g.x2) / 2, g.y2, g.x2, g.y2]
        : [g.x1, g.y1, g.x1, (g.y1 + g.y2) / 2, g.x2, (g.y1 + g.y2) / 2, g.x2, g.y2];
    }
    const c = EdgeGeometry.controls(g);
    const screenLength = (Math.abs(g.x2 - g.x1) + Math.abs(g.y2 - g.y1)) * zoom;
    const steps = clamp(Math.round(screenLength / 26), 8, 56);
    return sampleCubic(c[0], c[1], c[2], c[3], c[4], c[5], c[6], c[7], steps);
  },

  /**
   * Path limited to the visible rect. Strokes that run far beyond the canvas
   * are pathological for the rasteriser (a dashed 20,000px line generates
   * thousands of dashes), so long edges are flattened and clipped instead.
   */
  clippedPath(g, view, style, zoom) {
    const points = EdgeGeometry.polyline(g, style, zoom);
    const path = new Path2D();
    let drawing = false;
    let hasAny = false;
    for (let i = 0; i + 3 < points.length; i += 2) {
      const clipped = clipSegment(points[i], points[i + 1], points[i + 2], points[i + 3], view);
      if (!clipped) { drawing = false; continue; }
      if (!drawing) { path.moveTo(clipped[0], clipped[1]); drawing = true; }
      path.lineTo(clipped[2], clipped[3]);
      hasAny = true;
    }
    return hasAny ? path : null;
  },
};

/* ==========================================================================
 * MODULE: GridRenderer — screen-space grid that follows the viewport.
 * ========================================================================== */
const GridRenderer = {
  update() {
    const visible = store.settings.showGrid;
    dom.grid.dataset.visible = visible ? "true" : "false";
    if (!visible) return;
    const { x, y, zoom } = store.viewport;
    let minor = VIEW.GRID * zoom;
    while (minor < 7) minor *= VIEW.GRID_MAJOR;
    const major = minor * VIEW.GRID_MAJOR;
    const ox = ((x % minor) + minor) % minor;
    const oy = ((y % minor) + minor) % minor;
    const oxM = ((x % major) + major) % major;
    const oyM = ((y % major) + major) % major;
    dom.grid.style.backgroundSize = `${minor}px ${minor}px, ${minor}px ${minor}px, ${major}px ${major}px, ${major}px ${major}px`;
    dom.grid.style.backgroundPosition = `${ox}px ${oy}px, ${ox}px ${oy}px, ${oxM}px ${oyM}px, ${oxM}px ${oyM}px`;
  },
};

/* ==========================================================================
 * MODULE: NodeRenderer — pooled, culled, signature-diffed DOM nodes.
 * ========================================================================== */
const NodeRenderer = {
  live: new Map(),
  pool: [],
  visibleIds: new Set(),

  create() {
    const node = el("div", { class: "node", role: "button", tabIndex: -1 });
    node.appendChild(el("span", { class: "node-icon", "aria-hidden": "true" }));
    node.appendChild(el("span", { class: "node-text" }));
    node.appendChild(el("span", { class: "node-meta", "aria-hidden": "true" }));
    const toggle = el("button", { class: "node-toggle", tabIndex: -1 });
    toggle.dataset.role = "toggle";
    node.appendChild(toggle);
    const port = el("span", { class: "node-port" });
    port.dataset.role = "port";
    node.appendChild(port);
    const resize = el("span", { class: "node-resize" });
    resize.dataset.role = "resize";
    node.appendChild(resize);
    node.refs = {
      icon: node.children[0],
      text: node.children[1],
      meta: node.children[2],
      toggle,
      port,
      resize,
    };
    return node;
  },

  acquire() {
    const node = this.pool.pop() || this.create();
    node.sig = "";
    return node;
  },

  release(id) {
    const node = this.live.get(id);
    if (!node) return;
    this.live.delete(id);
    node.remove();
    if (this.pool.length < 400) this.pool.push(node);
  },

  elementFor(id) { return this.live.get(id) || null; },

  signature(node, flags) {
    return [
      node.text, node.x, node.y, node.width, node.height, node.color, node.collapsed ? 1 : 0,
      node.icon, node.link ? 1 : 0, node.note ? 1 : 0, node.tags.join(""),
      flags.selected, flags.primary, flags.hover, flags.match, flags.dim, flags.editing,
      flags.childCount, flags.root, flags.side, flags.connectTarget, RenderState.query,
    ].join("␀");
  },

  flagsFor(node) {
    const sel = store.selection;
    const childCount = store.childrenOf(node.id).length;
    const isMatch = !!(RenderState.matches && RenderState.matches.has(node.id));
    return {
      selected: sel.nodes.has(node.id) ? 1 : 0,
      primary: sel.primary === node.id ? 1 : 0,
      hover: store.ui.hoverNodeId === node.id ? 1 : 0,
      match: isMatch ? 1 : 0,
      dim: RenderState.dimOthers && !isMatch ? 1 : 0,
      editing: store.ui.editingId === node.id ? 1 : 0,
      childCount,
      root: Graph.isRoot(node) ? 1 : 0,
      side: Graph.sideOf(node),
      connectTarget:
        (RenderState.connect && RenderState.connect.targetId === node.id) ||
        RenderState.dropTargetId === node.id ? 1 : 0,
    };
  },

  paint(element, node) {
    const flags = this.flagsFor(node);
    const sig = this.signature(node, flags);
    if (element.sig === sig) return;
    element.sig = sig;
    this.paintFrame(element, node, flags);
    this.paintState(element, flags);
    this.paintContent(element, node, flags);
    this.paintAria(element, node, flags);
  },

  paintFrame(element, node, flags) {
    element.dataset.id = node.id;
    element.dataset.shape = flags.root ? "root" : "leaf";
    element.dataset.color = node.color;
    if (node.color === "default") {
      element.style.removeProperty("--node-accent");
      element.style.removeProperty("--node-accent-bg");
    } else {
      element.style.setProperty("--node-accent", `var(--c-${node.color})`);
      element.style.setProperty("--node-accent-bg", `var(--c-${node.color}-bg)`);
    }
    element.style.left = `${node.x}px`;
    element.style.top = `${node.y}px`;
    element.style.width = `${node.width}px`;
    element.style.height = `${node.height}px`;
  },

  paintState(element, flags) {
    toggleClass(element, "is-selected", flags.selected);
    toggleClass(element, "is-primary", flags.primary);
    toggleClass(element, "is-hover", flags.hover);
    toggleClass(element, "is-match", flags.match);
    toggleClass(element, "is-dim", flags.dim);
    toggleClass(element, "is-editing", flags.editing);
    toggleClass(element, "is-connect-target", flags.connectTarget);
    toggleClass(element, "has-children", flags.childCount > 0);
  },

  paintContent(element, node, flags) {
    const refs = element.refs;
    if (!flags.editing) {
      if (RenderState.query && flags.match) refs.text.innerHTML = highlightMatches(node.text, RenderState.query);
      else refs.text.textContent = node.text;
    }
    refs.icon.textContent = node.icon || "";
    refs.icon.hidden = !node.icon;
    this.paintMeta(refs.meta, node);
    this.paintToggle(refs.toggle, node, flags);
    refs.port.dataset.side = flags.side > 0 ? "right" : "left";
  },

  paintAria(element, node, flags) {
    setAttr(element, "aria-label", this.ariaLabel(node, flags));
    setAttr(element, "aria-selected", flags.selected ? "true" : "false");
    setAttr(element, "aria-expanded", flags.childCount ? String(!node.collapsed) : null);
  },

  paintMeta(container, node) {
    const wanted = [];
    if (node.tags.length) wanted.push(`tags:${node.tags.join("")}`);
    if (node.note) wanted.push("note");
    if (node.link) wanted.push("link");
    const key = wanted.join("|");
    if (container.dataset.key === key) return;
    container.dataset.key = key;
    clear(container);
    if (node.tags.length) {
      const tagWrap = el("span", { class: "node-tags" });
      for (const tag of node.tags) tagWrap.appendChild(el("span", { class: "node-tag", text: tag }));
      container.appendChild(tagWrap);
    }
    if (node.note) container.appendChild(el("span", { class: "node-badge", title: "Has note", html: iconMarkup("note") }));
    if (node.link) container.appendChild(el("span", { class: "node-badge", title: node.link, html: iconMarkup("link") }));
    container.hidden = !wanted.length;
  },

  paintToggle(button, node, flags) {
    if (!flags.childCount) { button.hidden = true; return; }
    button.hidden = false;
    button.dataset.side = flags.side > 0 ? "right" : "left";
    if (node.collapsed) {
      const total = store.descendants(node.id).length;
      button.innerHTML = `<span class="count">${total > 99 ? "99+" : total}</span>`;
      setAttr(button, "aria-label", `Expand ${total} hidden nodes`);
      setAttr(button, "title", `Expand ${pluralize(total, "node", "nodes")}`);
    } else {
      button.innerHTML = iconMarkup(flags.side > 0 ? "chevronLeft" : "chevronRight");
      setAttr(button, "aria-label", "Collapse branch");
      setAttr(button, "title", "Collapse branch");
    }
  },

  ariaLabel(node, flags) {
    const parts = [firstLine(node.text) || "Empty node"];
    if (flags.root) parts.push("root");
    if (flags.childCount) parts.push(pluralize(flags.childCount, "child", "children"));
    if (node.collapsed) parts.push("collapsed");
    if (node.tags.length) parts.push(`tags ${node.tags.join(", ")}`);
    if (node.note) parts.push("has note");
    return parts.join(", ");
  },

  update() {
    const view = Viewport.worldRect(VIEW.CULL_MARGIN);
    const hidden = store.hiddenSet();
    const need = this.visibleIds;
    const vx2 = view.x + view.w;
    const vy2 = view.y + view.h;
    need.clear();
    for (const node of store.nodes.values()) {
      if (hidden.has(node.id)) continue;
      if (node.x >= vx2 || node.x + node.width <= view.x) continue;
      if (node.y >= vy2 || node.y + node.height <= view.y) continue;
      need.add(node.id);
    }
    const editingId = store.ui.editingId;
    if (editingId && store.nodes.has(editingId)) need.add(editingId);

    for (const id of Array.from(this.live.keys())) {
      if (!need.has(id)) this.release(id);
    }
    let fragment = null;
    for (const id of need) {
      let element = this.live.get(id);
      if (!element) {
        element = this.acquire();
        this.live.set(id, element);
        if (!fragment) fragment = document.createDocumentFragment();
        fragment.appendChild(element);
      }
      this.paint(element, store.node(id));
    }
    if (fragment) dom.nodeLayer.appendChild(fragment);
    this.flushAppear();
  },

  flushAppear() {
    if (!RenderState.appearing.size) return;
    for (const id of Array.from(RenderState.appearing)) {
      const element = this.live.get(id);
      if (!element) continue;
      RenderState.appearing.delete(id);
      element.classList.remove("is-appear");
      void element.offsetWidth;
      element.classList.add("is-appear");
      setTimeout(() => element.classList.remove("is-appear"), 260);
    }
    RenderState.appearing.clear();
  },
};

/* ==========================================================================
 * MODULE: EdgeRenderer — screen-space canvas painter.
 *
 * Connections live on a high-DPI canvas the size of the viewport rather than
 * in SVG. Long cross-links would otherwise force the browser to rasterise
 * paths spanning the whole world on every pan; here the cost is bounded by
 * what is actually on screen. Path2D objects are kept for exact hit testing.
 * ========================================================================== */
const EdgeRenderer = {
  ctx: null,
  dpr: 1,
  width: 0,
  height: 0,
  live: new Map(),   // edgeId -> { path, geom }
  cache: new Map(),  // edgeId -> { sig, path }
  scratch: { x1: 0, y1: 0, x2: 0, y2: 0, orient: "h", isTree: false, isRootEdge: false },

  init() {
    this.ctx = dom.edgeCanvas.getContext("2d");
    this.resize();
  },

  resize() {
    if (!this.ctx) return;
    this.dpr = clamp(window.devicePixelRatio || 1, 1, 2);
    this.width = dom.edgeCanvas.clientWidth || window.innerWidth;
    this.height = dom.edgeCanvas.clientHeight || window.innerHeight;
    dom.edgeCanvas.width = Math.round(this.width * this.dpr);
    dom.edgeCanvas.height = Math.round(this.height * this.dpr);
  },

  applyWorldTransform() {
    const { x, y, zoom } = store.viewport;
    const d = this.dpr;
    this.ctx.setTransform(zoom * d, 0, 0, zoom * d, x * d, y * d);
  },

  /** Curved edges bulge past their endpoints, so pad the cull rect. */
  cullRect() {
    return Viewport.worldRect(VIEW.CULL_MARGIN + VIEW.EDGE_BULGE * store.viewport.zoom);
  },

  collect() {
    const view = this.cullRect();
    const hidden = store.hiddenSet();
    const style = store.settings.edgeStyle;
    const zoom = store.viewport.zoom;
    const longSpan = Math.max(view.w, view.h) * VIEW.EDGE_CLIP_FACTOR;
    const scratch = this.scratch;
    this.live.clear();
    for (const edge of store.edges.values()) {
      if (hidden.has(edge.source) || hidden.has(edge.target)) continue;
      if (!EdgeGeometry.into(edge, scratch)) continue;
      if (!segmentIntersectsRect(scratch.x1, scratch.y1, scratch.x2, scratch.y2, view)) continue;
      const span = Math.abs(scratch.x2 - scratch.x1) + Math.abs(scratch.y2 - scratch.y1);
      let path;
      if (span > longSpan) {
        path = EdgeGeometry.clippedPath(scratch, view, style, zoom);
        if (!path) continue;
      } else {
        path = this.cachedPath(edge.id, scratch, style);
      }
      this.live.set(edge.id, { geom: { ...scratch }, path });
    }
    if (this.cache.size > store.edges.size + 512) this.cache.clear();
  },

  /** Panning does not change edge geometry, so parsed paths are reused. */
  cachedPath(id, geom, style) {
    const sig = `${geom.x1}|${geom.y1}|${geom.x2}|${geom.y2}|${geom.orient}|${style}`;
    const hit = this.cache.get(id);
    if (hit && hit.sig === sig) return hit.path;
    const path = new Path2D(EdgeGeometry.path(geom, style));
    this.cache.set(id, { sig, path });
    return path;
  },

  /**
   * All plain edges of one kind are merged into a single Path2D and stroked
   * once — thousands of stroke() calls collapse into three.
   */
  update() {
    if (!this.ctx) return;
    this.collect();
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.ctx.clearRect(0, 0, dom.edgeCanvas.width, dom.edgeCanvas.height);
    this.applyWorldTransform();
    const { buckets, counts, highlighted } = this.bucket();
    this.strokeBuckets(buckets, counts);
    this.strokeHighlighted(highlighted);
  },

  /** Groups plain edges by stroke style; hovered/selected ones draw on top. */
  bucket() {
    const buckets = { tree: new Path2D(), root: new Path2D(), link: new Path2D() };
    const counts = { tree: 0, root: 0, link: 0 };
    const highlighted = [];
    for (const [id, entry] of this.live) {
      const selected = store.selection.edges.has(id);
      if (selected || store.ui.hoverEdgeId === id) { highlighted.push({ entry, selected }); continue; }
      const key = !entry.geom.isTree ? "link" : entry.geom.isRootEdge ? "root" : "tree";
      buckets[key].addPath(entry.path);
      counts[key] += 1;
    }
    return { buckets, counts, highlighted };
  },

  /** Dashes below this zoom are finer than the eye resolves and cost far more. */
  dashPattern() {
    const zoom = store.viewport.zoom;
    if (zoom < VIEW.EDGE_DASH_MIN_ZOOM) return null;
    const base = VIEW.EDGE_WIDTH / zoom;
    return [base * 3, base * 3];
  },

  strokeBuckets(buckets, counts) {
    const ctx = this.ctx;
    const zoom = store.viewport.zoom;
    const dash = this.dashPattern();
    ctx.lineCap = "round";
    ctx.strokeStyle = Palette.raw("--edge");
    ctx.setLineDash(EMPTY_ARRAY);
    if (counts.tree) { ctx.lineWidth = VIEW.EDGE_WIDTH / zoom; ctx.stroke(buckets.tree); }
    if (counts.root) { ctx.lineWidth = VIEW.EDGE_WIDTH_ROOT / zoom; ctx.stroke(buckets.root); }
    if (!counts.link) return;
    ctx.lineWidth = VIEW.EDGE_WIDTH / zoom;
    ctx.globalAlpha = dash ? 0.85 : 0.55;
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(buckets.link);
    ctx.setLineDash(EMPTY_ARRAY);
    ctx.globalAlpha = 1;
  },

  strokeHighlighted(highlighted) {
    const ctx = this.ctx;
    const zoom = store.viewport.zoom;
    const dash = this.dashPattern();
    const accent = Palette.raw("--accent");
    const hoverColor = Palette.raw("--edge-hover");
    for (const { entry, selected } of highlighted) {
      ctx.strokeStyle = selected ? accent : hoverColor;
      ctx.lineWidth = (entry.geom.isRootEdge ? VIEW.EDGE_WIDTH_ROOT + 0.8 : VIEW.EDGE_WIDTH + 0.8) / zoom;
      if (!entry.geom.isTree && dash) ctx.setLineDash(dash);
      ctx.stroke(entry.path);
      ctx.setLineDash(EMPTY_ARRAY);
    }
  },

  /** Exact stroke hit test in device pixels (the CTM is applied to the path). */
  hitTest(clientX, clientY) {
    if (!this.ctx || !this.live.size) return null;
    const rect = dom.edgeCanvas.getBoundingClientRect();
    const px = (clientX - rect.left) * this.dpr;
    const py = (clientY - rect.top) * this.dpr;
    const ctx = this.ctx;
    this.applyWorldTransform();
    ctx.lineWidth = VIEW.EDGE_HIT_WIDTH / store.viewport.zoom;
    ctx.setLineDash(EMPTY_ARRAY);
    for (const [id, entry] of this.live) {
      if (ctx.isPointInStroke(entry.path, px, py)) return id;
    }
    return null;
  },
};

/* ==========================================================================
 * MODULE: OverlayRenderer — screen-space affordances (marquee, guides,
 * connection preview, edge endpoint handles for reconnecting).
 * ========================================================================== */
const OverlayRenderer = {
  update() {
    clear(dom.overlay);
    this.drawMarquee();
    this.drawGuides();
    this.drawConnect();
    this.drawEdgeHandles();
  },

  drawMarquee() {
    const r = RenderState.marquee;
    if (!r) return;
    const x = Viewport.toScreenX(r.x);
    const y = Viewport.toScreenY(r.y);
    dom.overlay.appendChild(svgEl("rect", {
      class: "marquee", x, y,
      width: Math.max(1, r.w * store.viewport.zoom),
      height: Math.max(1, r.h * store.viewport.zoom),
      rx: 4,
    }));
  },

  drawGuides() {
    for (const guide of RenderState.guides) {
      if (guide.orient === "v") {
        const x = round(Viewport.toScreenX(guide.world), 1);
        dom.overlay.appendChild(svgEl("line", { class: "guide", x1: x, y1: 0, x2: x, y2: Viewport.height }));
      } else {
        const y = round(Viewport.toScreenY(guide.world), 1);
        dom.overlay.appendChild(svgEl("line", { class: "guide", x1: 0, y1: y, x2: Viewport.width, y2: y }));
      }
    }
  },

  drawConnect() {
    const c = RenderState.connect;
    if (!c) return;
    const from = store.node(c.fromId);
    if (!from) return;
    const side = rectCenterX(rectOf(from)) <= c.x ? 1 : -1;
    const x1 = Viewport.toScreenX(side > 0 ? rectRight(rectOf(from)) : from.x);
    const y1 = Viewport.toScreenY(rectCenterY(rectOf(from)));
    const x2 = Viewport.toScreenX(c.x);
    const y2 = Viewport.toScreenY(c.y);
    dom.overlay.appendChild(svgEl("path", { class: "connect-preview", d: bezierBetween(x1, y1, x2, y2, 0.5) }));
    dom.overlay.appendChild(svgEl("circle", { class: "connect-dot", cx: x2, cy: y2, r: 4 }));
  },

  /**
   * Grab handles for re-routing a connection. Only a *selected* edge gets
   * them, and they sit a little inboard along the curve so they never cover
   * the collapse toggle or connector port on the node they touch.
   */
  drawEdgeHandles() {
    if (RenderState.connect) return;
    if (store.selection.edges.size !== 1) return;
    const edgeId = store.selection.edges.values().next().value;
    const edge = store.edge(edgeId);
    if (!edge) return;
    const g = EdgeGeometry.of(edge);
    if (!g) return;
    const x1 = Viewport.toScreenX(g.x1);
    const y1 = Viewport.toScreenY(g.y1);
    const x2 = Viewport.toScreenX(g.x2);
    const y2 = Viewport.toScreenY(g.y2);
    const length = Math.hypot(x2 - x1, y2 - y1);
    const inset = length > VIEW.EDGE_HANDLE_INSET * 3 ? VIEW.EDGE_HANDLE_INSET / length : 0;
    const points = {
      source: [lerp(x1, x2, inset), lerp(y1, y2, inset)],
      target: [lerp(x2, x1, inset), lerp(y2, y1, inset)],
    };
    for (const end of ["source", "target"]) {
      const handle = svgEl("circle", {
        class: "edge-cap", r: 5,
        cx: round(points[end][0], 1),
        cy: round(points[end][1], 1),
      });
      handle.dataset.role = "edge-handle";
      handle.dataset.edge = edgeId;
      handle.dataset.end = end;
      dom.overlay.appendChild(handle);
    }
  },
};

/* ==========================================================================
 * MODULE: Minimap — canvas overview with viewport indicator and navigation.
 * ========================================================================== */
const Minimap = {
  ctx: null,
  frame: null,

  init() {
    this.ctx = dom.minimap.getContext("2d");
    this.resize();
  },

  resize() {
    if (!this.ctx) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = dom.minimap.clientWidth || 196;
    const h = dom.minimap.clientHeight || 132;
    dom.minimap.width = Math.round(w * dpr);
    dom.minimap.height = Math.round(h * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.w = w;
    this.h = h;
  },

  computeFrame() {
    const content = store.contentBounds();
    const view = Viewport.worldRect(0);
    const bounds = unionRects([content, view].filter(Boolean)) || { x: 0, y: 0, w: 1000, h: 700 };
    const pad = Math.max(bounds.w, bounds.h) * 0.06 + 40;
    const box = { x: bounds.x - pad, y: bounds.y - pad, w: bounds.w + pad * 2, h: bounds.h + pad * 2 };
    const scale = Math.min(this.w / box.w, this.h / box.h);
    return {
      box, scale,
      ox: (this.w - box.w * scale) / 2 - box.x * scale,
      oy: (this.h - box.h * scale) / 2 - box.y * scale,
    };
  },

  update() {
    if (!this.ctx || !store.settings.showMinimap || dom.minimapWrap.hidden) return;
    this.frame = this.computeFrame();
    this.ctx.clearRect(0, 0, this.w, this.h);
    this.drawNodes(this.frame);
    this.drawViewport(this.frame);
  },

  drawNodes(frame) {
    const ctx = this.ctx;
    const hidden = store.hiddenSet();
    const accent = Palette.raw("--accent");
    const dim = Palette.raw("--text-3");
    const minSize = 2 / frame.scale;
    let drawn = 0;
    ctx.save();
    ctx.translate(frame.ox, frame.oy);
    ctx.scale(frame.scale, frame.scale);
    for (const node of store.nodes.values()) {
      if (hidden.has(node.id)) continue;
      if (drawn >= LIMITS.MINIMAP_NODE_CAP) break;
      drawn += 1;
      const selected = store.selection.nodes.has(node.id);
      ctx.fillStyle = selected ? accent : node.color === "default" ? dim : Palette.raw(`--c-${node.color}`);
      ctx.globalAlpha = selected ? 1 : 0.7;
      ctx.fillRect(node.x, node.y, Math.max(node.width, minSize), Math.max(node.height, minSize));
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  },

  drawViewport(frame) {
    const ctx = this.ctx;
    const view = Viewport.worldRect(0);
    const x = view.x * frame.scale + frame.ox;
    const y = view.y * frame.scale + frame.oy;
    const w = view.w * frame.scale;
    const h = view.h * frame.scale;
    const accent = Palette.raw("--accent");
    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.08;
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x, y, w, h);
  },

  toWorld(clientX, clientY) {
    if (!this.frame) return null;
    const rect = dom.minimap.getBoundingClientRect();
    return {
      x: (clientX - rect.left - this.frame.ox) / this.frame.scale,
      y: (clientY - rect.top - this.frame.oy) / this.frame.scale,
    };
  },
};

/* ==========================================================================
 * MODULE: Renderer — dirty-flag scheduler. One rAF per frame, no more.
 * ========================================================================== */
const Renderer = {
  flags: { transform: false, nodes: false, edges: false, overlay: false, minimap: false, chrome: false },
  scheduled: false,
  stats: { fps: 0, renderMs: 0, frames: 0, lastSample: 0 },

  invalidate(...kinds) {
    for (const kind of kinds) this.flags[kind] = true;
    this.schedule();
  },

  invalidateAll() {
    this.invalidate("transform", "nodes", "edges", "overlay", "minimap", "chrome");
  },

  schedule() {
    if (this.scheduled) return;
    this.scheduled = true;
    requestAnimationFrame((now) => this.flush(now));
  },

  flush(now) {
    this.scheduled = false;
    const start = performance.now();
    const f = this.flags;

    if (f.transform) {
      const { x, y, zoom } = store.viewport;
      dom.world.style.transform = `translate(${round(x, 2)}px, ${round(y, 2)}px) scale(${round(zoom, 5)})`;
      GridRenderer.update();
    }
    if (f.nodes || f.transform) NodeRenderer.update();
    if (f.edges || f.transform) EdgeRenderer.update();
    if (f.overlay || f.transform) OverlayRenderer.update();
    if (f.minimap || f.transform) Minimap.update();
    if (f.chrome) Chrome.update();

    for (const key in f) f[key] = false;
    this.stats.renderMs = performance.now() - start;
    this.sampleFps(now || start);
    if (DebugHud.enabled) DebugHud.update();
  },

  sampleFps(now) {
    const s = this.stats;
    s.frames += 1;
    if (!s.lastSample) s.lastSample = now;
    const elapsed = now - s.lastSample;
    if (elapsed >= 500) {
      s.fps = Math.round((s.frames * 1000) / elapsed);
      s.frames = 0;
      s.lastSample = now;
    }
  },
};

/* ==========================================================================
 * MODULE: SelectionManager — the only writer of store.selection.
 * ========================================================================== */
const Selection = {
  changed() {
    bus.emit(EVENTS.SELECTION, null);
    Renderer.invalidate("nodes", "edges", "overlay", "minimap", "chrome");
  },

  get nodeIds() { return Array.from(store.selection.nodes); },
  get edgeIds() { return Array.from(store.selection.edges); },
  get size() { return store.selection.nodes.size + store.selection.edges.size; },
  get primaryId() { return store.selection.primary; },
  primaryNode() { return store.selection.primary ? store.node(store.selection.primary) : null; },
  hasNode(id) { return store.selection.nodes.has(id); },

  set(ids, { primary = null } = {}) {
    const sel = store.selection;
    const next = new Set();
    for (const id of ids) if (store.nodes.has(id)) next.add(id);
    sel.nodes = next;
    sel.edges.clear();
    sel.primary = primary && next.has(primary) ? primary : (next.size ? next.values().next().value : null);
    this.changed();
  },

  only(id) { this.set(id ? [id] : [], { primary: id }); },

  add(ids, { primary = null } = {}) {
    const sel = store.selection;
    for (const id of ids) if (store.nodes.has(id)) sel.nodes.add(id);
    if (primary) sel.primary = primary;
    else if (!sel.primary && sel.nodes.size) sel.primary = sel.nodes.values().next().value;
    this.changed();
  },

  remove(ids) {
    const sel = store.selection;
    for (const id of ids) sel.nodes.delete(id);
    if (sel.primary && !sel.nodes.has(sel.primary)) sel.primary = sel.nodes.size ? sel.nodes.values().next().value : null;
    this.changed();
  },

  toggle(id) {
    if (store.selection.nodes.has(id)) this.remove([id]);
    else this.add([id], { primary: id });
  },

  setEdges(ids) {
    const sel = store.selection;
    sel.nodes.clear();
    sel.primary = null;
    sel.edges = new Set(ids.filter((id) => store.edges.has(id)));
    this.changed();
  },

  toggleEdge(id) {
    const sel = store.selection;
    if (sel.edges.has(id)) sel.edges.delete(id);
    else sel.edges.add(id);
    this.changed();
  },

  clear() {
    const sel = store.selection;
    if (!sel.nodes.size && !sel.edges.size) return;
    sel.nodes.clear();
    sel.edges.clear();
    sel.primary = null;
    this.changed();
  },

  selectAll() {
    const ids = store.visibleNodeIds();
    this.set(ids, { primary: ids[0] });
    Announce(`${pluralize(ids.length, "node", "nodes")} selected`);
  },

  invert() {
    const current = store.selection.nodes;
    const next = store.visibleNodeIds().filter((id) => !current.has(id));
    this.set(next);
  },

  selectSubtree(id) {
    const ids = store.subtree(id).filter((nid) => !store.isHidden(nid) || nid === id);
    this.set(ids, { primary: id });
  },

  selectSiblings(id) {
    const ids = store.siblingsOf(id);
    this.set(ids.length ? ids : [id], { primary: id });
  },

  /** Replaces the selection with the nodes inside a world-space rect. */
  fromRect(rect, additive, base) {
    const hidden = store.hiddenSet();
    const next = additive ? new Set(base) : new Set();
    for (const node of store.nodes.values()) {
      if (hidden.has(node.id)) continue;
      if (rectsIntersect(rectOf(node), rect)) next.add(node.id);
    }
    const sel = store.selection;
    sel.nodes = next;
    sel.edges.clear();
    if (!sel.primary || !next.has(sel.primary)) sel.primary = next.size ? next.values().next().value : null;
    this.changed();
  },

  /** Nodes that should move together with the current selection. */
  dragSet(includeDescendants = true) {
    return Graph.dragSet(this.nodeIds, includeDescendants);
  },

  describe() {
    const nodes = store.selection.nodes.size;
    const edges = store.selection.edges.size;
    if (!nodes && !edges) return "";
    const parts = [];
    if (nodes) parts.push(pluralize(nodes, "node", "nodes"));
    if (edges) parts.push(pluralize(edges, "link", "links"));
    return parts.join(", ");
  },
};

/* ==========================================================================
 * MODULE: Transforms — commits drag/resize gestures as single history entries.
 *
 * Gestures mutate state live (outside any transaction, so nothing is
 * recorded), then this helper rewinds to the original values and replays the
 * final ones inside one transaction. Result: one undo step per gesture.
 * ========================================================================== */
const Transforms = {
  snapshot(ids, fields) {
    const map = new Map();
    for (const id of ids) {
      const node = store.node(id);
      if (node) map.set(id, pick(node, fields));
    }
    return map;
  },

  commit(label, origin, fields, finalize = null) {
    const finals = new Map();
    let changed = false;
    for (const [id, before] of origin) {
      const node = store.node(id);
      if (!node) continue;
      const after = pick(node, fields);
      finals.set(id, after);
      if (shallowDiffers(before, after)) changed = true;
    }
    if (!changed) return false;
    bus.batch(() => { for (const [id, before] of origin) store.updateNode(id, before); });
    history.transact(label, () => {
      bus.batch(() => { for (const [id, after] of finals) store.updateNode(id, after); });
      if (finalize) finalize(Array.from(finals.keys()));
    });
    return true;
  },
};

const POSITION_FIELDS = Object.freeze(["x", "y"]);
const SIZE_FIELDS = Object.freeze(["width", "height", "fixedSize"]);

/* ==========================================================================
 * MODULE: HitTest — world-space picking that ignores the dragged nodes.
 * ========================================================================== */
const HitTest = {
  nodeAt(worldX, worldY, exclude = null) {
    const hidden = store.hiddenSet();
    let best = null;
    let bestArea = Infinity;
    for (const node of store.nodes.values()) {
      if (hidden.has(node.id)) continue;
      if (exclude && exclude.has(node.id)) continue;
      if (!pointInRect(worldX, worldY, rectOf(node))) continue;
      const area = node.width * node.height;
      if (area < bestArea) { bestArea = area; best = node; }
    }
    return best;
  },
};

/* ==========================================================================
 * MODULE: InteractionManager — all pointer input for the canvas.
 * ========================================================================== */
const Interaction = {
  mode: "idle",
  pointers: new Map(),
  gesture: null,
  spaceDown: false,
  pinch: null,
  lastPointer: { x: 0, y: 0, world: { x: 0, y: 0 } },

  init() {
    const canvas = dom.canvas;
    on(canvas, "pointerdown", (e) => this.onPointerDown(e));
    on(window, "pointermove", (e) => this.onPointerMove(e));
    on(window, "pointerup", (e) => this.onPointerUp(e));
    on(window, "pointercancel", (e) => this.onPointerUp(e));
    on(canvas, "wheel", (e) => this.onWheel(e), { passive: false });
    on(canvas, "dblclick", (e) => this.onDoubleClick(e));
    on(canvas, "contextmenu", (e) => this.onContextMenu(e));
    on(dom.minimap, "pointerdown", (e) => this.onMinimapDown(e));
    on(canvas, "pointerleave", () => this.setHover(null, null));
    this.initEdgeHandles();
  },

  initEdgeHandles() {
    on(dom.overlay, "pointerdown", (e) => {
      const handle = e.target.closest('[data-role="edge-handle"]');
      if (!handle) return;
      e.preventDefault();
      e.stopPropagation();
      this.startReconnect(handle.dataset.edge, handle.dataset.end, e);
    });
  },

  /* ---------------- helpers ---------------- */
  worldOf(e) { return Viewport.clientToWorld(e.clientX, e.clientY); },

  setCursorClass() {
    const c = dom.canvas.classList;
    c.toggle("is-space", this.spaceDown && this.mode === "idle");
    c.toggle("is-panning-active", this.mode === "pan");
    c.toggle("is-connecting", this.mode === "connect" || this.mode === "reconnect");
  },

  setHover(nodeId, edgeId) {
    const ui = store.ui;
    if (ui.hoverNodeId === nodeId && ui.hoverEdgeId === edgeId) return;
    ui.hoverNodeId = nodeId;
    ui.hoverEdgeId = edgeId;
    Renderer.invalidate("nodes", "edges", "overlay");
  },

  /* ---------------- pointer down ---------------- */
  onPointerDown(e) {
    if (e.pointerType === "mouse" && e.button === 2) return;   // context menu path
    ContextMenu.close();
    dom.canvas.focus({ preventScroll: true });
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (this.pointers.size === 2) { this.startPinch(); return; }
    if (this.pointers.size > 2) return;

    // A connect started from the keyboard has no pointer capture, so the next
    // click is the one that picks the target.
    if (this.gesture && this.gesture.kind === "connect" && !this.gesture.viaPointer) {
      e.preventDefault();
      this.moveConnect(e);
      this.finishPendingConnect();
      return;
    }

    const nodeEl = e.target.closest(".node");
    if (nodeEl && this.handleNodeAffordance(nodeEl, e)) return;
    if (nodeEl) {
      if (store.ui.editingId === nodeEl.dataset.id) return;
      this.startNodeGesture(nodeEl.dataset.id, e);
      return;
    }
    if (this.handleEdgePick(e)) return;
    this.startBackgroundGesture(e);
  },

  /** Collapse toggle, connector port and resize grip take priority over drag. */
  handleNodeAffordance(nodeEl, e) {
    const role = e.target.closest("[data-role]");
    if (!role) return false;
    const id = nodeEl.dataset.id;
    const handlers = {
      toggle: () => Commands.run("node.toggleCollapse", { id }),
      port: () => this.startConnect(id, e),
      resize: () => this.startResize(id, e),
    };
    const handler = handlers[role.dataset.role];
    if (!handler) return false;
    e.preventDefault();
    handler();
    return true;
  },

  handleEdgePick(e) {
    const edgeId = EdgeRenderer.hitTest(e.clientX, e.clientY);
    if (!edgeId) return false;
    Editor.commit();
    if (e.shiftKey) Selection.toggleEdge(edgeId);
    else Selection.setEdges([edgeId]);
    return true;
  },

  startNodeGesture(id, e) {
    Editor.commit();
    const additive = e.shiftKey || e.metaKey || e.ctrlKey;
    if (additive) Selection.toggle(id);
    else if (!Selection.hasNode(id)) Selection.only(id);
    else store.selection.primary = id;

    if (!Selection.hasNode(id)) return;
    const withDescendants = !e.altKey;
    const ids = Selection.dragSet(withDescendants);
    this.gesture = {
      kind: "node",
      id,
      startClient: { x: e.clientX, y: e.clientY },
      startWorld: this.worldOf(e),
      origin: Transforms.snapshot(ids, POSITION_FIELDS),
      ids,
      moved: false,
      dropTargetId: null,
      singleSubtree: store.selection.nodes.size === 1 && withDescendants,
    };
    this.mode = "pending-drag";
    dom.canvas.setPointerCapture(e.pointerId);
  },

  startBackgroundGesture(e) {
    Editor.commit();
    const marquee = e.shiftKey && !this.spaceDown;
    this.gesture = {
      kind: marquee ? "marquee" : "pan",
      startClient: { x: e.clientX, y: e.clientY },
      startWorld: this.worldOf(e),
      startViewport: { ...store.viewport },
      base: new Set(store.selection.nodes),
      additive: e.shiftKey,
      moved: false,
    };
    this.mode = marquee ? "marquee" : "pan";
    this.setCursorClass();
    dom.canvas.setPointerCapture(e.pointerId);
  },

  startResize(id, e) {
    const node = store.node(id);
    if (!node) return;
    this.mode = "resize";
    this.gesture = {
      kind: "resize",
      id,
      startWorld: this.worldOf(e),
      start: { width: node.width, height: node.height },
      origin: Transforms.snapshot([id], SIZE_FIELDS),
    };
    dom.canvas.setPointerCapture(e.pointerId);
  },

  startConnect(id, e) {
    const world = this.worldOf(e);
    this.mode = "connect";
    this.gesture = { kind: "connect", fromId: id, viaPointer: true };
    RenderState.connect = { fromId: id, x: world.x, y: world.y, targetId: null };
    this.setCursorClass();
    Renderer.invalidate("overlay", "nodes");
    dom.canvas.setPointerCapture(e.pointerId);
  },

  startReconnect(edgeId, end, e) {
    const edge = store.edge(edgeId);
    if (!edge) return;
    const anchorId = end === "source" ? edge.target : edge.source;
    const world = this.worldOf(e);
    this.mode = "reconnect";
    this.gesture = { kind: "reconnect", edgeId, end, anchorId };
    RenderState.connect = { fromId: anchorId, x: world.x, y: world.y, targetId: null };
    this.setCursorClass();
    Renderer.invalidate("overlay");
  },

  startPinch() {
    const points = Array.from(this.pointers.values());
    this.mode = "pinch";
    this.pinch = {
      distance: distance(points[0].x, points[0].y, points[1].x, points[1].y),
      center: { x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2 },
      zoom: store.viewport.zoom,
      viewport: { ...store.viewport },
    };
  },

  /* ---------------- pointer move ---------------- */
  onPointerMove(e) {
    if (this.pointers.has(e.pointerId)) this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    this.lastPointer = { x: e.clientX, y: e.clientY, world: this.worldOf(e) };

    if (this.mode === "pinch") { this.movePinch(); return; }
    if (this.mode === "idle") { this.moveHover(e); return; }
    if (this.mode === "pending-drag") {
      const g = this.gesture;
      if (distance(g.startClient.x, g.startClient.y, e.clientX, e.clientY) < INTERACT.DRAG_THRESHOLD) return;
      this.mode = "drag";
      for (const id of g.ids) {
        const element = NodeRenderer.elementFor(id);
        if (element) element.classList.add("is-drag");
      }
    }
    if (this.mode === "drag") { this.moveDrag(e); return; }
    if (this.mode === "pan") { this.movePan(e); return; }
    if (this.mode === "marquee") { this.moveMarquee(e); return; }
    if (this.mode === "resize") { this.moveResize(e); return; }
    if (this.mode === "connect" || this.mode === "reconnect") { this.moveConnect(e); return; }
    if (this.mode === "minimap") { this.moveMinimap(e); }
  },

  moveHover(e) {
    const nodeEl = e.target.closest ? e.target.closest(".node") : null;
    const overChrome = !nodeEl && e.target.closest && !e.target.closest("#canvas");
    const edgeId = nodeEl || overChrome ? null : EdgeRenderer.hitTest(e.clientX, e.clientY);
    this.setHover(nodeEl ? nodeEl.dataset.id : null, edgeId);
    if (DebugHud.enabled) DebugHud.update();
  },

  movePan(e) {
    const g = this.gesture;
    g.moved = g.moved || distance(g.startClient.x, g.startClient.y, e.clientX, e.clientY) > INTERACT.DRAG_THRESHOLD;
    store.setViewport({
      x: g.startViewport.x + (e.clientX - g.startClient.x),
      y: g.startViewport.y + (e.clientY - g.startClient.y),
    });
  },

  moveMarquee(e) {
    const g = this.gesture;
    const world = this.worldOf(e);
    g.moved = true;
    const rect = normalizeRect(g.startWorld.x, g.startWorld.y, world.x, world.y);
    RenderState.marquee = rect;
    Selection.fromRect(rect, g.additive, g.base);
    Renderer.invalidate("overlay");
  },

  moveDrag(e) {
    const g = this.gesture;
    const world = this.worldOf(e);
    let dx = world.x - g.startWorld.x;
    let dy = world.y - g.startWorld.y;
    const primary = store.node(g.id);
    if (!primary) return;
    const base = g.origin.get(g.id);
    const adjusted = this.applyDragAids(primary, base, dx, dy, g.ids);
    dx = adjusted.dx;
    dy = adjusted.dy;
    bus.batch(() => {
      for (const [id, origin] of g.origin) {
        store.updateNode(id, { x: round(origin.x + dx, 1), y: round(origin.y + dy, 1) });
      }
    });
    g.moved = true;
    g.dropTargetId = g.singleSubtree ? this.findDropTarget(world, g.ids) : null;
    RenderState.dropTargetId = g.dropTargetId;
    Renderer.invalidate("nodes", "edges", "overlay", "minimap");
  },

  /** Grid snapping + alignment guides for the primary dragged node. */
  applyDragAids(primary, base, dx, dy, movingIds) {
    RenderState.guides = [];
    if (store.settings.snapToGrid) {
      const targetX = snap(base.x + dx, VIEW.GRID);
      const targetY = snap(base.y + dy, VIEW.GRID);
      return { dx: targetX - base.x, dy: targetY - base.y };
    }
    if (!store.settings.showGuides) return { dx, dy };

    const tolerance = INTERACT.GUIDE_TOLERANCE / store.viewport.zoom;
    const moved = { x: base.x + dx, y: base.y + dy, w: primary.width, h: primary.height };
    const view = Viewport.worldRect(200);
    const hidden = store.hiddenSet();
    let bestX = null;
    let bestY = null;
    let count = 0;
    for (const node of store.nodes.values()) {
      if (movingIds.has(node.id) || hidden.has(node.id)) continue;
      const r = rectOf(node);
      if (!rectsIntersect(r, view)) continue;
      if (++count > 600) break;
      for (const [a, b] of [[moved.x, r.x], [moved.x + moved.w / 2, r.x + r.w / 2], [moved.x + moved.w, r.x + r.w]]) {
        const delta = b - a;
        if (Math.abs(delta) <= tolerance && (!bestX || Math.abs(delta) < Math.abs(bestX.delta))) bestX = { delta, world: b };
      }
      for (const [a, b] of [[moved.y, r.y], [moved.y + moved.h / 2, r.y + r.h / 2], [moved.y + moved.h, r.y + r.h]]) {
        const delta = b - a;
        if (Math.abs(delta) <= tolerance && (!bestY || Math.abs(delta) < Math.abs(bestY.delta))) bestY = { delta, world: b };
      }
    }
    if (bestX) { dx += bestX.delta; RenderState.guides.push({ orient: "v", world: bestX.world }); }
    if (bestY) { dy += bestY.delta; RenderState.guides.push({ orient: "h", world: bestY.world }); }
    return { dx, dy };
  },

  findDropTarget(world, movingIds) {
    const hit = HitTest.nodeAt(world.x, world.y, movingIds);
    if (!hit) return null;
    const draggedId = this.gesture.id;
    const dragged = store.node(draggedId);
    if (!dragged || hit.id === dragged.parentId) return null;
    if (store.isAncestorOf(draggedId, hit.id)) return null;
    return hit.id;
  },

  moveResize(e) {
    const g = this.gesture;
    const world = this.worldOf(e);
    const node = store.node(g.id);
    if (!node) return;
    let width = g.start.width + (world.x - g.startWorld.x);
    let height = g.start.height + (world.y - g.startWorld.y);
    if (store.settings.snapToGrid) { width = snap(width, VIEW.GRID); height = snap(height, VIEW.GRID); }
    store.updateNode(g.id, {
      width: clamp(round(width), NODE.MIN_W, 900),
      height: clamp(round(height), NODE.MIN_H, 900),
      fixedSize: true,
    });
    Renderer.invalidate("nodes", "edges", "minimap");
  },

  moveConnect(e) {
    const world = this.worldOf(e);
    const g = this.gesture;
    const exclude = new Set([g.kind === "connect" ? g.fromId : g.anchorId]);
    const hit = HitTest.nodeAt(world.x, world.y, exclude);
    RenderState.connect = {
      fromId: g.kind === "connect" ? g.fromId : g.anchorId,
      x: world.x, y: world.y,
      targetId: hit ? hit.id : null,
    };
    Renderer.invalidate("overlay", "nodes");
  },

  movePinch() {
    const points = Array.from(this.pointers.values());
    if (points.length < 2 || !this.pinch) return;
    const dist = distance(points[0].x, points[0].y, points[1].x, points[1].y);
    const center = { x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2 };
    const rect = dom.canvas.getBoundingClientRect();
    const ratio = this.pinch.distance > 0 ? dist / this.pinch.distance : 1;
    store.setViewport({
      x: this.pinch.viewport.x + (center.x - this.pinch.center.x),
      y: this.pinch.viewport.y + (center.y - this.pinch.center.y),
    });
    Viewport.zoomTo(this.pinch.zoom * ratio, center.x - rect.left, center.y - rect.top);
  },

  onMinimapDown(e) {
    e.preventDefault();
    this.mode = "minimap";
    this.gesture = { kind: "minimap" };
    dom.minimap.setPointerCapture(e.pointerId);
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    this.moveMinimap(e);
  },

  moveMinimap(e) {
    const world = Minimap.toWorld(e.clientX, e.clientY);
    if (world) Viewport.centerOn(world.x, world.y, { animate: false });
  },

  /* ---------------- pointer up ---------------- */
  onPointerUp(e) {
    this.pointers.delete(e.pointerId);
    if (this.mode === "pinch") {
      if (this.pointers.size < 2) { this.mode = "idle"; this.pinch = null; this.setCursorClass(); }
      return;
    }
    const mode = this.mode;
    const g = this.gesture;
    this.mode = "idle";
    this.gesture = null;
    RenderState.marquee = null;
    RenderState.guides = [];

    if (mode === "drag" && g) this.finishDrag(g);
    else if (mode === "pending-drag" && g) { /* click without movement — selection already applied */ }
    else if (mode === "pan" && g && !g.moved && !e.shiftKey) Selection.clear();
    else if (mode === "resize" && g) Transforms.commit("Resize node", g.origin, SIZE_FIELDS);
    else if (mode === "connect" && g) this.finishConnect(g);
    else if (mode === "reconnect" && g) this.finishReconnect(g);

    RenderState.connect = null;
    this.setCursorClass();
    Renderer.invalidate("nodes", "edges", "overlay", "minimap", "chrome");
  },

  finishDrag(g) {
    for (const id of g.ids) {
      const element = NodeRenderer.elementFor(id);
      if (element) element.classList.remove("is-drag");
    }
    RenderState.dropTargetId = null;
    if (g.dropTargetId && store.node(g.dropTargetId)) {
      this.finishReparentDrop(g);
      return;
    }
    Transforms.commit("Move node", g.origin, POSITION_FIELDS);
  },

  /** Dropping a branch on another node re-attaches it and tidies its position. */
  finishReparentDrop(g) {
    const targetId = g.dropTargetId;
    const label = firstLine(store.node(targetId).text);
    const dragged = store.node(g.id);
    const base = g.origin.get(g.id);
    bus.batch(() => { for (const [id, before] of g.origin) store.updateNode(id, before); });
    history.transact("Reparent branch", () => {
      if (!Graph.reparent(g.id, targetId)) { Toast.info("Cannot attach a branch to its own descendant"); return; }
      if (store.settings.autoLayout) {
        Layout.subtree(store.ancestors(g.id).pop() || g.id);
      } else {
        const spot = Graph.childPosition(targetId, { width: dragged.width, height: dragged.height });
        const dx = spot.x - base.x;
        const dy = spot.y - base.y;
        bus.batch(() => {
          for (const [id, before] of g.origin) {
            store.updateNode(id, { x: round(before.x + dx, 1), y: round(before.y + dy, 1) });
          }
        });
      }
      Toast.success(`Attached to “${truncate(label, 28)}”`);
    });
  },

  /** Resolves a click-to-connect gesture and clears the transient state. */
  finishPendingConnect() {
    const g = this.gesture;
    const targetId = RenderState.connect && RenderState.connect.targetId;
    this.mode = "idle";
    this.gesture = null;
    if (targetId) {
      history.transact("Connect nodes", () => {
        if (!Graph.connect(g.fromId, targetId)) Toast.info("Those nodes are already connected");
      });
    }
    RenderState.connect = null;
    this.pointers.clear();
    this.setCursorClass();
    Renderer.invalidate("nodes", "edges", "overlay", "minimap", "chrome");
  },

  finishConnect(g) {
    const targetId = RenderState.connect && RenderState.connect.targetId;
    if (!targetId) { Commands.run("node.addChildFromPort", { id: g.fromId, world: this.lastPointer.world }); return; }
    history.transact("Connect nodes", () => {
      const created = Graph.connect(g.fromId, targetId);
      if (!created) Toast.info("Those nodes are already connected");
    });
  },

  finishReconnect(g) {
    const targetId = RenderState.connect && RenderState.connect.targetId;
    if (!targetId) return;
    history.transact("Reconnect", () => {
      if (!Graph.reconnect(g.edgeId, g.end, targetId)) Toast.info("Cannot reconnect there");
    });
  },

  /* ---------------- wheel & misc ---------------- */
  onWheel(e) {
    e.preventDefault();
    const rect = dom.canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    if (e.shiftKey && !e.ctrlKey && !e.metaKey) {
      Viewport.panBy(-e.deltaY * INTERACT.WHEEL_PAN_FACTOR, 0);
      return;
    }
    if (e.altKey && !e.ctrlKey && !e.metaKey) {
      Viewport.panBy(-e.deltaX, -e.deltaY);
      return;
    }
    const scale = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? Viewport.height : 1;
    const factor = Math.exp(-e.deltaY * scale * VIEW.WHEEL_SENSITIVITY);
    Viewport.zoomTo(store.viewport.zoom * factor, sx, sy);
  },

  onDoubleClick(e) {
    const nodeEl = e.target.closest(".node");
    if (nodeEl) {
      if (e.target.closest('[data-role="toggle"]')) return;
      Editor.start(nodeEl.dataset.id);
      return;
    }
    if (EdgeRenderer.hitTest(e.clientX, e.clientY)) return;
    const world = this.worldOf(e);
    Commands.run("node.createAt", { x: world.x, y: world.y });
  },

  onContextMenu(e) {
    e.preventDefault();
    const nodeEl = e.target.closest(".node");
    if (nodeEl) {
      const id = nodeEl.dataset.id;
      if (!Selection.hasNode(id)) Selection.only(id);
      ContextMenu.openForNodes(e.clientX, e.clientY);
      return;
    }
    const edgeId = EdgeRenderer.hitTest(e.clientX, e.clientY);
    if (edgeId) {
      Selection.setEdges([edgeId]);
      ContextMenu.openForEdge(e.clientX, e.clientY, edgeId);
      return;
    }
    ContextMenu.openForCanvas(e.clientX, e.clientY, this.worldOf(e));
  },

  cancelGesture() {
    if (this.mode === "idle") return false;
    const g = this.gesture;
    if (g && g.origin) bus.batch(() => { for (const [id, before] of g.origin) store.updateNode(id, before); });
    if (g && g.ids) for (const id of g.ids) {
      const element = NodeRenderer.elementFor(id);
      if (element) element.classList.remove("is-drag");
    }
    this.mode = "idle";
    this.gesture = null;
    this.pointers.clear();
    RenderState.marquee = null;
    RenderState.connect = null;
    RenderState.guides = [];
    this.setCursorClass();
    Renderer.invalidate("nodes", "edges", "overlay", "minimap");
    return true;
  },
};

/* ==========================================================================
 * MODULE: Editor — inline node text editing on the canvas.
 *
 * Live typing mutates state without recording history; committing rewinds and
 * replays so a whole edit session collapses into one undo step.
 * ========================================================================== */
const Editor = {
  id: null,
  origin: null,
  element: null,
  cleanup: null,

  get active() { return this.id !== null; },

  start(id, { selectAll = true } = {}) {
    if (this.id === id) return;
    this.commit();
    const node = store.node(id);
    if (!node) return;
    Selection.only(id);
    store.ui.editingId = id;
    this.id = id;
    this.origin = { text: node.text, width: node.width, height: node.height, fixedSize: node.fixedSize };
    Renderer.flush(performance.now());

    const element = NodeRenderer.elementFor(id);
    if (!element) { this.reset(); return; }
    const field = element.refs.text;
    this.element = field;
    field.textContent = node.text;
    try { field.contentEditable = "plaintext-only"; }
    catch (_) { field.contentEditable = "true"; }
    field.spellcheck = false;
    setAttr(field, "role", "textbox");
    setAttr(field, "aria-label", "Node text");
    field.focus({ preventScroll: true });
    if (selectAll) this.selectAllText(field);
    else this.caretToEnd(field);

    const offInput = on(field, "input", () => this.onInput());
    const offKey = on(field, "keydown", (e) => this.onKeyDown(e));
    const offBlur = on(field, "blur", () => this.commit());
    const offPaste = on(field, "paste", (e) => this.onPaste(e));
    this.cleanup = () => { offInput(); offKey(); offBlur(); offPaste(); };
    Announce("Editing node text");
  },

  selectAllText(field) {
    const range = document.createRange();
    range.selectNodeContents(field);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  },

  caretToEnd(field) {
    const range = document.createRange();
    range.selectNodeContents(field);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  },

  onPaste(e) {
    if (this.element && this.element.contentEditable === "plaintext-only") return;
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, sanitizeText(text).replace(/\n/g, " "));
  },

  onInput() {
    if (!this.id || !this.element) return;
    const text = sanitizeText(this.element.innerText.replace(/\n$/, ""));
    const node = store.node(this.id);
    if (!node) return;
    node.text = text;
    if (!node.fixedSize) {
      const m = Graph.measured(node);
      node.width = m.width;
      node.height = m.height;
      const element = NodeRenderer.elementFor(this.id);
      if (element) {
        element.style.width = `${node.width}px`;
        element.style.height = `${node.height}px`;
        element.sig = "";
      }
    }
    Renderer.invalidate("edges", "minimap");
  },

  onKeyDown(e) {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); this.cancel(); return; }
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      e.stopPropagation();
      const id = this.id;
      this.commit();
      dom.canvas.focus({ preventScroll: true });
      if (id) Commands.run("node.addSibling", { id });
      return;
    }
    if (e.key === "Tab") {
      e.preventDefault();
      e.stopPropagation();
      const id = this.id;
      this.commit();
      dom.canvas.focus({ preventScroll: true });
      if (id) Commands.run("node.addChild", { id });
      return;
    }
    e.stopPropagation();
  },

  /** Restores the pre-edit values and replays the final ones in one transaction. */
  commit() {
    if (!this.id) return;
    const id = this.id;
    const node = store.node(id);
    const origin = this.origin;
    this.teardown();
    if (!node || !origin) { this.reset(); return; }
    const finalText = node.text;
    const finalWidth = node.width;
    const finalHeight = node.height;
    node.text = origin.text;
    node.width = origin.width;
    node.height = origin.height;
    this.reset();
    if (finalText === origin.text && finalWidth === origin.width) {
      Renderer.invalidate("nodes", "edges", "minimap", "chrome");
      return;
    }
    history.transact("Rename node", () => {
      store.updateNode(id, { text: finalText, width: finalWidth, height: finalHeight });
    });
    Renderer.invalidate("nodes", "edges", "minimap", "chrome");
  },

  cancel() {
    if (!this.id) return;
    const id = this.id;
    const node = store.node(id);
    const origin = this.origin;
    this.teardown();
    if (node && origin) Object.assign(node, origin);
    this.reset();
    const element = NodeRenderer.elementFor(id);
    if (element) element.sig = "";
    Renderer.invalidate("nodes", "edges", "minimap", "chrome");
    dom.canvas.focus({ preventScroll: true });
  },

  teardown() {
    if (this.cleanup) this.cleanup();
    this.cleanup = null;
    if (this.element) {
      this.element.contentEditable = "false";
      this.element.removeAttribute("role");
      this.element.removeAttribute("aria-label");
      const sel = window.getSelection();
      if (sel) sel.removeAllRanges();
    }
  },

  reset() {
    this.id = null;
    this.origin = null;
    this.element = null;
    store.ui.editingId = null;
  },
};

/* ==========================================================================
 * MODULE: Commands — the single dispatch table used by the toolbar, the
 * context menu, the keyboard layer and the property panel.
 * ========================================================================== */
const Commands = (() => {
  const registry = new Map();

  /* ---------------- shared helpers ---------------- */
  const primary = () => store.selection.primary;
  const selected = () => Selection.nodeIds;
  const hasSelection = () => store.selection.nodes.size > 0;
  const hasEdgeSelection = () => store.selection.edges.size > 0;

  function rootOf(id) {
    const chain = store.ancestors(id);
    return chain.length ? chain[chain.length - 1] : id;
  }

  function relayoutFor(ids) {
    if (!store.settings.autoLayout) return;
    const roots = new Set();
    for (const id of ids) if (store.nodes.has(id)) roots.add(rootOf(id));
    for (const rootId of roots) Layout.subtree(rootId);
  }

  function ensureVisible(id) {
    const node = store.node(id);
    if (!node) return;
    const view = Viewport.worldRect(-40);
    if (rectsIntersect(rectOf(node), view)) return;
    Viewport.centerNode(id);
  }

  /** Focus, reveal and (optionally) start editing a freshly created node. */
  function focusCreated(id, { edit = true } = {}) {
    if (!id) return;
    RenderState.appearing.add(id);
    Selection.only(id);
    Renderer.invalidate("nodes", "edges", "minimap", "chrome");
    ensureVisible(id);
    if (edit) Editor.start(id);
  }

  function viewportCenterWorld() {
    return {
      x: Viewport.toWorldX(Viewport.width / 2),
      y: Viewport.toWorldY(Viewport.height / 2),
    };
  }

  function define(id, spec) { registry.set(id, { id, ...spec }); }

  /* ---------------- node commands ---------------- */
  define("node.createAt", {
    label: "New node here",
    icon: "plus",
    run({ x, y }) {
      let created = null;
      history.transact("Create node", () => {
        const probe = makeNode({ text: "New node" });
        const size = NodeStyle.measure(probe, true);
        created = Graph.createNode({ text: "New node", x: x - size.width / 2, y: y - size.height / 2 });
      });
      if (created) focusCreated(created.id);
      return created;
    },
  });

  define("node.create", {
    label: "New node",
    icon: "plus",
    accel: accel(KEY_ENTER, { mod: true }),
    run() {
      const target = primary();
      if (target) return Commands.run("node.addChild", { id: target });
      const center = viewportCenterWorld();
      return Commands.run("node.createAt", center);
    },
  });

  define("node.addChild", {
    label: "Add child",
    icon: "arrowRight",
    accel: "Tab",
    enabled: (a) => !!(a && a.id) || !!primary(),
    run({ id } = {}) {
      const target = id || primary();
      if (!target) return null;
      let created = null;
      history.transact("Add child", () => {
        created = Graph.createChild(target);
        if (created) relayoutFor([created.id]);
      });
      if (created) focusCreated(created.id);
      return created;
    },
  });

  define("node.addChildFromPort", {
    label: "Add connected node",
    icon: "plus",
    run({ id, world }) {
      const parent = store.node(id);
      if (!parent || !world) return null;
      let created = null;
      history.transact("Add child", () => {
        const probe = makeNode({ text: "New node", parentId: id });
        const size = NodeStyle.measure(probe, false);
        created = Graph.createNode({
          text: "New node",
          parentId: id,
          x: world.x - (world.x < rectCenterX(rectOf(parent)) ? size.width : 0),
          y: world.y - size.height / 2,
          color: parent.color,
        });
      });
      if (created) focusCreated(created.id);
      return created;
    },
  });

  define("node.addSibling", {
    label: "Add sibling",
    icon: "arrowDown",
    accel: KEY_ENTER,
    enabled: (a) => !!(a && a.id) || !!primary(),
    run({ id } = {}) {
      const target = id || primary();
      if (!target) return null;
      let created = null;
      history.transact("Add sibling", () => {
        created = Graph.createSibling(target);
        if (created) relayoutFor([created.id]);
      });
      if (created) focusCreated(created.id);
      return created;
    },
  });

  define("node.addParent", {
    label: "Insert parent",
    icon: "arrowUp",
    accel: accel(KEY_ENTER, { shift: true }),
    enabled: (a) => !!(a && a.id) || !!primary(),
    run({ id } = {}) {
      const target = id || primary();
      if (!target) return null;
      let created = null;
      history.transact("Insert parent", () => {
        created = Graph.insertParent(target);
        if (created) relayoutFor([created.id]);
      });
      if (created) focusCreated(created.id);
      return created;
    },
  });

  define("node.rename", {
    label: "Rename",
    icon: "pencil",
    accel: "F2",
    enabled: (a) => !!(a && a.id) || !!primary(),
    run({ id } = {}) {
      const target = id || primary();
      if (target) Editor.start(target);
    },
  });

  define("node.delete", {
    label: "Delete",
    icon: "trash",
    accel: KEY_DELETE,
    danger: true,
    enabled: () => hasSelection() || hasEdgeSelection(),
    run() {
      Editor.commit();
      const nodeIds = selected();
      const edgeIds = Selection.edgeIds;
      if (!nodeIds.length && !edgeIds.length) return;
      const parents = nodeIds.map((id) => (store.node(id) || {}).parentId).filter(Boolean);
      let removed = 0;
      history.transact("Delete", () => {
        for (const edgeId of edgeIds) Graph.disconnect(edgeId);
        removed = Graph.deleteNodes(nodeIds);
        relayoutFor(parents);
      });
      Selection.clear();
      Announce(`${pluralize(removed, "node", "nodes")} deleted`);
    },
  });

  define("node.deleteKeepChildren", {
    label: "Delete node only",
    icon: "trash",
    danger: true,
    enabled: () => hasSelection(),
    run() {
      const ids = selected();
      if (!ids.length) return;
      history.transact("Delete node", () => {
        Graph.deleteNodes(ids, { keepChildren: true });
      });
      Selection.clear();
    },
  });

  define("node.duplicate", {
    label: "Duplicate",
    icon: "duplicate",
    accel: accel("D", { mod: true }),
    enabled: () => hasSelection(),
    run() {
      const ids = selected();
      if (!ids.length) return;
      let created = [];
      history.transact("Duplicate", () => { created = Graph.duplicate(ids); });
      if (created.length) {
        for (const id of created) RenderState.appearing.add(id);
        Selection.set(created, { primary: created[0] });
        Toast.success(`Duplicated ${pluralize(created.length, "node", "nodes")}`);
      }
    },
  });

  define("node.toggleCollapse", {
    label: "Collapse / expand",
    icon: "fold",
    accel: "]",
    enabled: (a) => !!(a && a.id) || !!primary(),
    run({ id } = {}) {
      const targets = id ? [id] : selected();
      if (!targets.length) return;
      history.transact("Collapse", () => {
        for (const target of targets) Graph.toggleCollapse(target);
        relayoutFor(targets);
      });
      Renderer.invalidate("nodes", "edges", "minimap", "chrome");
    },
  });

  define("node.expandBranch", {
    label: "Expand whole branch",
    icon: "unfold",
    enabled: () => !!primary(),
    run() {
      const targets = selected();
      history.transact("Expand branch", () => {
        for (const target of targets) {
          Graph.setCollapsedAll(false, { fromIds: store.subtree(target) });
        }
      });
    },
  });

  define("node.collapseBranch", {
    label: "Collapse whole branch",
    icon: "fold",
    enabled: () => !!primary(),
    run() {
      const targets = selected();
      history.transact("Collapse branch", () => {
        for (const target of targets) {
          Graph.setCollapsedAll(true, { fromIds: store.descendants(target), keepRoots: false });
          Graph.toggleCollapse(target);
        }
      });
    },
  });

  define("node.collapseAll", {
    label: "Collapse all",
    icon: "fold",
    run() {
      history.transact("Collapse all", () => Graph.setCollapsedAll(true));
      Toast.info("All branches collapsed");
    },
  });

  define("node.expandAll", {
    label: "Expand all",
    icon: "unfold",
    run() {
      history.transact("Expand all", () => Graph.setCollapsedAll(false));
      Toast.info("All branches expanded");
    },
  });

  define("node.setColor", {
    label: "Set colour",
    icon: "palette",
    enabled: () => hasSelection(),
    run({ color }) {
      const ids = selected();
      if (!ids.length || !COLOR_KEYS.includes(color)) return;
      history.transact("Change colour", () => {
        for (const id of ids) store.updateNode(id, { color });
      });
    },
  });

  define("node.setIcon", {
    label: "Set icon",
    icon: "star",
    enabled: () => hasSelection(),
    run({ icon }) {
      const ids = selected();
      history.transact("Change icon", () => {
        for (const id of ids) {
          store.updateNode(id, { icon: icon || "" });
          Graph.autoSize(id);
        }
      });
    },
  });

  define("node.autoSize", {
    label: "Reset size",
    icon: "reset",
    enabled: () => hasSelection(),
    run() {
      const ids = selected();
      history.transact("Reset size", () => {
        for (const id of ids) {
          store.updateNode(id, { fixedSize: false });
          Graph.autoSize(id);
        }
      });
    },
  });

  define("node.detach", {
    label: "Detach from parent",
    icon: "cut",
    enabled: () => selected().some((id) => !!(store.node(id) || {}).parentId),
    run() {
      const ids = selected();
      history.transact("Detach", () => {
        for (const id of ids) Graph.reparent(id, null);
      });
    },
  });

  define("node.startConnect", {
    label: "Connect to…",
    icon: "connect",
    accel: "C",
    enabled: () => !!primary(),
    run() {
      const id = primary();
      if (!id) return;
      const node = store.node(id);
      Interaction.mode = "connect";
      Interaction.gesture = { kind: "connect", fromId: id };
      RenderState.connect = { fromId: id, x: rectRight(rectOf(node)) + 40, y: rectCenterY(rectOf(node)), targetId: null };
      Interaction.setCursorClass();
      Renderer.invalidate("overlay");
      Toast.info("Click a node to connect, Esc to cancel");
    },
  });

  /* ---------------- edge commands ---------------- */
  define("edge.delete", {
    label: "Delete connection",
    icon: "trash",
    danger: true,
    enabled: (a) => !!(a && a.id) || hasEdgeSelection(),
    run({ id } = {}) {
      const ids = id ? [id] : Selection.edgeIds;
      if (!ids.length) return;
      history.transact("Delete connection", () => { for (const edgeId of ids) Graph.disconnect(edgeId); });
      Selection.clear();
    },
  });

  /* ---------------- editing / clipboard ---------------- */
  define("edit.undo", {
    label: "Undo",
    icon: "undo",
    accel: accel("Z", { mod: true }),
    enabled: () => history.info().canUndo,
    run() {
      Editor.commit();
      const label = history.undo();
      if (label) Announce(`Undo ${label}`);
      Renderer.invalidateAll();
    },
  });

  define("edit.redo", {
    label: "Redo",
    icon: "redo",
    accel: IS_MAC ? accel("Z", { mod: true, shift: true }) : accel("Y", { mod: true }),
    enabled: () => history.info().canRedo,
    run() {
      Editor.commit();
      const label = history.redo();
      if (label) Announce(`Redo ${label}`);
      Renderer.invalidateAll();
    },
  });

  define("edit.copy", {
    label: "Copy",
    icon: "copy",
    accel: accel("C", { mod: true }),
    enabled: () => hasSelection(),
    run() {
      const ids = selected();
      if (!ids.length) return null;
      store.clipboard = Graph.serialize(ids);
      Clipboard.writeExternal(store.clipboard);
      Toast.success(`Copied ${pluralize(store.clipboard.nodes.length, "node", "nodes")}`);
      return store.clipboard;
    },
  });

  define("edit.cut", {
    label: "Cut",
    icon: "cut",
    accel: accel("X", { mod: true }),
    enabled: () => hasSelection(),
    run() {
      const ids = selected();
      if (!ids.length) return;
      store.clipboard = Graph.serialize(ids);
      Clipboard.writeExternal(store.clipboard);
      history.transact("Cut", () => Graph.deleteNodes(ids));
      Selection.clear();
    },
  });

  define("edit.paste", {
    label: "Paste",
    icon: "paste",
    accel: accel("V", { mod: true }),
    enabled: () => !!store.clipboard,
    run({ fragment = null, world = null } = {}) {
      const payload = fragment || store.clipboard;
      if (!payload || !payload.nodes || !payload.nodes.length) return;
      const target = primary();
      let created = [];
      history.transact("Paste", () => {
        if (world) {
          const bounds = unionRects(payload.nodes.map((n) => ({ x: n.x, y: n.y, w: n.width, h: n.height })));
          created = Graph.insertFragment(payload, { dx: world.x - bounds.x, dy: world.y - bounds.y });
        } else if (target) {
          created = Graph.insertFragment(payload, { dx: INTERACT.PASTE_OFFSET, dy: INTERACT.PASTE_OFFSET, parentId: target });
          const spot = Graph.childPosition(target, { width: 160, height: NODE.MIN_H });
          const bounds = unionRects(created.map((id) => rectOf(store.node(id))));
          if (bounds) {
            for (const id of created) {
              const node = store.node(id);
              store.updateNode(id, { x: node.x + (spot.x - bounds.x), y: node.y + (spot.y - bounds.y) });
            }
          }
          relayoutFor(created);
        } else {
          created = Graph.insertFragment(payload, { dx: INTERACT.PASTE_OFFSET, dy: INTERACT.PASTE_OFFSET });
        }
      });
      if (created.length) {
        for (const id of created) RenderState.appearing.add(id);
        Selection.set(created, { primary: created[0] });
        Toast.success(`Pasted ${pluralize(created.length, "node", "nodes")}`);
      }
    },
  });

  define("edit.pasteText", {
    label: "Paste as nodes",
    icon: "paste",
    run({ text, world = null }) {
      const lines = String(text).split(/\n+/).map((l) => l.trim()).filter(Boolean).slice(0, 400);
      if (!lines.length) return;
      const target = primary();
      const created = [];
