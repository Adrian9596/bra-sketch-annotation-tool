<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="color-scheme" content="light dark" />
<title>Atlas — Mind Map</title>
<style>
/* ==========================================================================
   1. DESIGN TOKENS
   ========================================================================== */
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --fs-xs: 11px;
  --fs-sm: 12px;
  --fs-md: 13px;
  --fs-lg: 15px;
  --fs-xl: 19px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 28px;

  --r-sm: 7px;
  --r-md: 11px;
  --r-lg: 16px;
  --r-xl: 22px;
  --r-full: 999px;

  --dur-fast: 120ms;
  --dur-mid: 220ms;
  --dur-slow: 380ms;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

  --panel-w: 288px;

  --z-canvas: 0;
  --z-overlay: 20;
  --z-chrome: 40;
  --z-panel: 50;
  --z-menu: 70;
  --z-modal: 90;
  --z-toast: 100;
}

html[data-theme="light"] {
  --bg: #f2f2f5;
  --bg-grid: rgba(0, 0, 0, 0.055);
  --bg-grid-strong: rgba(0, 0, 0, 0.085);
  --surface: rgba(255, 255, 255, 0.72);
  --surface-solid: #ffffff;
  --surface-raised: rgba(255, 255, 255, 0.92);
  --surface-sunken: rgba(0, 0, 0, 0.035);
  --hover: rgba(0, 0, 0, 0.055);
  --active: rgba(0, 0, 0, 0.09);
  --border: rgba(0, 0, 0, 0.09);
  --border-strong: rgba(0, 0, 0, 0.16);
  --text: #1d1d1f;
  --text-2: #55555c;
  --text-3: #8a8a91;
  --accent: #0071e3;
  --accent-soft: rgba(0, 113, 227, 0.12);
  --accent-text: #ffffff;
  --danger: #d70015;
  --danger-soft: rgba(215, 0, 21, 0.1);
  --warn: #b25000;
  --ok: #1d8a44;
  --edge: rgba(0, 0, 0, 0.28);
  --edge-hover: #0071e3;
  --shadow-1: 0 1px 2px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.05);
  --shadow-2: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.09);
  --shadow-3: 0 2px 6px rgba(0,0,0,.08), 0 18px 48px rgba(0,0,0,.16);
  --node-bg: #ffffff;
  --node-text: #1d1d1f;
  --scrim: rgba(0, 0, 0, 0.22);
}

html[data-theme="dark"] {
  --bg: #131316;
  --bg-grid: rgba(255, 255, 255, 0.055);
  --bg-grid-strong: rgba(255, 255, 255, 0.085);
  --surface: rgba(38, 38, 42, 0.72);
  --surface-solid: #26262a;
  --surface-raised: rgba(48, 48, 53, 0.94);
  --surface-sunken: rgba(255, 255, 255, 0.06);
  --hover: rgba(255, 255, 255, 0.08);
  --active: rgba(255, 255, 255, 0.14);
  --border: rgba(255, 255, 255, 0.1);
  --border-strong: rgba(255, 255, 255, 0.2);
  --text: #f5f5f7;
  --text-2: #b8b8bf;
  --text-3: #7c7c85;
  --accent: #0a84ff;
  --accent-soft: rgba(10, 132, 255, 0.2);
  --accent-text: #ffffff;
  --danger: #ff6961;
  --danger-soft: rgba(255, 105, 97, 0.16);
  --warn: #ffb340;
  --ok: #30d158;
  --edge: rgba(255, 255, 255, 0.3);
  --edge-hover: #0a84ff;
  --shadow-1: 0 1px 2px rgba(0,0,0,.5);
  --shadow-2: 0 2px 8px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.4);
  --shadow-3: 0 4px 12px rgba(0,0,0,.55), 0 24px 60px rgba(0,0,0,.55);
  --node-bg: #2b2b30;
  --node-text: #f5f5f7;
  --scrim: rgba(0, 0, 0, 0.5);
}

/* Node accent palette (identical keys in both themes, tuned per theme) */
html[data-theme="light"] {
  --c-slate: #64748b;  --c-slate-bg: #f1f5f9;
  --c-blue: #0071e3;   --c-blue-bg: #e7f1fe;
  --c-teal: #0d9488;   --c-teal-bg: #e2f6f3;
  --c-green: #1d8a44;  --c-green-bg: #e6f6ec;
  --c-yellow: #b58100; --c-yellow-bg: #fdf4e0;
  --c-orange: #d2691e; --c-orange-bg: #fdeee4;
  --c-red: #d70015;    --c-red-bg: #fdeaec;
  --c-pink: #d81b7c;   --c-pink-bg: #fdeaf3;
  --c-purple: #7c3aed; --c-purple-bg: #f2ebfe;
}
html[data-theme="dark"] {
  --c-slate: #a3b1c2;  --c-slate-bg: #333a44;
  --c-blue: #4da3ff;   --c-blue-bg: #1b3350;
  --c-teal: #3fd0c0;   --c-teal-bg: #143d3a;
  --c-green: #4bd97a;  --c-green-bg: #173b25;
  --c-yellow: #f2c14e; --c-yellow-bg: #40340f;
  --c-orange: #ff9f5a; --c-orange-bg: #452715;
  --c-red: #ff7a70;    --c-red-bg: #45191b;
  --c-pink: #ff7ab8;   --c-pink-bg: #451930;
  --c-purple: #b18cff; --c-purple-bg: #2f2350;
}

/* ==========================================================================
   2. RESET & BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }
body {
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
  touch-action: none;
}
button, input, textarea, select {
  font: inherit; color: inherit; margin: 0;
  background: none; border: none; outline: none;
}
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-soft); }
svg { display: block; }
[hidden] { display: none !important; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--r-full); border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: content-box; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ==========================================================================
   3. APP SHELL
   ========================================================================== */
#app { position: fixed; inset: 0; overflow: hidden; }

#canvas {
  position: absolute; inset: 0;
  cursor: default;
  outline: none;
  contain: strict;
}
#canvas.is-panning, #canvas.is-space { cursor: grab; }
#canvas.is-panning-active { cursor: grabbing; }
#canvas.is-connecting { cursor: crosshair; }

#grid {
  position: absolute; inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(to right, var(--bg-grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--bg-grid) 1px, transparent 1px),
    linear-gradient(to right, var(--bg-grid-strong) 1px, transparent 1px),
    linear-gradient(to bottom, var(--bg-grid-strong) 1px, transparent 1px);
  transition: opacity var(--dur-mid) var(--ease);
}
#grid[data-visible="false"] { opacity: 0; }

#world {
  position: absolute; top: 0; left: 0;
  width: 0; height: 0;
  transform-origin: 0 0;
  will-change: transform;
}
#edge-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#node-layer { position: absolute; left: 0; top: 0; width: 0; height: 0; }

#overlay { position: absolute; inset: 0; pointer-events: none; z-index: var(--z-overlay); overflow: visible; }

/* ==========================================================================
   4. NODES
   ========================================================================== */
.node {
  position: absolute;
  left: 0; top: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: var(--r-md);
  background: var(--node-bg);
  color: var(--node-text);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-1);
  font-size: 14px;
  line-height: 20px;
  font-weight: 450;
  cursor: default;
  user-select: none;
  contain: layout style;
  transition: box-shadow var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.node[data-shape="root"] {
  font-size: 16px; line-height: 22px; font-weight: 600;
  padding: 10px 16px; border-radius: var(--r-lg);
}
.node.is-hover { box-shadow: var(--shadow-2); }
.node.is-selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-2); z-index: 2; }
.node.is-primary { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-3); }
.node.is-editing { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-3); z-index: 5; cursor: text; }
.node.is-match { border-color: var(--warn); box-shadow: 0 0 0 3px rgba(255, 179, 64, .28), var(--shadow-2); }
.node.is-dim { opacity: .32; }
.node.is-drag { box-shadow: var(--shadow-3); z-index: 6; }
.node.is-connect-target { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.node.is-appear { animation: node-pop var(--dur-mid) var(--ease-out); }
.node:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

@keyframes node-pop {
  from { transform: scale(.86); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.node[data-color]:not([data-color="default"]) {
  background: var(--node-accent-bg);
  border-color: var(--node-accent);
  color: var(--text);
}
.node[data-color]:not([data-color="default"])::before {
  content: ""; position: absolute; left: 0; top: 8%; bottom: 8%;
  width: 3px; border-radius: var(--r-full); background: var(--node-accent);
}

.node-icon {
  flex: 0 0 24px; width: 24px; text-align: center;
  font-size: 15px; line-height: 1; overflow: hidden;
}
.node[data-shape="root"] .node-icon { font-size: 17px; }
.node-text {
  flex: 1 1 auto;
  min-width: 0;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  word-break: break-word;
}
.node-text mark { background: rgba(255, 179, 64, .45); color: inherit; border-radius: 3px; padding: 0 1px; }
.node-text[contenteditable="true"] { user-select: text; cursor: text; outline: none; }

.node-meta { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.node-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; border-radius: var(--r-full);
  color: var(--text-3);
}
.node-badge svg { width: 12px; height: 12px; }
.node-tags { display: flex; gap: 3px; flex: 0 0 auto; }
.node-tag {
  font-size: 10px; font-weight: 500; line-height: 14px; padding: 0 5px;
  border-radius: var(--r-full);
  background: var(--surface-sunken); color: var(--text-2);
  max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.node-toggle {
  position: absolute; top: 50%;
  width: 18px; height: 18px; margin-top: -9px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-full);
  background: var(--surface-solid);
  border: 1px solid var(--border-strong);
  color: var(--text-2);
  font-size: 9px; font-weight: 700; line-height: 1;
  box-shadow: var(--shadow-1);
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.node-toggle:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-text); transform: scale(1.14); }
.node-toggle[data-side="right"] { right: -9px; }
.node-toggle[data-side="left"] { left: -9px; }
.node-toggle svg { width: 10px; height: 10px; }
.node-toggle .count { font-size: 9px; padding: 0 1px; }

.node-port {
  position: absolute; top: 50%; margin-top: -5px;
  width: 10px; height: 10px; border-radius: var(--r-full);
  background: var(--accent); border: 2px solid var(--surface-solid);
  opacity: 0; cursor: crosshair;
  /* Hidden affordances must not swallow clicks aimed at the node or toggle. */
  pointer-events: none;
  transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.node.is-hover .node-port, .node.is-selected .node-port { opacity: 1; pointer-events: auto; }
.node-port:hover { transform: scale(1.35); }
.node-port[data-side="right"] { right: -6px; }
.node-port[data-side="left"] { left: -6px; }
/* Sits outboard of the collapse toggle so the two never overlap. */
.node.has-children .node-port[data-side="right"] { right: -27px; }
.node.has-children .node-port[data-side="left"] { left: -27px; }

.node-resize {
  position: absolute; right: -3px; bottom: -3px;
  width: 12px; height: 12px; border-radius: 3px;
  cursor: nwse-resize; opacity: 0;
  pointer-events: none;
  background: var(--accent); border: 2px solid var(--surface-solid);
  transition: opacity var(--dur-fast) var(--ease);
}
.node.is-selected .node-resize { opacity: 1; pointer-events: auto; }

/* ==========================================================================
   5. EDGES
   ========================================================================== */
.edge-cap {
  fill: var(--surface-solid); stroke: var(--accent); stroke-width: 2;
  cursor: crosshair; pointer-events: auto;
}
.edge-cap:hover { fill: var(--accent); }

/* Overlay graphics */
.marquee { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.guide { stroke: var(--c-pink); stroke-width: 1; stroke-dasharray: 4 3; }
.connect-preview { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; }
.connect-dot { fill: var(--accent); }

/* ==========================================================================
   6. CHROME PRIMITIVES
   ========================================================================== */
.glass {
  background: var(--surface);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-2);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; min-width: 30px; padding: 0 9px;
  border-radius: var(--r-sm);
  color: var(--text-2);
  font-size: var(--fs-md); font-weight: 500;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  white-space: nowrap;
}
.btn svg { width: 17px; height: 17px; flex: 0 0 auto; }
.btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.btn:active:not(:disabled) { background: var(--active); transform: scale(.95); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.is-active { background: var(--accent-soft); color: var(--accent); }
.btn--primary { background: var(--accent); color: var(--accent-text); }
.btn--primary:hover:not(:disabled) { background: var(--accent); color: var(--accent-text); filter: brightness(1.08); }
.btn--ghost { color: var(--text-3); }
.btn--danger { color: var(--danger); }
.btn--danger:hover:not(:disabled) { background: var(--danger-soft); color: var(--danger); }
.btn--wide { width: 100%; }
.btn--sm { height: 25px; font-size: var(--fs-sm); padding: 0 7px; }
.divider { width: 1px; height: 20px; background: var(--border); flex: 0 0 auto; margin: 0 2px; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: var(--fs-xs); font-weight: 600; color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; }
.input, .textarea {
  width: 100%; padding: 7px 9px;
  background: var(--surface-sunken);
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  font-size: var(--fs-md); color: var(--text);
  transition: background var(--dur-fast), border-color var(--dur-fast), box-shadow var(--dur-fast);
}
.input::placeholder, .textarea::placeholder { color: var(--text-3); }
.input:focus, .textarea:focus { background: var(--surface-solid); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.textarea { resize: vertical; min-height: 66px; line-height: 1.45; font-family: inherit; }

.switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch-track {
  position: relative; width: 38px; height: 23px; flex: 0 0 auto;
  border-radius: var(--r-full); background: var(--border-strong);
  transition: background var(--dur-mid) var(--ease);
}
.switch-track::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 19px; height: 19px; border-radius: var(--r-full);
  background: #fff; box-shadow: var(--shadow-1);
  transition: transform var(--dur-mid) var(--ease);
}
.switch input:checked + .switch-track { background: var(--ok); }
.switch input:checked + .switch-track::after { transform: translateX(15px); }
.switch input:focus-visible + .switch-track { box-shadow: 0 0 0 3px var(--accent-soft); }
.switch-label { font-size: var(--fs-md); color: var(--text); }

.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; padding: 0 5px;
  font-family: var(--font-ui); font-size: var(--fs-xs); font-weight: 600;
  color: var(--text-2); background: var(--surface-sunken);
  border: 1px solid var(--border); border-radius: 5px;
}

/* ==========================================================================
   7. TOOLBAR
   ========================================================================== */
#toolbar {
  position: absolute; top: var(--sp-3); left: 50%;
  transform: translateX(-50%);
  z-index: var(--z-chrome);
  display: flex; align-items: center; gap: 2px;
  padding: 5px;
  border-radius: var(--r-lg);
  max-width: calc(100vw - 2 * var(--sp-3));
}
#toolbar .brand {
  display: flex; align-items: center; gap: 7px;
  padding: 0 9px 0 6px; margin-right: 2px;
  font-size: var(--fs-md); font-weight: 650; letter-spacing: -.01em;
  color: var(--text);
}
#toolbar .brand svg { width: 19px; height: 19px; color: var(--accent); }
.tb-group { display: flex; align-items: center; gap: 2px; }

/* ==========================================================================
   8. PROPERTY PANEL
   ========================================================================== */
#panel {
  position: absolute; top: var(--sp-3); right: var(--sp-3); bottom: 52px;
  width: var(--panel-w); z-index: var(--z-panel);
  display: flex; flex-direction: column;
  border-radius: var(--r-lg);
  overflow: hidden;
  transform: translateX(calc(100% + var(--sp-4)));
  opacity: 0; pointer-events: none;
  transition: transform var(--dur-slow) var(--ease), opacity var(--dur-mid) var(--ease);
}
#panel.is-open { transform: none; opacity: 1; pointer-events: auto; }
.panel-head {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 10px var(--sp-3) 10px var(--sp-4);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
.panel-title { flex: 1 1 auto; font-size: var(--fs-lg); font-weight: 650; letter-spacing: -.015em; }
.panel-body { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); }
.panel-empty { padding: var(--sp-6) var(--sp-4); text-align: center; color: var(--text-3); font-size: var(--fs-md); line-height: 1.6; }
.panel-stack { display: flex; flex-direction: column; gap: var(--sp-4); }
.panel-section { display: flex; flex-direction: column; gap: var(--sp-2); }
.panel-row { display: flex; align-items: center; gap: var(--sp-2); }
.panel-row > .field { flex: 1 1 0; min-width: 0; }
.panel-hint { font-size: var(--fs-xs); color: var(--text-3); }

.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.swatch {
  position: relative; height: 27px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--sw);
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.swatch:hover { transform: scale(1.08); }
.swatch.is-active { box-shadow: 0 0 0 2px var(--surface-solid), 0 0 0 4px var(--accent); }
.swatch[data-color="default"] { background: var(--node-bg); }
.swatch[data-color="default"]::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(135deg, transparent 46%, var(--text-3) 46%, var(--text-3) 54%, transparent 54%);
  opacity: .5;
}

.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  height: 23px; padding: 0 4px 0 8px;
  border-radius: var(--r-full);
  background: var(--surface-sunken); color: var(--text-2);
  font-size: var(--fs-sm); font-weight: 500;
}
.chip button { display: flex; align-items: center; color: var(--text-3); border-radius: var(--r-full); padding: 1px; }
.chip button:hover { color: var(--danger); background: var(--danger-soft); }
.chip button svg { width: 11px; height: 11px; }
.chip.is-toggle { padding: 0 9px; cursor: pointer; transition: background var(--dur-fast), color var(--dur-fast); }
.chip.is-toggle:hover { background: var(--hover); }
.chip.is-toggle.is-active { background: var(--accent); color: var(--accent-text); }

.emoji-grid {

function makeNode(props = {}) {
  return {
    id: typeof props.id === "string" && props.id ? props.id : uid("n"),
    parentId: typeof props.parentId === "string" ? props.parentId : null,
    text: sanitizeText(props.text ?? "New node"),
    x: Number.isFinite(props.x) ? props.x : 0,
    y: Number.isFinite(props.y) ? props.y : 0,
    width: Number.isFinite(props.width) ? clamp(props.width, NODE.MIN_W, 900) : NODE.MIN_W,
    height: Number.isFinite(props.height) ? clamp(props.height, NODE.MIN_H, 900) : NODE.MIN_H,
    collapsed: !!props.collapsed,
    color: COLOR_KEYS.includes(props.color) ? props.color : "default",
    tags: sanitizeTags(props.tags),
    note: sanitizeText(props.note ?? "", LIMITS.MAX_NOTE),
    icon: typeof props.icon === "string" ? props.icon.slice(0, 8) : "",
    link: sanitizeUrl(props.link),
    fixedSize: !!props.fixedSize,
  };
}

function makeEdge(source, target, props = {}) {
  return {
    id: typeof props.id === "string" && props.id ? props.id : uid("e"),
    source,
    target,
  };
}

const NODE_FIELDS = Object.freeze([
  "parentId", "text", "x", "y", "width", "height",
  "collapsed", "color", "tags", "note", "icon", "link", "fixedSize",
]);
const STRUCTURE_FIELDS = new Set(["parentId", "collapsed"]);

class Store {
  constructor() {
    this.title = "Untitled map";
    this.nodes = new Map();
    this.edges = new Map();
    this.viewport = { x: 0, y: 0, zoom: VIEW.DEFAULT_ZOOM };
    this.selection = { nodes: new Set(), edges: new Set(), primary: null };
    this.clipboard = null;
    this.settings = { ...DEFAULT_SETTINGS };
    this.ui = {
      editingId: null,
      hoverNodeId: null,
      hoverEdgeId: null,
      searchOpen: false,
      searchTag: null,
      panelOpen: true,
      dirty: false,
      saveState: "saved",
    };
    this.recorder = null;      // set by HistoryManager while a transaction is open
    this._index = null;        // lazily rebuilt structure index
    this._hidden = null;
  }

  /* ---------------- history recording ---------------- */
  _record(op) { if (this.recorder) this.recorder(op); }
  _invalidate() { this._index = null; this._hidden = null; }
  _markDirty() {
    this.ui.dirty = true;
    bus.emit(EVENTS.DOC, { reason: "mutate" });
  }

  /* ---------------- node mutations ---------------- */
  addNode(node) {
    this.nodes.set(node.id, node);
    this._invalidate();
    this._record({ k: "node.del", id: node.id });
    bus.emit(EVENTS.NODES, { added: [node.id] });
    bus.emit(EVENTS.STRUCTURE, null);
    this._markDirty();
    return node;
  }

  removeNode(id) {
    const node = this.nodes.get(id);
    if (!node) return null;
    this.nodes.delete(id);
    this._invalidate();
    this._record({ k: "node.add", node: clone(node) });
    this.selection.nodes.delete(id);
    if (this.selection.primary === id) this.selection.primary = null;
    bus.emit(EVENTS.NODES, { removed: [id] });
    bus.emit(EVENTS.STRUCTURE, null);
    this._markDirty();
    return node;
  }

  /** Applies a partial update, recording only the fields that actually change. */
  updateNode(id, patch) {
    const node = this.nodes.get(id);
    if (!node) return false;
    const before = {};
    const after = {};
    let structural = false;
    let changed = false;
    for (const key of NODE_FIELDS) {
      if (!(key in patch)) continue;
      const next = patch[key];
      const prev = node[key];
      const same = Array.isArray(next) && Array.isArray(prev) ? arraysEqual(next, prev) : next === prev;
      if (same) continue;
      before[key] = Array.isArray(prev) ? prev.slice() : prev;
      after[key] = Array.isArray(next) ? next.slice() : next;
      node[key] = after[key];
      changed = true;
      if (STRUCTURE_FIELDS.has(key)) structural = true;
    }
    if (!changed) return false;
    if (structural) this._invalidate();
    this._record({ k: "node.set", id, patch: before });
    bus.emit(EVENTS.NODES, { updated: [id], fields: Object.keys(after) });
    if (structural) bus.emit(EVENTS.STRUCTURE, null);
    this._markDirty();
    return true;
  }

  /* ---------------- edge mutations ---------------- */
  addEdge(edge) {
    this.edges.set(edge.id, edge);
    this._invalidate();
    this._record({ k: "edge.del", id: edge.id });
    bus.emit(EVENTS.EDGES, { added: [edge.id] });
    this._markDirty();
    return edge;
  }

  removeEdge(id) {
    const edge = this.edges.get(id);
    if (!edge) return null;
    this.edges.delete(id);
    this._invalidate();
    this._record({ k: "edge.add", edge: clone(edge) });
    this.selection.edges.delete(id);
    bus.emit(EVENTS.EDGES, { removed: [id] });
    this._markDirty();
    return edge;
  }

  /* ---------------- document-level ---------------- */
  setTitle(title) {
    const next = sanitizeText(title, 120).replace(/\n/g, " ").trim() || "Untitled map";
    if (next === this.title) return false;
    this._record({ k: "title.set", title: this.title });
    this.title = next;
    bus.emit(EVENTS.DOC, { reason: "title" });
    this._markDirty();
    return true;
  }

  updateSettings(patch, { silent = false } = {}) {
    const before = {};
    let changed = false;
    for (const key in patch) {
      if (!(key in this.settings) || this.settings[key] === patch[key]) continue;
      before[key] = this.settings[key];
      this.settings[key] = patch[key];
      changed = true;
    }
    if (!changed) return false;
    if (!silent) this._record({ k: "settings.set", patch: before });
    bus.emit(EVENTS.SETTINGS, Object.keys(patch));
    return true;
  }

  /** Wholesale replacement used by import / load / undo-of-import. */
  replaceDocument({ title, nodes, edges, viewport }) {
    this._record({
      k: "doc.set",
      snapshot: {
        title: this.title,
        nodes: Array.from(this.nodes.values()).map(clone),
        edges: Array.from(this.edges.values()).map(clone),
        viewport: { ...this.viewport },
      },
    });
    this.title = title || "Untitled map";
    this.nodes = new Map(nodes.map((n) => [n.id, n]));
    this.edges = new Map(edges.map((e) => [e.id, e]));
    if (viewport) this.viewport = { ...viewport };
    this.selection.nodes.clear();
    this.selection.edges.clear();
    this.selection.primary = null;
    this._invalidate();
    bus.emit(EVENTS.DOC, { reason: "replace" });
    bus.emit(EVENTS.NODES, { reset: true });
    bus.emit(EVENTS.EDGES, { reset: true });
    bus.emit(EVENTS.STRUCTURE, null);
    bus.emit(EVENTS.SELECTION, null);
    bus.emit(EVENTS.VIEWPORT, null);
    this._markDirty();
  }

  /* ---------------- viewport (never recorded in history) ---------------- */
  setViewport(next) {
    const v = this.viewport;
    const zoom = clamp(next.zoom ?? v.zoom, VIEW.MIN_ZOOM, VIEW.MAX_ZOOM);
    const x = next.x ?? v.x;
    const y = next.y ?? v.y;
    if (x === v.x && y === v.y && zoom === v.zoom) return false;
    v.x = x; v.y = y; v.zoom = zoom;
    bus.emit(EVENTS.VIEWPORT, null);
    return true;
  }

  /* ---------------- derived structure index ---------------- */
  index() {
    if (this._index) return this._index;
    const children = new Map();
    const edgesOf = new Map();
    const roots = [];
    for (const node of this.nodes.values()) {
      const pid = node.parentId;
      if (pid != null && this.nodes.has(pid)) {
        let list = children.get(pid);
        if (!list) { list = []; children.set(pid, list); }
        list.push(node.id);
      } else {
        roots.push(node.id);
      }
    }
    // Stable child order: vertical position, then insertion order.
    for (const list of children.values()) {
      list.sort((a, b) => this.nodes.get(a).y - this.nodes.get(b).y);
    }
    roots.sort((a, b) => this.nodes.get(a).y - this.nodes.get(b).y);
    for (const edge of this.edges.values()) {
      for (const side of [edge.source, edge.target]) {
        let list = edgesOf.get(side);
        if (!list) { list = []; edgesOf.set(side, list); }
        list.push(edge.id);
      }
    }
    this._index = { children, edgesOf, roots };
    return this._index;
  }

  childrenOf(id) { return this.index().children.get(id) || EMPTY_ARRAY; }
  edgeIdsOf(id) { return this.index().edgesOf.get(id) || EMPTY_ARRAY; }
  roots() { return this.index().roots; }
  node(id) { return this.nodes.get(id); }
  edge(id) { return this.edges.get(id); }
  nodeCount() { return this.nodes.size; }
  edgeCount() { return this.edges.size; }

  isTreeEdge(edge) {
    const target = this.nodes.get(edge.target);
    return !!target && target.parentId === edge.source;
  }

  parentOf(id) {
    const node = this.nodes.get(id);
    return node && node.parentId ? this.nodes.get(node.parentId) : undefined;
  }

  ancestors(id) {
    const out = [];
    let current = this.nodes.get(id);
    const guard = new Set();
    while (current && current.parentId && !guard.has(current.parentId)) {
      guard.add(current.parentId);
      current = this.nodes.get(current.parentId);
      if (current) out.push(current.id);
    }
    return out;
  }

  /** Depth-first subtree ids, excluding the root id itself. */
  descendants(id) {
    const out = [];
    const stack = [...this.childrenOf(id)];
    const seen = new Set();
    while (stack.length) {
      const cur = stack.pop();
      if (seen.has(cur)) continue;
      seen.add(cur);
      out.push(cur);
      const kids = this.childrenOf(cur);
      for (let i = kids.length - 1; i >= 0; i -= 1) stack.push(kids[i]);
    }
    return out;
  }

  subtree(id) { return [id, ...this.descendants(id)]; }

  isAncestorOf(ancestorId, id) {
    let cur = this.nodes.get(id);
    const guard = new Set();
    while (cur && cur.parentId) {
      if (cur.parentId === ancestorId) return true;
      if (guard.has(cur.parentId)) return false;
      guard.add(cur.parentId);
      cur = this.nodes.get(cur.parentId);
    }
    return false;
  }

  depthOf(id) { return this.ancestors(id).length; }

  siblingsOf(id) {
    const node = this.nodes.get(id);
    if (!node) return EMPTY_ARRAY;
    return node.parentId ? this.childrenOf(node.parentId) : this.roots();
  }

  /** Ids hidden because an ancestor is collapsed. */
  hiddenSet() {
    if (this._hidden) return this._hidden;
    const hidden = new Set();
    const walk = (id, hide) => {
      const node = this.nodes.get(id);
      if (!node) return;
      if (hide) hidden.add(id);
      const nextHide = hide || node.collapsed;
      for (const child of this.childrenOf(id)) walk(child, nextHide);
    };
    for (const rootId of this.roots()) walk(rootId, false);
    this._hidden = hidden;
    return hidden;
  }

  isHidden(id) { return this.hiddenSet().has(id); }

  visibleNodeIds() {
    const hidden = this.hiddenSet();
    const out = [];
    for (const id of this.nodes.keys()) if (!hidden.has(id)) out.push(id);
    return out;
  }

  /** Bounding box of visible nodes in world space. */
  contentBounds(ids = null) {
    const hidden = this.hiddenSet();
    const source = ids || this.nodes.keys();
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    let found = false;
    for (const id of source) {
      if (hidden.has(id)) continue;
      const node = this.nodes.get(id);
      if (!node) continue;
      found = true;
      if (node.x < minX) minX = node.x;
      if (node.y < minY) minY = node.y;
      if (node.x + node.width > maxX) maxX = node.x + node.width;
      if (node.y + node.height > maxY) maxY = node.y + node.height;
    }
    return found ? { x: minX, y: minY, w: maxX - minX, h: maxY - minY } : null;
  }

  pathLabel(id) {
    const chain = this.ancestors(id).reverse().map((aid) => firstLine(this.nodes.get(aid).text));
    return chain.length ? chain.join(" › ") : "";
  }

  allTags() {
    const counts = new Map();
    for (const node of this.nodes.values()) {
      for (const tag of node.tags) counts.set(tag, (counts.get(tag) || 0) + 1);
    }
    return Array.from(counts.entries()).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  }

  toJSON() {
    return {
      format: APP.FORMAT,
      version: APP.FORMAT_VERSION,
      app: `${APP.NAME} ${APP.VERSION}`,
      savedAt: new Date().toISOString(),
      title: this.title,
      viewport: { ...this.viewport },
      settings: { ...this.settings },
      nodes: Array.from(this.nodes.values()),
      edges: Array.from(this.edges.values()),
    };
  }
}

const EMPTY_ARRAY = Object.freeze([]);
const store = new Store();

/* ==========================================================================
 * MODULE: HistoryManager — transaction based undo/redo.
 * ========================================================================== */
class HistoryManager {
  constructor(target) {
    this.store = target;
    this.undoStack = [];
    this.redoStack = [];
    this.depth = 0;
    this.ops = null;
    this.label = "";
    this.applying = false;
  }

  begin(label) {
    if (this.applying) return false;
    this.depth += 1;
    if (this.depth > 1) return false;
    this.label = label;
    this.ops = [];
    this.store.recorder = (op) => this.ops.push(op);
    return true;
  }

  commit() {
    if (this.applying) return;
    this.depth = Math.max(0, this.depth - 1);
    if (this.depth > 0) return;
    this.store.recorder = null;
    const ops = this.ops;
    this.ops = null;
    if (!ops || !ops.length) return;
    this.undoStack.push({ label: this.label, ops });
    if (this.undoStack.length > LIMITS.MAX_HISTORY) this.undoStack.shift();
    this.redoStack.length = 0;
    bus.emit(EVENTS.HISTORY, this.info());
  }

  /** Runs fn inside a transaction; returns fn's value. */
  transact(label, fn) {
    this.begin(label);
    try {
      return fn();
    } finally {
      this.commit();
    }
  }

  /** Applies inverse ops and returns the ops needed to reverse the reversal. */
  _apply(ops) {
    const inverse = [];
    this.applying = true;
    this.store.recorder = (op) => inverse.push(op);
    for (let i = ops.length - 1; i >= 0; i -= 1) this._applyOne(ops[i]);
    this.store.recorder = null;
    this.applying = false;
    return inverse;
  }

  _applyOne(op) {
    const s = this.store;
    switch (op.k) {
      case "node.add": s.addNode(makeNode(op.node)); break;
      case "node.del": s.removeNode(op.id); break;
      case "node.set": s.updateNode(op.id, op.patch); break;
      case "edge.add": s.addEdge(makeEdge(op.edge.source, op.edge.target, { id: op.edge.id })); break;
      case "edge.del": s.removeEdge(op.id); break;
      case "settings.set": s.updateSettings(op.patch); break;
      case "title.set": s.setTitle(op.title); break;
      case "doc.set":
        s.replaceDocument({
          title: op.snapshot.title,
          nodes: op.snapshot.nodes.map(makeNode),
          edges: op.snapshot.edges.map((e) => makeEdge(e.source, e.target, { id: e.id })),
          viewport: op.snapshot.viewport,
        });
        break;
      default: break;
    }
  }

  undo() {
    const entry = this.undoStack.pop();
    if (!entry) return false;
    const inverse = this._apply(entry.ops);
    this.redoStack.push({ label: entry.label, ops: inverse });
    bus.emit(EVENTS.HISTORY, this.info());
    return entry.label;
  }

  redo() {
    const entry = this.redoStack.pop();
    if (!entry) return false;
    const inverse = this._apply(entry.ops);
    this.undoStack.push({ label: entry.label, ops: inverse });
    bus.emit(EVENTS.HISTORY, this.info());
    return entry.label;
  }

  clear() {
    this.undoStack.length = 0;
    this.redoStack.length = 0;
    bus.emit(EVENTS.HISTORY, this.info());
  }

  info() {
    return {
      canUndo: this.undoStack.length > 0,
      canRedo: this.redoStack.length > 0,
      undoLabel: this.undoStack.length ? this.undoStack[this.undoStack.length - 1].label : "",
      redoLabel: this.redoStack.length ? this.redoStack[this.redoStack.length - 1].label : "",
      size: this.undoStack.length,
    };
  }
}

const history = new HistoryManager(store);

/* ==========================================================================
 * MODULE: Graph — structural operations on nodes and edges.
 * Callers wrap these in history transactions (see Commands).
 * ========================================================================== */

const Graph = {
  isRoot(node) { return !node.parentId || !store.nodes.has(node.parentId); },

  /** +1 when the node sits on its parent's right, -1 on the left. */
  sideOf(node) {
    const parent = store.parentOf(node.id);
    if (!parent) return 1;
    return rectCenterX(rectOf(node)) < rectCenterX(rectOf(parent)) ? -1 : 1;
  },

  measured(node) {
    return NodeStyle.measure(node, Graph.isRoot(node));
  },

  /** Re-measures a node unless the user pinned its size manually. */
  autoSize(id) {
    const node = store.node(id);
    if (!node || node.fixedSize) return false;
    const m = Graph.measured(node);
    return store.updateNode(id, { width: m.width, height: m.height });
  },

  subtreeBounds(id) {
    const hidden = store.hiddenSet();
    const rects = [];
    for (const nid of store.subtree(id)) {
      if (hidden.has(nid) && nid !== id) continue;
      rects.push(rectOf(store.node(nid)));
    }
    return unionRects(rects);
  },

  /** Finds free space for a new child of `parentId` on the parent's side. */
  childPosition(parentId, size) {
    const parent = store.node(parentId);
    const dir = Graph.sideOf(parent);
    const x = dir > 0
      ? parent.x + parent.width + LAYOUT.H_GAP
      : parent.x - LAYOUT.H_GAP - size.width;
    const siblings = store.childrenOf(parentId);
    if (!siblings.length || parent.collapsed) {
      return { x, y: rectCenterY(rectOf(parent)) - size.height / 2 };
    }
    let bottom = -Infinity;
    for (const sid of siblings) {
      const b = Graph.subtreeBounds(sid);
      if (b) bottom = Math.max(bottom, b.y + b.h);
    }
    if (!Number.isFinite(bottom)) bottom = parent.y;
    return { x, y: bottom + LAYOUT.V_GAP };
  },

  createNode(props) {
    const node = makeNode(props);
    const m = NodeStyle.measure(node, !props.parentId);
    if (!props.width) node.width = m.width;
    if (!props.height) node.height = m.height;
    store.addNode(node);
    if (node.parentId && store.nodes.has(node.parentId)) {
      store.addEdge(makeEdge(node.parentId, node.id));
    }
    return node;
  },

  createChild(parentId, text = "New node") {
    const parent = store.node(parentId);
    if (!parent) return null;
    if (parent.collapsed) store.updateNode(parentId, { collapsed: false });
    const probe = makeNode({ text, parentId });
    const size = NodeStyle.measure(probe, false);
    const pos = Graph.childPosition(parentId, size);
    return Graph.createNode({ text, parentId, x: pos.x, y: pos.y, color: parent.color === "default" ? "default" : parent.color });
  },

  createSibling(id, text = "New node") {
    const node = store.node(id);
    if (!node) return null;
    if (!node.parentId) {
      return Graph.createNode({ text, x: node.x, y: node.y + node.height + LAYOUT.ROOT_GAP });
    }
    const created = Graph.createChild(node.parentId, text);
    if (created) {
      const bounds = Graph.subtreeBounds(id);
      store.updateNode(created.id, {
        x: node.x,
        y: (bounds ? bounds.y + bounds.h : node.y + node.height) + LAYOUT.V_GAP,
      });
    }
    return created;
  },

  /** Inserts a new node between `id` and its current parent. */
  insertParent(id, text = "New node") {
    const node = store.node(id);
    if (!node) return null;
    const oldParentId = node.parentId;
    const probe = makeNode({ text, parentId: oldParentId });
    const size = NodeStyle.measure(probe, !oldParentId);
    const dir = Graph.sideOf(node);
    const created = Graph.createNode({
      text,
      parentId: oldParentId,
      x: node.x - dir * (size.width + LAYOUT.H_GAP),
      y: rectCenterY(rectOf(node)) - size.height / 2,
    });
    if (!created) return null;
    Graph.reparent(id, created.id);
    return created;
  },

  /** Moves `childId` under `newParentId`, rewiring the tree edge. */
  reparent(childId, newParentId) {
    const child = store.node(childId);
    if (!child) return false;
    if (newParentId && (newParentId === childId || store.isAncestorOf(childId, newParentId))) return false;
    if (child.parentId === newParentId) return false;
    for (const eid of store.edgeIdsOf(childId).slice()) {
      const edge = store.edge(eid);
      if (edge && edge.target === childId && edge.source === child.parentId) store.removeEdge(eid);
    }
    store.updateNode(childId, { parentId: newParentId || null });
    if (newParentId) {
      const exists = store.edgeIdsOf(childId).some((eid) => {
        const e = store.edge(eid);
        return e && e.source === newParentId && e.target === childId;
      });
      if (!exists) store.addEdge(makeEdge(newParentId, childId));
    }
    return true;
  },

  connect(sourceId, targetId) {
    if (sourceId === targetId) return null;
    const source = store.node(sourceId);
    const target = store.node(targetId);
    if (!source || !target) return null;
    if (!Graph.canConnect(sourceId, targetId)) return null;
    const canAdopt = !target.parentId && !store.isAncestorOf(targetId, sourceId);
    if (canAdopt) {
      Graph.reparent(targetId, sourceId);
      return store.edgeIdsOf(targetId).map((eid) => store.edge(eid)).find((e) => e && e.source === sourceId) || null;
    }
    return store.addEdge(makeEdge(sourceId, targetId));
  },

  /** True when a connection between these two nodes would be new and legal. */
  canConnect(sourceId, targetId, { ignoreEdgeId = null } = {}) {
    if (sourceId === targetId) return false;
    if (!store.nodes.has(sourceId) || !store.nodes.has(targetId)) return false;
    return !store.edgeIdsOf(sourceId).some((eid) => {
      if (eid === ignoreEdgeId) return false;
      const e = store.edge(eid);
      return e && ((e.source === sourceId && e.target === targetId) || (e.source === targetId && e.target === sourceId));
    });
  },

  reconnect(edgeId, end, nodeId) {
    const edge = store.edge(edgeId);
    if (!edge || !store.nodes.has(nodeId)) return false;
    const nextSource = end === "source" ? nodeId : edge.source;
    const nextTarget = end === "target" ? nodeId : edge.target;
    // Validate first: a failed reconnect must leave the original edge intact.
    if (!Graph.canConnect(nextSource, nextTarget, { ignoreEdgeId: edgeId })) return false;
    const wasTree = store.isTreeEdge(edge);
    if (wasTree && store.node(edge.target)) store.updateNode(edge.target, { parentId: null });
    store.removeEdge(edgeId);
    return !!Graph.connect(nextSource, nextTarget);
  },

  disconnect(edgeId) {
    const edge = store.edge(edgeId);
    if (!edge) return false;
    if (store.isTreeEdge(edge)) store.updateNode(edge.target, { parentId: null });
    store.removeEdge(edgeId);
    return true;
  },

  /** Deletes nodes together with their descendants and incident edges. */
  deleteNodes(ids, { keepChildren = false } = {}) {
    const targets = new Set();
    for (const id of ids) {
      if (!store.nodes.has(id)) continue;
      if (keepChildren) targets.add(id);
      else for (const sid of store.subtree(id)) targets.add(sid);
    }
    if (!targets.size) return 0;
    if (keepChildren) {
      for (const id of Array.from(targets)) {
        const node = store.node(id);
        const newParent = node.parentId && !targets.has(node.parentId) ? node.parentId : null;
        for (const childId of store.childrenOf(id).slice()) {
          if (targets.has(childId)) continue;
          Graph.reparent(childId, newParent);
        }
      }
    }
    for (const id of targets) {
      for (const eid of store.edgeIdsOf(id).slice()) store.removeEdge(eid);
    }
    for (const id of targets) store.removeNode(id);
    return targets.size;
  },

  /* ---------------- serialization for clipboard / duplicate ---------------- */
  serialize(ids) {
    const set = new Set();
    for (const id of ids) for (const sid of store.subtree(id)) set.add(sid);
    const nodes = Array.from(set).map((id) => clone(store.node(id)));
    for (const node of nodes) if (node.parentId && !set.has(node.parentId)) node.parentId = null;
    const edges = [];
    for (const edge of store.edges.values()) {
      if (set.has(edge.source) && set.has(edge.target)) edges.push(clone(edge));
    }
    const rootIds = nodes.filter((n) => !n.parentId).map((n) => n.id);
    return { format: APP.FORMAT, kind: "fragment", nodes, edges, rootIds };
  },

  /** Inserts a serialized fragment; returns the created node ids. */
  insertFragment(fragment, { dx = 0, dy = 0, parentId = null } = {}) {
    if (!fragment || !Array.isArray(fragment.nodes) || !fragment.nodes.length) return [];
    const idMap = new Map();
    for (const node of fragment.nodes) idMap.set(node.id, uid("n"));
    const created = [];
    for (const raw of fragment.nodes) {
      const node = makeNode({
        ...raw,
        id: idMap.get(raw.id),
        parentId: raw.parentId ? idMap.get(raw.parentId) || null : (parentId || null),
        x: raw.x + dx,
        y: raw.y + dy,
      });
      store.addNode(node);
      created.push(node.id);
    }
    for (const raw of fragment.edges || []) {
      const source = idMap.get(raw.source);
      const target = idMap.get(raw.target);
      if (source && target) store.addEdge(makeEdge(source, target));
    }
    if (parentId && store.nodes.has(parentId)) {
      for (const raw of fragment.nodes) {
        if (raw.parentId) continue;
        const newId = idMap.get(raw.id);
        store.addEdge(makeEdge(parentId, newId));
      }
    }
    for (const id of created) Graph.autoSize(id);
    return created;
  },

  duplicate(ids) {
    const fragment = Graph.serialize(ids);
    return Graph.insertFragment(fragment, { dx: INTERACT.DUPLICATE_OFFSET, dy: INTERACT.DUPLICATE_OFFSET });
  },

  /* ---------------- movement ---------------- */
  /** Expands a selection to the full set of nodes a drag should carry. */
  dragSet(ids, includeDescendants = true) {
    const out = new Set();
    for (const id of ids) {
      if (!store.nodes.has(id)) continue;
      out.add(id);
      if (!includeDescendants) continue;
      for (const sid of store.descendants(id)) out.add(sid);
    }
    return out;
  },

  moveBy(ids, dx, dy) {
    if (!dx && !dy) return;
    for (const id of ids) {
      const node = store.node(id);
      if (node) store.updateNode(id, { x: node.x + dx, y: node.y + dy });
    }
  },

  /* ---------------- collapse ---------------- */
  toggleCollapse(id) {
    const node = store.node(id);
    if (!node || !store.childrenOf(id).length) return false;
    return store.updateNode(id, { collapsed: !node.collapsed });
  },

  setCollapsedAll(collapsed, { fromIds = null, keepRoots = true } = {}) {
    const ids = fromIds || Array.from(store.nodes.keys());
    let count = 0;
    for (const id of ids) {
      const node = store.node(id);
      if (!node || !store.childrenOf(id).length) continue;
      if (collapsed && keepRoots && Graph.isRoot(node)) continue;
      if (store.updateNode(id, { collapsed })) count += 1;
    }
    return count;
  },

  /** Expands every ancestor so `id` becomes visible. */
  revealNode(id) {
    let changed = false;
    for (const aid of store.ancestors(id)) {
      const node = store.node(aid);
      if (node && node.collapsed) changed = store.updateNode(aid, { collapsed: false }) || changed;
    }
    return changed;
  },
};

/* ==========================================================================
 * MODULE: Layout — tidy tree arrangement (iterative, stack-safe).
 * ========================================================================== */
const Layout = {
  visibleChildren(id) {
    const node = store.node(id);
    if (!node || node.collapsed) return EMPTY_ARRAY;
    return store.childrenOf(id);
  },

  /** Post-order pass computing the vertical space each subtree needs. */
  blockHeights(rootId) {
    const heights = new Map();
    const stack = [[rootId, false]];
    while (stack.length) {
      const frame = stack[stack.length - 1];
      const [id, expanded] = frame;
      const kids = Layout.visibleChildren(id);
      if (!expanded) {
        frame[1] = true;
        for (const kid of kids) stack.push([kid, false]);
        continue;
      }
      stack.pop();
      const node = store.node(id);
      if (!node) { heights.set(id, 0); continue; }
      if (!kids.length) { heights.set(id, node.height); continue; }
      const gap = Layout.gapFor(id);
      let sum = 0;
      for (const kid of kids) sum += (heights.get(kid) || 0) + gap;
      sum -= gap;
      heights.set(id, Math.max(node.height, sum));
    }
    return heights;
  },

  gapFor(id) {
    const node = store.node(id);
    return node && Graph.isRoot(node) ? LAYOUT.SUBTREE_GAP : LAYOUT.V_GAP;
  },

  stack(parentNode, kids, heights, dir) {
    const gap = Layout.gapFor(parentNode.id);
    let total = 0;
    for (const kid of kids) total += (heights.get(kid) || 0) + gap;
    total -= gap;
    let cursor = rectCenterY(rectOf(parentNode)) - total / 2;
    const out = [];
    for (const kid of kids) {
      const kidNode = store.node(kid);
      const blockH = heights.get(kid) || kidNode.height;
      out.push({
        id: kid,
        x: dir > 0 ? parentNode.x + parentNode.width + LAYOUT.H_GAP : parentNode.x - LAYOUT.H_GAP - kidNode.width,
        y: cursor + blockH / 2 - kidNode.height / 2,
        dir,
      });
      cursor += blockH + gap;
    }
    return out;
  },

  /** Arranges the subtree of `rootId`; the root itself does not move. */
  subtree(rootId, mode = store.settings.layoutMode) {
    const root = store.node(rootId);
    if (!root) return 0;
    const heights = Layout.blockHeights(rootId);
    const queue = [{ id: rootId, dir: 1 }];
    let moved = 0;
    while (queue.length) {
      const { id, dir } = queue.shift();
      const node = store.node(id);
      const kids = Layout.visibleChildren(id);
      if (!node || !kids.length) continue;
      let placements;
      if (id === rootId && mode === "balanced" && kids.length > 1) {
        const right = kids.filter((_, i) => i % 2 === 0);
        const left = kids.filter((_, i) => i % 2 === 1);
        placements = [...Layout.stack(node, right, heights, 1), ...Layout.stack(node, left, heights, -1)];
      } else {
        placements = Layout.stack(node, kids, heights, dir);
      }
      for (const p of placements) {
        if (store.updateNode(p.id, { x: round(p.x, 1), y: round(p.y, 1) })) moved += 1;
        queue.push({ id: p.id, dir: p.dir });
      }
    }
    return moved;
  },

  /** Tidies every root, stacking separate trees vertically. */
  all(mode = store.settings.layoutMode) {
    const roots = store.roots().slice();
    let moved = 0;
    let cursorY = null;
    for (const rootId of roots) {
      moved += Layout.subtree(rootId, mode);
      const bounds = Graph.subtreeBounds(rootId);
      if (!bounds) continue;
      if (cursorY == null) { cursorY = bounds.y + bounds.h + LAYOUT.ROOT_GAP; continue; }
      const delta = cursorY - bounds.y;
      if (Math.abs(delta) > 0.5) {
        Graph.moveBy(store.subtree(rootId), 0, delta);
        moved += 1;
      }
      const after = Graph.subtreeBounds(rootId);
      cursorY = (after ? after.y + after.h : cursorY) + LAYOUT.ROOT_GAP;
    }
    return moved;
  },
};

/* ==========================================================================
 * MODULE: AnimationManager — one rAF loop drives every tween.
 * ========================================================================== */
const AnimationManager = (() => {
  const tweens = new Map();
  let running = false;

  function frame(now) {
    running = false;
    for (const [key, tween] of Array.from(tweens)) {
      const t = tween.duration <= 0 ? 1 : clamp((now - tween.start) / tween.duration, 0, 1);
      tween.onUpdate(tween.ease(t), t);
      if (t >= 1) { tweens.delete(key); if (tween.onDone) tween.onDone(); }
    }
    if (tweens.size) schedule();
  }

  function schedule() {
    if (running) return;
    running = true;
    requestAnimationFrame(frame);
  }

  return {
    run(key, { duration, ease = easeInOutCubic, onUpdate, onDone }) {
      if (!store.settings.animate || duration <= 0) {
        onUpdate(1, 1);
        if (onDone) onDone();
        return;
      }
      tweens.set(key, { start: performance.now(), duration, ease, onUpdate, onDone });
      schedule();
    },
  };
})();

/* ==========================================================================
 * MODULE: Viewport — screen/world conversion, pan, zoom, framing.
 * ========================================================================== */
const Viewport = {
  width: 0,
  height: 0,

  measure() {
    const canvas = dom.canvas;
    this.width = canvas.clientWidth;
    this.height = canvas.clientHeight;
  },

  get x() { return store.viewport.x; },
  get y() { return store.viewport.y; },
  get zoom() { return store.viewport.zoom; },

  toWorldX(sx) { return (sx - store.viewport.x) / store.viewport.zoom; },
  toWorldY(sy) { return (sy - store.viewport.y) / store.viewport.zoom; },
  toScreenX(wx) { return wx * store.viewport.zoom + store.viewport.x; },
  toScreenY(wy) { return wy * store.viewport.zoom + store.viewport.y; },

  /** Pointer events give client coords; the canvas fills the window. */
  clientToWorld(clientX, clientY) {
    const rect = dom.canvas.getBoundingClientRect();
    return {
      x: this.toWorldX(clientX - rect.left),
      y: this.toWorldY(clientY - rect.top),
    };
  },

  worldRect(margin = 0) {
    const { x, y, zoom } = store.viewport;
    return {
      x: (-x - margin) / zoom,
      y: (-y - margin) / zoom,
      w: (this.width + margin * 2) / zoom,
      h: (this.height + margin * 2) / zoom,
    };
  },

  panBy(dxScreen, dyScreen) {
    store.setViewport({ x: store.viewport.x + dxScreen, y: store.viewport.y + dyScreen });
  },

  /** Zooms while keeping the world point under (sx, sy) pinned. */
  zoomTo(nextZoom, sx = this.width / 2, sy = this.height / 2) {
    const zoom = clamp(nextZoom, VIEW.MIN_ZOOM, VIEW.MAX_ZOOM);
    const current = store.viewport.zoom;
    if (zoom === current) return;
    const wx = this.toWorldX(sx);
    const wy = this.toWorldY(sy);
    store.setViewport({ zoom, x: sx - wx * zoom, y: sy - wy * zoom });
  },

  zoomByStep(direction, sx, sy) {
    const factor = direction > 0 ? VIEW.ZOOM_STEP : 1 / VIEW.ZOOM_STEP;
    this.zoomTo(store.viewport.zoom * factor, sx, sy);
  },

  target(bounds, { padding = VIEW.FIT_PADDING, maxZoom = 1.4 } = {}) {
    if (!bounds || bounds.w <= 0 || bounds.h <= 0) {
      return { x: this.width / 2, y: this.height / 2, zoom: 1 };
    }
    const zoom = clamp(
      Math.min((this.width - padding * 2) / bounds.w, (this.height - padding * 2) / bounds.h),
      VIEW.MIN_ZOOM,
      maxZoom
    );
    return {
      zoom,
      x: this.width / 2 - (bounds.x + bounds.w / 2) * zoom,
      y: this.height / 2 - (bounds.y + bounds.h / 2) * zoom,
    };
  },

  animateTo(next, duration = TIMING.VIEW_ANIM_MS) {
    const from = { ...store.viewport };
    AnimationManager.run("viewport", {
      duration,
      onUpdate: (e) => {
        store.setViewport({
          x: lerp(from.x, next.x, e),
          y: lerp(from.y, next.y, e),
          zoom: lerp(from.zoom, next.zoom, e),
        });
      },
    });
  },

  fit(ids = null, { animate = true } = {}) {
    const bounds = store.contentBounds(ids);
    const next = this.target(bounds);
    if (animate) this.animateTo(next);
    else store.setViewport(next);
  },

  centerOn(worldX, worldY, { zoom = null, animate = true } = {}) {
    const z = clamp(zoom ?? store.viewport.zoom, VIEW.MIN_ZOOM, VIEW.MAX_ZOOM);
    const next = { zoom: z, x: this.width / 2 - worldX * z, y: this.height / 2 - worldY * z };
    if (animate) this.animateTo(next);
    else store.setViewport(next);
  },

  centerNode(id, { zoom = null, animate = true } = {}) {
    const node = store.node(id);
    if (!node) return;
    this.centerOn(rectCenterX(rectOf(node)), rectCenterY(rectOf(node)), { zoom, animate });
  },
};

/* ==========================================================================
 * MODULE: Dom — cached element references (resolved once at boot).

const dom = {

  app: $("#app"),
  canvas: $("#canvas"),
  grid: $("#grid"),
  world: $("#world"),
  edgeCanvas: $("#edge-canvas"),
  nodeLayer: $("#node-layer"),
  overlay: $("#overlay"),
  toolbar: $("#toolbar"),
  search: $("#search"),
  panel: $("#panel"),
  statusbar: $("#statusbar"),
  dock: $("#dock"),
  minimapWrap: $("#minimap-wrap"),
  minimap: $("#minimap"),
  zoomBar: $("#zoom-bar"),

  debug: $("#debug"),
  layers: $("#layers"),
  live: $("#a11y-live"),
