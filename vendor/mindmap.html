  return {
    get(id) { return registry.get(id); },
    all() { return Array.from(registry.values()); },
    enabled(id, args) {
      const cmd = registry.get(id);
      if (!cmd) return false;
      return cmd.enabled ? !!cmd.enabled(args) : true;
    },
    checked(id) {
      const cmd = registry.get(id);
      return cmd && cmd.checked ? !!cmd.checked() : false;
    },
    run(id, args = {}) {
      const cmd = registry.get(id);
      if (!cmd) return null;
      if (cmd.enabled && !cmd.enabled(args)) return null;
      const result = cmd.run(args);
      Renderer.invalidate("chrome");
      return result;
    },
  };
})();

/* ==========================================================================
 * MODULE: Clipboard — bridges the app clipboard with the system clipboard.
 * ========================================================================== */
const Clipboard = {
  writeExternal(fragment) {
    try {
      const text = JSON.stringify(fragment);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
    } catch (_) { /* clipboard unavailable — internal clipboard still works */ }
  },

  parse(text) {
    if (!text || text.length > LIMITS.MAX_IMPORT_BYTES) return null;
    const trimmed = text.trim();
    if (!trimmed.startsWith("{")) return null;
    try {
      const data = JSON.parse(trimmed);
      if (data && data.format === APP.FORMAT && Array.isArray(data.nodes)) return Importer.normalizeFragment(data);
    } catch (_) { return null; }
    return null;
  },

  init() {
    on(document, "copy", (e) => {
      if (Editor.active || Keyboard.inTextField(e.target)) return;
      const fragment = Commands.run("edit.copy");
      if (fragment && e.clipboardData) {
        e.preventDefault();
        e.clipboardData.setData("text/plain", JSON.stringify(fragment));
      }
    });
    on(document, "cut", (e) => {
      if (Editor.active || Keyboard.inTextField(e.target)) return;
      const ids = Selection.nodeIds;
      if (!ids.length) return;
      const fragment = Graph.serialize(ids);
      if (e.clipboardData) {
        e.preventDefault();
        e.clipboardData.setData("text/plain", JSON.stringify(fragment));
      }
      store.clipboard = fragment;
      history.transact("Cut", () => Graph.deleteNodes(ids));
      Selection.clear();
    });
    on(document, "paste", (e) => {
      if (Editor.active || Keyboard.inTextField(e.target)) return;
      const text = e.clipboardData ? e.clipboardData.getData("text/plain") : "";
      if (!text) return;
      e.preventDefault();
      const fragment = Clipboard.parse(text);
      if (fragment) Commands.run("edit.paste", { fragment });
      else Commands.run("edit.pasteText", { text });
    });
  },
};

/* ==========================================================================
 * MODULE: KeyboardManager — declarative shortcut table + canvas navigation.
 * ========================================================================== */
const TEXT_FIELD_RESERVED = new Set([
  "mod+a", "mod+c", "mod+v", "mod+x", "mod+z", "mod+shift+z", "mod+y",
  "mod+enter", "mod+=", "mod++", "mod+-",
]);

const Keyboard = {
  map: new Map(),
  spaceDown: false,

  bindings: [
    { combo: "mod+z", command: "edit.undo" },
    { combo: "mod+shift+z", command: "edit.redo" },
    { combo: "mod+y", command: "edit.redo" },
    { combo: "mod+d", command: "node.duplicate" },
    { combo: "mod+a", command: "edit.selectAll" },
    { combo: "mod+shift+a", command: "edit.selectSubtree" },
    { combo: "mod+f", command: "search.open" },
    { combo: "/", command: "search.open" },
    { combo: "mod+s", command: "file.save" },
    { combo: "mod+o", command: "file.import" },
    { combo: "mod+e", command: "file.exportJson" },
    { combo: "mod+shift+e", command: "file.exportPng" },
    { combo: "mod+0", command: "view.zoomReset" },
    { combo: "mod+1", command: "view.fit" },
    { combo: "mod+2", command: "view.centerSelection" },
    { combo: "mod+=", command: "view.zoomIn" },
    { combo: "mod++", command: "view.zoomIn" },
    { combo: "=", command: "view.zoomIn" },
    { combo: "+", command: "view.zoomIn" },
    { combo: "mod+-", command: "view.zoomOut" },
    { combo: "-", command: "view.zoomOut" },
    { combo: "mod+g", command: "view.toggleGrid" },
    { combo: "mod+shift+g", command: "view.toggleSnap" },
    { combo: "mod+m", command: "view.toggleMinimap" },
    { combo: "mod+shift+p", command: "view.togglePanel" },
    { combo: "mod+shift+d", command: "view.toggleTheme" },
    { combo: "mod+shift+l", command: "layout.tidy" },
    { combo: "home", command: "view.centerRoot" },
    { combo: "tab", command: "node.addChild" },
    { combo: "enter", command: "node.addSibling" },
    { combo: "shift+enter", command: "node.addParent" },
    { combo: "mod+enter", command: "node.create" },
    { combo: "f2", command: "node.rename" },
    { combo: "delete", command: "node.delete" },
    { combo: "backspace", command: "node.delete" },
    { combo: "mod+shift+[", command: "node.collapseAll" },
    { combo: "mod+shift+]", command: "node.expandAll" },
    { combo: "c", command: "node.startConnect" },
    { combo: "?", command: "help.shortcuts" },
    { combo: "shift+?", command: "help.shortcuts" },
    { combo: "shift+/", command: "help.shortcuts" },
    { combo: "escape", run: () => Keyboard.onEscape() },
    { combo: "[", run: () => Keyboard.setCollapsed(true) },
    { combo: "]", run: () => Keyboard.setCollapsed(false) },
    { combo: "arrowleft", run: () => Keyboard.navigate("left") },
    { combo: "arrowright", run: () => Keyboard.navigate("right") },
    { combo: "arrowup", run: () => Keyboard.navigate("up") },
    { combo: "arrowdown", run: () => Keyboard.navigate("down") },
    { combo: "alt+arrowleft", run: () => Keyboard.nudge(-1, 0, false) },
    { combo: "alt+arrowright", run: () => Keyboard.nudge(1, 0, false) },
    { combo: "alt+arrowup", run: () => Keyboard.nudge(0, -1, false) },
    { combo: "alt+arrowdown", run: () => Keyboard.nudge(0, 1, false) },
    { combo: "alt+shift+arrowleft", run: () => Keyboard.nudge(-1, 0, true) },
    { combo: "alt+shift+arrowright", run: () => Keyboard.nudge(1, 0, true) },
    { combo: "alt+shift+arrowup", run: () => Keyboard.nudge(0, -1, true) },
    { combo: "alt+shift+arrowdown", run: () => Keyboard.nudge(0, 1, true) },
  ],

  init() {
    for (const binding of this.bindings) this.map.set(binding.combo, binding);
    for (let i = 0; i <= 9; i += 1) {
      this.map.set(String(i), { combo: String(i), run: () => Keyboard.applyColorSlot(i) });
    }
    on(window, "keydown", (e) => this.onKeyDown(e));
    on(window, "keyup", (e) => this.onKeyUp(e));
    on(window, "blur", () => this.releaseSpace());
  },

  inTextField(target) {
    if (!target || !target.tagName) return false;
    const tag = target.tagName;
    return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || target.isContentEditable;
  },

  comboOf(e) {
    const parts = [];
    if (e.metaKey || e.ctrlKey) parts.push("mod");
    if (e.altKey) parts.push("alt");
    if (e.shiftKey) parts.push("shift");
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase();
    parts.push(key === " " ? "space" : key);
    return parts.join("+");
  },

  onKeyDown(e) {
    if (e.key === " " || e.code === "Space") {
      if (this.inTextField(e.target)) return;
      if (!this.spaceDown) {
        this.spaceDown = true;
        Interaction.spaceDown = true;
        Interaction.setCursorClass();
      }
      e.preventDefault();
      return;
    }
    if (e.key === "Escape") {
      const handled = this.onEscape();
      if (handled) e.preventDefault();
      return;
    }
    const combo = this.comboOf(e);
    // Inside a text field only app-level chords pass through; the ones the
    // field itself owns (select-all, clipboard, undo) stay with the field.
    if (this.inTextField(e.target) && (!combo.startsWith("mod+") || TEXT_FIELD_RESERVED.has(combo))) return;

    const binding = this.map.get(combo);
    if (!binding) return;
    e.preventDefault();
    if (binding.command) Commands.run(binding.command);
    else if (binding.run) binding.run();
  },

  onKeyUp(e) {
    if (e.key === " " || e.code === "Space") this.releaseSpace();
  },

  releaseSpace() {
    if (!this.spaceDown) return;
    this.spaceDown = false;
    Interaction.spaceDown = false;
    Interaction.setCursorClass();
  },

  onEscape() {
    if (Editor.active) { Editor.cancel(); return true; }
    if (Dialog.isOpen()) { Dialog.close(); return true; }
    if (ContextMenu.isOpen()) { ContextMenu.close(); return true; }
    if (Shortcuts.isOpen()) { Shortcuts.close(); return true; }
    if (Interaction.cancelGesture()) return true;
    if (store.ui.searchOpen) { Search.close(); return true; }
    if (Selection.size) { Selection.clear(); return true; }
    return false;
  },

  setCollapsed(collapsed) {
    const ids = Selection.nodeIds.filter((id) => store.childrenOf(id).length);
    if (!ids.length) return;
    history.transact(collapsed ? "Collapse" : "Expand", () => {
      for (const id of ids) store.updateNode(id, { collapsed });
    });
  },

  nudge(dx, dy, large) {
    const step = large ? INTERACT.NUDGE_LARGE : INTERACT.NUDGE;
    const ids = Selection.dragSet(true);
    if (!ids.size) return;
    history.transact("Move node", () => {
      bus.batch(() => Graph.moveBy(ids, dx * step, dy * step));
    });
  },

  applyColorSlot(slot) {
    if (!store.selection.nodes.size) return;
    const color = slot === 0 ? "default" : COLOR_KEYS[slot] || "default";
    Commands.run("node.setColor", { color });
  },

  /** Tree-aware arrow navigation; "outward" follows the branch direction. */
  navigate(direction) {
    const currentId = store.selection.primary;
    if (!currentId) {
      const first = store.roots()[0];
      if (first) { Selection.only(first); Viewport.centerNode(first); }
      return;
    }
    const node = store.node(currentId);
    if (!node) return;
    const outward = Graph.sideOf(node) > 0 ? "right" : "left";
    let nextId = null;
    if (direction === outward) nextId = this.firstVisibleChild(currentId);
    else if (direction === "left" || direction === "right") nextId = node.parentId || null;
    else nextId = this.sibling(currentId, direction === "down" ? 1 : -1);
    if (!nextId) return;
    Selection.only(nextId);
    const target = store.node(nextId);
    if (target && !rectsIntersect(rectOf(target), Viewport.worldRect(-60))) Viewport.centerNode(nextId);
    Announce(firstLine(target.text) || "Empty node");
  },

  firstVisibleChild(id) {
    const node = store.node(id);
    if (!node) return null;
    if (node.collapsed) {
      history.transact("Expand", () => store.updateNode(id, { collapsed: false }));
    }
    const kids = store.childrenOf(id);
    return kids.length ? kids[0] : null;
  },

  sibling(id, offset) {
    const list = store.siblingsOf(id);
    const index = list.indexOf(id);
    if (index === -1) return null;
    const next = index + offset;
    return next >= 0 && next < list.length ? list[next] : null;
  },
};

function buildSegmented(label, options, isActive, onPick) {
  const wrap = el("div", { style: { padding: "4px 8px 6px" } });
  wrap.appendChild(el("div", { class: "panel-hint", text: label, style: { marginBottom: "5px" } }));
  const row = el("div", { class: "chips" });
  for (const option of options) {
    const chip = el("button", {
      class: `chip is-toggle${isActive(option.value) ? " is-active" : ""}`,
      text: option.label,
      onclick: (e) => { e.stopPropagation(); onPick(option.value); ContextMenu.close(); },
    });
    row.appendChild(chip);
  }
  wrap.appendChild(row);
  return wrap;
}

const buildLayoutModePicker = () => buildSegmented(
  "Layout direction",
  [{ value: "balanced", label: "Balanced" }, { value: "right", label: "Rightward" }],

);

        e.stopPropagation();
        if (ContextMenu.isOpen()) { ContextMenu.close(); return; }
        const rect = e.currentTarget.getBoundingClientRect();
        ContextMenu.open(rect.left, rect.bottom + 6, MAIN_MENU);
      },
    });
  },

  group(specs, optional = false) {
    const wrap = el("div", { class: "tb-group" });
    if (optional) wrap.dataset.optional = "true";
    for (const spec of specs) {
      const cmd = Commands.get(spec.command);
      if (!cmd) continue;
      const button = el("button", {
        class: "btn",
        title: cmd.accel ? `${cmd.label} · ${cmd.accel}` : cmd.label,
        "aria-label": cmd.label,
        html: iconMarkup(cmd.icon || "info"),
        onclick: () => Commands.run(spec.command),
      });
      if (spec.label) button.appendChild(el("span", { class: "btn-label", text: spec.label }));
      button.dataset.command = spec.command;
      wrap.appendChild(button);
      this.buttons.push(button);
    }
    return wrap;
  },

  update() {
    for (const button of this.buttons) {
      const id = button.dataset.command;
      button.disabled = !Commands.enabled(id);
      toggleClass(button, "is-active", Commands.checked(id));
    }
    if (this.titleEl && this.titleEl.textContent !== store.title) this.titleEl.textContent = store.title;
  },
};

/* ==========================================================================
 * MODULE: StatusBar — document and selection telemetry.
 * ========================================================================== */
const StatusBar = {
  refs: {},

  build() {
    clear(dom.statusbar);
    const dot = el("span", { class: "status-dot" });
    const saveText = el("span", { text: "Saved" });
    const saveItem = el("div", { class: "status-item", title: "Autosave status" });
    saveItem.append(dot, saveText);

    const counts = el("div", { class: "status-item" });
    counts.innerHTML = iconMarkup("brand");
    const countsText = el("span", { text: "" });
    counts.appendChild(countsText);

    const selection = el("div", { class: "status-item", dataset: { optional: "selection" } });
    selection.innerHTML = iconMarkup("cursor");
    const selectionText = el("span", { text: "No selection" });
    selection.appendChild(selectionText);

    const hint = el("div", { class: "status-item", dataset: { optional: "hint" } });
    const hintText = el("span", { text: "" });
    hint.appendChild(hintText);

    dom.statusbar.append(saveItem, el("span", { class: "divider" }), counts, el("span", { class: "divider" }), selection, hint);
    this.refs = { dot, saveText, countsText, selectionText, hintText };
  },

  update() {
    const r = this.refs;
    if (!r.dot) return;
    const state = store.ui.saveState;
    r.dot.dataset.state = state;
    r.saveText.textContent = state === "saving" ? "Saving…"
      : state === "error" ? "Save failed"
      : state === "dirty" ? "Unsaved"
      : "Saved";
    r.countsText.textContent = `${formatCount(store.nodeCount())} nodes · ${formatCount(store.edgeCount())} links`;
    const described = Selection.describe();
    r.selectionText.textContent = described ? `${described} selected` : "No selection";
    const info = history.info();
    r.hintText.textContent = info.canUndo ? `Last: ${info.undoLabel}` : "";
  },
};

/* ==========================================================================
 * MODULE: ZoomBar — zoom controls docked with the minimap.
 * ========================================================================== */
const ZoomBar = {
  level: null,

  build() {
    clear(dom.zoomBar);
    const out = el("button", { class: "btn btn--sm", title: "Zoom out", "aria-label": "Zoom out", html: iconMarkup("minus"), onclick: () => Commands.run("view.zoomOut") });
    this.level = el("button", { id: "zoom-level", title: "Reset zoom to 100%", "aria-label": "Reset zoom", text: "100%", onclick: () => Commands.run("view.zoomReset") });
    const inBtn = el("button", { class: "btn btn--sm", title: "Zoom in", "aria-label": "Zoom in", html: iconMarkup("plus"), onclick: () => Commands.run("view.zoomIn") });
    const fit = el("button", { class: "btn btn--sm", title: "Fit to screen", "aria-label": "Fit to screen", html: iconMarkup("fit"), onclick: () => Commands.run("view.fit") });
    dom.zoomBar.append(out, this.level, inBtn, el("span", { class: "divider" }), fit);
  },

  update() {
    if (!this.level) return;
    this.level.textContent = `${Math.round(store.viewport.zoom * 100)}%`;
  },
};

/* ==========================================================================
 * MODULE: Chrome — orchestrates the non-canvas UI in one pass.
 * ========================================================================== */
const Chrome = {
  build() {
    Toolbar.build();
    StatusBar.build();
    ZoomBar.build();
    Panel.build();
    Search.build();
    this.syncMinimap();
  },

  update() {
    Toolbar.update();
    StatusBar.update();
    ZoomBar.update();
    Panel.update();
  },

  syncMinimap() {
    dom.minimapWrap.hidden = !store.settings.showMinimap;
    if (store.settings.showMinimap) {
      Minimap.resize();
      Renderer.invalidate("minimap");
    }
  },
};

/* ==========================================================================
 * MODULE: PropertyPanel — inspector for the current selection.
 *
 * Text-like fields mutate the node directly while typing (fast, no history
 * churn) and commit one history entry on blur via Transforms.commit.
 * ========================================================================== */
const TEXT_FIELDS = Object.freeze(["text", "width", "height"]);
const NOTE_FIELDS = Object.freeze(["note", "width", "height"]);
const LINK_FIELDS = Object.freeze(["link", "width", "height"]);

const Panel = {
  refs: {},
  origin: null,
  originFields: null,

  build() {
    clear(dom.panel);
    const head = this.buildHead();
    const body = el("div", { class: "panel-body" });
    const empty = el("div", {
      class: "panel-empty",
      html: "Select a node to edit its text, colour, tags and notes.<br><br>Double-click the canvas to create a node.",
    });
    const content = el("div", { class: "panel-stack" });

    const text = this.buildTextField();
    const color = this.buildColorSection();
    const icon = this.buildIconSection();
    const tags = this.buildTagSection();
    const note = this.buildNoteField();
    const link = this.buildLinkField();
    const structure = this.buildStructureSection();
    const edge = this.buildEdgeSection();

    content.append(text.root, color.root, icon.root, tags.root, note.root, link.root, structure.root);
    body.append(empty, content, edge.root);
    dom.panel.append(head.root, body);

    this.refs = {
      title: head.title, body, empty, content,
      edgeSection: edge.root, edgeInfo: edge.info,
      textArea: text.input, swatches: color.swatches, emojiGrid: icon.grid,
      tagChips: tags.chips, tagInput: tags.input,
      noteArea: note.input, linkInput: link.input, structInfo: structure.info,
    };
    this.bindFields();
    this.sync();
  },

  buildHead() {
    const root = el("div", { class: "panel-head" });
    const title = el("div", { class: "panel-title", text: "Properties" });
    root.append(title, el("button", {
      class: "btn btn--ghost", title: "Hide panel", "aria-label": "Hide properties panel",
      html: iconMarkup("x"), onclick: () => Commands.run("view.togglePanel"),
    }));
    return { root, title };
  },

  buildTextField() {
    const root = el("div", { class: "field" });
    root.appendChild(el("label", { class: "field-label", text: "Text", for: "pf-text" }));
    const input = el("textarea", {
      class: "textarea", id: "pf-text", rows: 2,
      placeholder: "Node text", style: { minHeight: "52px" },
    });
    root.appendChild(input);
    return { root, input };
  },

  buildColorSection() {
    const root = el("div", { class: "panel-section" });
    root.appendChild(el("div", { class: "field-label", text: "Colour" }));
    const swatches = el("div", { class: "swatches", role: "group", "aria-label": "Node colour" });
    for (const color of COLORS) {
      const swatch = el("button", {
        class: "swatch", title: color.label, "aria-label": color.label,
        dataset: { color: color.key },
        onclick: () => Commands.run("node.setColor", { color: color.key }),
      });
      if (color.key !== "default") {
        swatch.style.setProperty("--sw", `var(--c-${color.key}-bg)`);
        swatch.style.borderColor = `var(--c-${color.key})`;
      }
      swatches.appendChild(swatch);
    }
    root.appendChild(swatches);
    return { root, swatches };
  },

  buildIconSection() {
    const root = el("div", { class: "panel-section" });
    root.appendChild(el("div", { class: "field-label", text: "Icon" }));
    const grid = el("div", { class: "emoji-grid", role: "group", "aria-label": "Node icon" });
    for (const emoji of EMOJI_SET) {
      grid.appendChild(el("button", {
        class: "emoji-btn", dataset: { icon: emoji },
        title: emoji || "No icon", "aria-label": emoji || "No icon",
        text: emoji || "∅",
        onclick: () => Commands.run("node.setIcon", { icon: emoji }),
      }));
    }
    root.appendChild(grid);
    return { root, grid };
  },

  buildTagSection() {
    const root = el("div", { class: "panel-section" });
    root.appendChild(el("div", { class: "field-label", text: "Tags" }));
    const chips = el("div", { class: "chips" });
    const input = el("input", { class: "input", placeholder: "Add tag and press Enter", "aria-label": "Add tag" });
    root.append(chips, input);
    return { root, chips, input };
  },

  buildNoteField() {
    const root = el("div", { class: "field" });
    root.appendChild(el("label", { class: "field-label", text: "Note", for: "pf-note" }));
    const input = el("textarea", { class: "textarea", id: "pf-note", placeholder: "Longer thoughts, context, links…" });
    root.appendChild(input);
    return { root, input };
  },

  buildLinkField() {
    const root = el("div", { class: "field" });
    root.appendChild(el("label", { class: "field-label", text: "Hyperlink", for: "pf-link" }));
    const row = el("div", { class: "panel-row" });
    const input = el("input", { class: "input", id: "pf-link", placeholder: "https://…", "aria-label": "Hyperlink" });
    row.append(input, el("button", {
      class: "btn", title: "Open link", "aria-label": "Open link", html: iconMarkup("link"),
      onclick: () => {
        const node = Selection.primaryNode();
        if (node && node.link) window.open(node.link, "_blank", "noopener");
      },
    }));
    root.appendChild(row);
    return { root, input };
  },

  buildStructureSection() {
    const root = el("div", { class: "panel-section" });
    root.appendChild(el("div", { class: "field-label", text: "Structure" }));
    const info = el("div", { class: "panel-hint", text: "" });
    root.appendChild(info);
    const rows = [
      ["node.addChild:Child", "node.addSibling:Sibling", "node.toggleCollapse:Fold"],
      ["edit.selectSubtree:Branch", "layout.tidyBranch:Tidy", "node.autoSize:Auto size"],
      ["node.duplicate:Duplicate", "node.detach:Detach", "node.delete:Delete"],
    ];
    for (const specs of rows) {
      const row = el("div", { class: "panel-row" });
      for (const spec of specs) {
        const [command, label] = spec.split(":");
        row.appendChild(this.actionButton(command, label, command === "node.delete" ? "btn--danger" : ""));
      }
      root.appendChild(row);
    }
    return { root, info };
  },

  buildEdgeSection() {
    const root = el("div", { class: "panel-section" });
    root.appendChild(el("div", { class: "field-label", text: "Connection" }));
    const info = el("div", { class: "panel-hint", text: "" });
    const row = el("div", { class: "panel-row" });
    row.appendChild(this.actionButton("edge.delete", "Delete connection", "btn--danger btn--wide"));
    root.append(info, row);
    return { root, info };
  },

  actionButton(command, label, extra = "") {
    const cmd = Commands.get(command);
    const button = el("button", {
      class: `btn btn--sm ${extra}`.trim(),
      title: cmd && cmd.accel ? `${cmd.label} · ${cmd.accel}` : (cmd ? cmd.label : label),
      text: label,
      style: { flex: "1 1 0" },
      onclick: () => Commands.run(command),
    });
    button.dataset.command = command;
    return button;
  },

  bindFields() {
    this.bindTextField();
    this.bindNoteField();
    this.bindLinkField();
    this.bindTagField();
  },

  bindTextField() {
    const input = this.refs.textArea;
    on(input, "focus", () => this.beginEdit(TEXT_FIELDS));
    on(input, "input", () => {
      const node = Selection.primaryNode();
      if (!node) return;
      node.text = sanitizeText(input.value);
      this.resizePrimaryLive(node);
      this.repaintPrimary();
    });
    on(input, "blur", () => this.commitEdit("Rename node", TEXT_FIELDS));
    on(input, "keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); input.blur(); }
      e.stopPropagation();
    });
  },

  bindNoteField() {
    const input = this.refs.noteArea;
    on(input, "focus", () => this.beginEdit(NOTE_FIELDS));
    on(input, "input", () => {
      const node = Selection.primaryNode();
      if (!node) return;
      node.note = sanitizeText(input.value, LIMITS.MAX_NOTE);
      this.resizePrimaryLive(node);
      this.repaintPrimary();
    });
    on(input, "blur", () => this.commitEdit("Edit note", NOTE_FIELDS));
    on(input, "keydown", (e) => e.stopPropagation());
  },

  bindLinkField() {
    const input = this.refs.linkInput;
    const apply = () => {
      const node = Selection.primaryNode();
      if (!node) return;
      node.link = sanitizeUrl(input.value);
      this.resizePrimaryLive(node);
      this.repaintPrimary();
    };
    on(input, "focus", () => this.beginEdit(LINK_FIELDS));
    on(input, "change", apply);
    on(input, "blur", () => { apply(); this.commitEdit("Edit link", LINK_FIELDS); });
    on(input, "keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
      e.stopPropagation();
    });
  },

  bindTagField() {
    const input = this.refs.tagInput;
    on(input, "keydown", (e) => {
      e.stopPropagation();
      if (e.key !== "Enter" && e.key !== ",") return;
      e.preventDefault();
      this.addTags(input.value);
      input.value = "";
    });
    on(input, "blur", () => {
      if (!input.value.trim()) return;
      this.addTags(input.value);
      input.value = "";
    });
  },

  beginEdit(fields) {
    const id = Selection.primaryId;
    if (!id) return;
    this.origin = Transforms.snapshot([id], fields);
    this.originFields = fields;
  },

  commitEdit(label, fields) {
    if (!this.origin) return;
    // Notes, links and tags add badges, so the node has to be re-measured.
    Transforms.commit(label, this.origin, fields, (ids) => ids.forEach((id) => Graph.autoSize(id)));
    this.origin = null;
    this.originFields = null;
    Renderer.invalidate("nodes", "edges", "minimap", "chrome");
  },

  /** Keeps the on-canvas box in step while a metadata field is being typed. */
  resizePrimaryLive(node) {
    if (node.fixedSize) return;
    const m = Graph.measured(node);
    node.width = m.width;
    node.height = m.height;
  },

  repaintPrimary() {
    const id = Selection.primaryId;
    if (!id) return;
    const element = NodeRenderer.elementFor(id);
    if (element) element.sig = "";
    Renderer.invalidate("nodes", "edges", "minimap");
  },

  addTags(raw) {
    const incoming = String(raw).split(",").map((t) => t.trim()).filter(Boolean);
    if (!incoming.length) return;
    const ids = Selection.nodeIds;
    if (!ids.length) return;
    history.transact("Add tag", () => {
      for (const id of ids) {
        const node = store.node(id);
        store.updateNode(id, { tags: sanitizeTags([...node.tags, ...incoming]) });
        Graph.autoSize(id);
      }
    });
  },

  removeTag(tag) {
    const ids = Selection.nodeIds;
    history.transact("Remove tag", () => {
      for (const id of ids) {
        const node = store.node(id);
        if (!node.tags.includes(tag)) continue;
        store.updateNode(id, { tags: node.tags.filter((t) => t !== tag) });
        Graph.autoSize(id);
      }
    });
  },

  sync() {
    toggleClass(dom.panel, "is-open", store.ui.panelOpen);
    setAttr(dom.panel, "aria-hidden", store.ui.panelOpen ? "false" : "true");
    // Lets the dock slide clear of the panel instead of hiding underneath it.
    dom.app.dataset.panel = store.ui.panelOpen ? "open" : "closed";
  },

  update() {
    const r = this.refs;
    if (!r.title) return;
    const nodeCount = store.selection.nodes.size;
    const edgeCount = store.selection.edges.size;

    r.empty.hidden = nodeCount > 0 || edgeCount > 0;
    r.content.hidden = nodeCount === 0;
    r.edgeSection.hidden = edgeCount === 0;

    if (edgeCount) this.updateEdgeInfo(edgeCount);
    if (nodeCount) {
      r.title.textContent = nodeCount > 1 ? `${nodeCount} nodes` : "Node";
      this.updateNodeFields(nodeCount);
      this.updateTags();
      this.updateStructure(Selection.primaryNode(), nodeCount);
    }
    this.updateActions();
  },

  updateEdgeInfo(edgeCount) {
    const r = this.refs;
    const edge = store.edge(Selection.edgeIds[0]);
    if (edge) {
      const a = store.node(edge.source);
      const b = store.node(edge.target);
      r.edgeInfo.textContent = a && b
        ? `${truncate(firstLine(a.text), 22)} → ${truncate(firstLine(b.text), 22)}` +
          `${store.isTreeEdge(edge) ? " (parent link)" : " (cross link)"}`
        : "";
    }
    r.title.textContent = edgeCount > 1 ? `${edgeCount} connections` : "Connection";
  },

  updateNodeFields(nodeCount) {
    const r = this.refs;
    const node = Selection.primaryNode();
    const multi = nodeCount > 1;
    for (const field of [r.textArea, r.noteArea, r.linkInput]) field.disabled = multi;
    r.textArea.placeholder = multi ? "Multiple nodes selected" : "Node text";

    const values = multi
      ? { text: "", note: "", link: "" }
      : { text: node.text, note: node.note, link: node.link };
    for (const [field, value] of [[r.textArea, values.text], [r.noteArea, values.note], [r.linkInput, values.link]]) {
      if (document.activeElement !== field) field.value = value;
    }

    const colorKey = multi ? this.sharedValue("color") : node.color;
    for (const swatch of r.swatches.children) toggleClass(swatch, "is-active", swatch.dataset.color === colorKey);
    const iconKey = (multi ? this.sharedValue("icon") : node.icon) || "";
    for (const button of r.emojiGrid.children) toggleClass(button, "is-active", (button.dataset.icon || "") === iconKey);
  },

  sharedValue(field) {
    let value = null;
    let first = true;
    for (const id of store.selection.nodes) {
      const node = store.node(id);
      if (!node) continue;
      if (first) { value = node[field]; first = false; continue; }
      if (node[field] !== value) return null;
    }
    return value;
  },

  updateTags() {
    const r = this.refs;
    const counts = new Map();
    for (const id of store.selection.nodes) {
      const node = store.node(id);
      if (!node) continue;
      for (const tag of node.tags) counts.set(tag, (counts.get(tag) || 0) + 1);
    }
    const key = Array.from(counts.keys()).sort().join("|");
    if (r.tagChips.dataset.key === key) return;
    r.tagChips.dataset.key = key;
    clear(r.tagChips);
    for (const tag of Array.from(counts.keys()).sort()) {
      const chip = el("span", { class: "chip" }, [tag]);
      chip.appendChild(el("button", {
        title: `Remove ${tag}`, "aria-label": `Remove tag ${tag}`,
        html: iconMarkup("x"), onclick: () => this.removeTag(tag),
      }));
      r.tagChips.appendChild(chip);
    }
  },

  updateStructure(node, nodeCount) {
    const r = this.refs;
    if (nodeCount > 1) {
      r.structInfo.textContent = `${nodeCount} nodes selected`;
      return;
    }
    if (!node) { r.structInfo.textContent = ""; return; }
    const children = store.childrenOf(node.id).length;
    const total = store.descendants(node.id).length;
    const depth = store.depthOf(node.id);
    const parts = [
      Graph.isRoot(node) ? "Root" : `Depth ${depth}`,
      `${children} direct`,
      `${total} in branch`,
      `${Math.round(node.width)}×${Math.round(node.height)}`,
    ];
    r.structInfo.textContent = parts.join(" · ");
  },

  updateActions() {
    for (const button of $$("[data-command]", dom.panel)) {
      const id = button.dataset.command;
      button.disabled = !Commands.enabled(id);
      toggleClass(button, "is-active", Commands.checked(id));
    }
  },
};

/* ==========================================================================
 * MODULE: ContextMenu — one renderer for every popup menu in the app.
 * ========================================================================== */
const ContextMenu = {
  element: null,
  cursor: -1,
  items: [],
  detach: null,

  isOpen() { return !!this.element; },

  open(clientX, clientY, spec) {
    this.close();
    const menu = el("div", { id: "context-menu", class: "glass", role: "menu" });
    this.items = [];
    for (const entry of spec) {
      const node = this.buildEntry(entry);
      if (node) menu.appendChild(node);
    }
    document.body.appendChild(menu);
    this.element = menu;
    this.position(clientX, clientY);
    this.cursor = -1;

    const offDown = on(window, "pointerdown", (e) => {
      if (!menu.contains(e.target)) this.close();
    }, true);
    const offKey = on(window, "keydown", (e) => this.onKeyDown(e), true);
    const offBlur = on(window, "blur", () => this.close());
    const offResize = on(window, "resize", () => this.close());
    this.detach = () => { offDown(); offKey(); offBlur(); offResize(); };
    return menu;
  },

  buildEntry(entry) {
    if (entry.type === "sep") return el("div", { class: "menu-sep", role: "separator" });
    if (entry.type === "label") return el("div", { class: "menu-label", text: entry.text });
    if (entry.type === "custom") return entry.build();
    if (entry.type === "colors") return this.buildColorRow(entry);

    const cmd = Commands.get(entry.command);
    if (!cmd) return null;
    const enabled = Commands.enabled(entry.command, entry.args || {});
    const checked = entry.toggle ? Commands.checked(entry.command) : false;
    const button = el("button", {
      class: `menu-item${cmd.danger || entry.danger ? " is-danger" : ""}`,
      role: "menuitem",
      disabled: !enabled,
      html: entry.toggle
        ? `<span class="menu-check${checked ? "" : " is-off"}">${iconMarkup("check")}</span>`
        : iconMarkup(entry.icon || cmd.icon || "info"),
    });
    button.appendChild(el("span", { class: "label", text: entry.label || cmd.label }));
    if (cmd.accel) button.appendChild(el("span", { class: "accel", text: cmd.accel }));
    button.addEventListener("click", () => {
      this.close();
      Commands.run(entry.command, entry.args || {});
    });
    if (enabled) this.items.push(button);
    return button;
  },

  buildColorRow() {
    const wrap = el("div", { class: "menu-colors", role: "group", "aria-label": "Node colour" });
    for (const color of COLORS) {
      const swatch = el("button", {
        class: "swatch", dataset: { color: color.key }, title: color.label, "aria-label": color.label,
        onclick: () => { this.close(); Commands.run("node.setColor", { color: color.key }); },
      });
      if (color.key !== "default") {
        swatch.style.setProperty("--sw", `var(--c-${color.key}-bg)`);
        swatch.style.borderColor = `var(--c-${color.key})`;
      }
      wrap.appendChild(swatch);
    }
    return wrap;
  },

  position(clientX, clientY) {
    const menu = this.element;
    const rect = menu.getBoundingClientRect();
    const x = clamp(clientX, 8, Math.max(8, window.innerWidth - rect.width - 8));
    const y = clamp(clientY, 8, Math.max(8, window.innerHeight - rect.height - 8));
    menu.style.left = `${x}px`;
    menu.style.top = `${y}px`;
  },

  onKeyDown(e) {
    if (!this.element) return;
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); this.close(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      e.stopPropagation();
      if (!this.items.length) return;
      const delta = e.key === "ArrowDown" ? 1 : -1;
      this.cursor = (this.cursor + delta + this.items.length) % this.items.length;
      this.items.forEach((item, i) => toggleClass(item, "is-cursor", i === this.cursor));
      this.items[this.cursor].scrollIntoView({ block: "nearest" });
      return;
    }
    if (e.key === "Enter" && this.cursor >= 0) {
      e.preventDefault();
      e.stopPropagation();
      this.items[this.cursor].click();
    }
  },

  close() {
    if (this.detach) this.detach();
    this.detach = null;
    if (this.element) this.element.remove();
    this.element = null;
    this.items = [];
    this.cursor = -1;
  },

  /* ---------------- menu specs ---------------- */
  openForNodes(x, y) {
    const multi = store.selection.nodes.size > 1;
    this.open(x, y, [
      { type: "colors" },
      { type: "sep" },
      { command: "node.rename" },
      { command: "node.addChild" },
      { command: "node.addSibling" },
      { command: "node.addParent" },
      { type: "sep" },
      { command: "node.toggleCollapse" },
      { command: "node.collapseBranch" },
      { command: "node.expandBranch" },
      { type: "sep" },
      { command: "edit.copy" },
      { command: "edit.cut" },
      { command: "edit.paste" },
      { command: "node.duplicate" },
      { type: "sep" },
      { command: "node.startConnect" },
      { command: "node.detach" },
      { command: "layout.tidyBranch" },
      { command: "node.autoSize" },
      { type: "sep" },
      { command: "edit.selectSubtree" },
      { command: "edit.selectSiblings" },
      { type: "sep" },
      { command: "node.delete", label: multi ? "Delete selection" : "Delete branch" },
      { command: "node.deleteKeepChildren" },
    ]);
  },

  openForEdge(x, y, edgeId) {
    const edge = store.edge(edgeId);
    const isTree = edge ? store.isTreeEdge(edge) : false;
    this.open(x, y, [
      { type: "label", text: isTree ? "Parent connection" : "Cross connection" },
      { command: "edge.delete", args: { id: edgeId } },
      { type: "sep" },
      { type: "custom", build: () => buildEdgeStylePicker() },
    ]);
  },

  openForCanvas(x, y, world) {
    this.open(x, y, [
      { command: "node.createAt", args: world, label: "New node here" },
      { command: "edit.paste", args: { world } },

      { type: "sep" },
      { command: "view.toggleGrid", toggle: true },
      { command: "view.toggleSnap", toggle: true },
      { command: "view.toggleMinimap", toggle: true },
      { type: "sep" },

};

/* ==========================================================================
 * MODULE: Dialog — accessible confirm / prompt modals.
 * ========================================================================== */
const Dialog = {
  scrim: null,
  lastFocus: null,

  isOpen() { return !!this.scrim; },

  open(build) {
    this.close();
    this.lastFocus = document.activeElement;
    const scrim = el("div", { class: "scrim" });
    const modal = el("div", { class: "modal modal--sm", role: "dialog", "aria-modal": "true" });
    build(modal, () => this.close());
    scrim.appendChild(modal);
    scrim.addEventListener("pointerdown", (e) => { if (e.target === scrim) this.close(); });
    dom.app.appendChild(scrim);
    this.scrim = scrim;
    const focusable = $("input, textarea, button.btn--primary", modal) || $("button", modal);
    if (focusable) focusable.focus();
    return modal;
  },

  close() {
    if (!this.scrim) return;
    this.scrim.remove();
    this.scrim = null;
    if (this.lastFocus && this.lastFocus.focus) this.lastFocus.focus({ preventScroll: true });
    this.lastFocus = null;
  },

  confirm(title, message, onConfirm, { confirmLabel = "Continue", danger = false } = {}) {
    this.open((modal, close) => {
      const head = el("div", { class: "modal-head" }, [el("div", { class: "modal-title", text: title })]);
      const body = el("div", { class: "modal-body" }, [el("div", { class: "panel-hint", text: message, style: { fontSize: "13px", lineHeight: "1.55" } })]);
      const foot = el("div", { class: "modal-foot" });
      foot.append(
        el("button", { class: "btn", text: "Cancel", onclick: close }),
        el("button", {
          class: `btn ${danger ? "btn--danger" : "btn--primary"}`,
          text: confirmLabel,
          onclick: () => { close(); onConfirm(); },
        })
      );
      modal.append(head, body, foot);
    });
  },

  prompt(title, initial, onSubmit) {
    this.open((modal, close) => {
      const head = el("div", { class: "modal-head" }, [el("div", { class: "modal-title", text: title })]);
      const input = el("input", { class: "input", value: initial, "aria-label": title });
      const body = el("div", { class: "modal-body" }, [input]);
      const submit = () => { const value = input.value.trim(); close(); if (value) onSubmit(value); };
      input.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "Enter") { e.preventDefault(); submit(); }
        if (e.key === "Escape") { e.preventDefault(); close(); }
      });
      const foot = el("div", { class: "modal-foot" });
      foot.append(
        el("button", { class: "btn", text: "Cancel", onclick: close }),
        el("button", { class: "btn btn--primary", text: "Save", onclick: submit })
      );
      modal.append(head, body, foot);
      setTimeout(() => { input.focus(); input.select(); }, 10);
    });
  },
};

/* ==========================================================================
 * MODULE: Search — instant filtering with tag facets and jump-to-node.
 * ========================================================================== */
const Search = {
  refs: {},
  results: [],
  cursor: 0,

  build() {
    clear(dom.search);

    const head = el("div", { class: "search-head", html: iconMarkup("search") });
    const input = el("input", {
      id: "search-input", type: "text", placeholder: "Search text, notes and tags…",
      "aria-label": "Search nodes", autocomplete: "off", spellcheck: false,
    });
    const count = el("span", { class: "search-count", text: "" });
    const close = el("button", {
      class: "btn btn--ghost", title: "Close search", "aria-label": "Close search",
      html: iconMarkup("x"), onclick: () => this.close(),
    });
    head.append(input, count, close);

    const tags = el("div", { class: "search-tags" });
    const results = el("div", { class: "search-results", role: "listbox", "aria-label": "Search results" });
    dom.search.append(head, tags, results);
    this.refs = { input, count, tags, results };

    const run = debounce(() => this.run(), TIMING.SEARCH_DEBOUNCE);
    on(input, "input", run);
    on(input, "keydown", (e) => this.onKeyDown(e));
  },

  open() {
    store.ui.searchOpen = true;
    toggleClass(dom.search, "is-open", true);
    setAttr(dom.search, "aria-hidden", "false");
    this.renderTags();
    this.refs.input.focus();
    this.refs.input.select();
    this.run();
  },

  close() {
    store.ui.searchOpen = false;
    toggleClass(dom.search, "is-open", false);
    setAttr(dom.search, "aria-hidden", "true");
    store.ui.searchTag = null;
    this.refs.input.value = "";
    RenderState.query = "";
    RenderState.matches = null;
    RenderState.dimOthers = false;
    this.results = [];
    clear(this.refs.results);
    Renderer.invalidate("nodes");
    dom.canvas.focus({ preventScroll: true });
  },

  onKeyDown(e) {
    e.stopPropagation();
    if (e.key === "Escape") { e.preventDefault(); this.close(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!this.results.length) return;
      const delta = e.key === "ArrowDown" ? 1 : -1;
      this.cursor = (this.cursor + delta + this.results.length) % this.results.length;
      this.paintCursor();
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      if (this.results.length) this.jumpTo(this.results[this.cursor].id, { keepOpen: e.shiftKey });
    }
  },

  toggleTag(tag) {
    store.ui.searchTag = store.ui.searchTag === tag ? null : tag;
    this.renderTags();
    this.run();
  },

  renderTags() {
    const tags = store.allTags().slice(0, 18);
    clear(this.refs.tags);
    this.refs.tags.hidden = !tags.length;
    for (const [tag, count] of tags) {
      const chip = el("button", {
        class: `chip is-toggle${store.ui.searchTag === tag ? " is-active" : ""}`,
        text: `${tag} ${count}`,
        "aria-pressed": store.ui.searchTag === tag ? "true" : "false",
        onclick: () => this.toggleTag(tag),
      });
      this.refs.tags.appendChild(chip);
    }
  },

  matches(node, query, tag) {
    if (tag && !node.tags.includes(tag)) return false;
    if (!query) return true;
    const q = query.toLowerCase();
    if (node.text.toLowerCase().includes(q)) return true;
    if (node.note && node.note.toLowerCase().includes(q)) return true;
    return node.tags.some((t) => t.toLowerCase().includes(q));
  },

  run() {
    const query = this.refs.input.value.trim();
    const tag = store.ui.searchTag;
    const hits = [];
    if (query || tag) {
      for (const node of store.nodes.values()) {
        if (this.matches(node, query, tag)) hits.push(node);
      }
      hits.sort((a, b) => {
        const aStarts = a.text.toLowerCase().startsWith(query.toLowerCase()) ? 0 : 1;
        const bStarts = b.text.toLowerCase().startsWith(query.toLowerCase()) ? 0 : 1;
        return aStarts - bStarts || a.text.length - b.text.length;
      });
    }
    this.results = hits.slice(0, 200);
    this.cursor = 0;
    RenderState.query = query;
    RenderState.matches = query || tag ? new Set(hits.map((n) => n.id)) : null;
    RenderState.dimOthers = !!(query || tag);
    this.refs.count.textContent = query || tag ? `${formatCount(hits.length)} found` : "";
    this.renderResults();
    Renderer.invalidate("nodes", "minimap");
  },

  renderResults() {
    const container = this.refs.results;
    clear(container);
    for (let i = 0; i < this.results.length; i += 1) {
      const node = this.results[i];
      const button = el("button", { class: "result", role: "option", dataset: { id: node.id } });
      button.appendChild(el("span", { class: "result-icon", text: node.icon || "•" }));
      const main = el("div", { class: "result-main" });
      main.appendChild(el("div", { class: "result-text", html: highlightMatches(truncate(firstLine(node.text) || "Empty node", 72), RenderState.query) }));
      const path = store.pathLabel(node.id);
      main.appendChild(el("div", { class: "result-path", text: path || "Root" }));
      button.appendChild(main);
      if (node.tags.length) button.appendChild(el("span", { class: "node-tag", text: node.tags[0] }));
      button.addEventListener("click", () => this.jumpTo(node.id, { keepOpen: true }));
      container.appendChild(button);
    }
    this.paintCursor();
  },

  paintCursor() {
    const children = Array.from(this.refs.results.children);
    children.forEach((child, i) => toggleClass(child, "is-cursor", i === this.cursor));
    if (children[this.cursor]) children[this.cursor].scrollIntoView({ block: "nearest" });
  },

  jumpTo(id, { keepOpen = false } = {}) {
    if (!store.nodes.has(id)) return;
    if (store.isHidden(id)) history.transact("Reveal node", () => Graph.revealNode(id));
    Selection.only(id);
    Viewport.centerNode(id, { zoom: Math.max(store.viewport.zoom, 0.85) });
    Announce(`Jumped to ${firstLine(store.node(id).text)}`);
    if (!keepOpen) this.close();
  },
};

/* ==========================================================================
 * MODULE: ThemeManager — light / dark / system.
 * ========================================================================== */
const Theme = {
  media: null,
  order: ["system", "light", "dark"],

  init() {
    this.media = window.matchMedia("(prefers-color-scheme: dark)");
    const listener = () => { if (store.settings.theme === "system") this.apply(); };
    if (this.media.addEventListener) this.media.addEventListener("change", listener);
    else this.media.addListener(listener);
    this.apply();
  },

  resolved() {
    const mode = store.settings.theme;
    if (mode === "system") return this.media && this.media.matches ? "dark" : "light";
    return mode === "dark" ? "dark" : "light";
  },

  apply() {
    const resolved = this.resolved();
    dom.root.dataset.theme = resolved;
    Palette.invalidate();
    const button = $('[data-command="view.toggleTheme"]', dom.toolbar);
    if (button) {
      const icon = store.settings.theme === "system" ? "eye" : resolved === "dark" ? "moon" : "sun";
      button.innerHTML = iconMarkup(icon);
      const label = store.settings.theme === "system" ? "Appearance: system" : `Appearance: ${resolved}`;
      setAttr(button, "title", `${label} · ${accel("D", { mod: true, shift: true })}`);
      setAttr(button, "aria-label", label);
    }
    Renderer.invalidate("minimap", "nodes");
  },

  cycle() {
    const index = this.order.indexOf(store.settings.theme);
    const next = this.order[(index + 1) % this.order.length];
    store.updateSettings({ theme: next }, { silent: true });
    Storage.saveSettings();
    this.apply();
    Toast.info(`Appearance: ${next}`);
  },
};
